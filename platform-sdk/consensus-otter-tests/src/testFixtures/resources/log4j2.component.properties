log4j2.plugins.scan=true

# Log4j2 resolves the clock once, when Log4jLogEvent is initialized on the first log event in the JVM. Setting
# log4j.Clock from a static initializer is therefore too late whenever anything has already logged, so it is declared
# here instead: PropertiesUtil reads this file before any class-initialization ordering can matter.
log4j.Clock=org.hiero.otter.fixtures.turtle.logging.TurtleLogClock
