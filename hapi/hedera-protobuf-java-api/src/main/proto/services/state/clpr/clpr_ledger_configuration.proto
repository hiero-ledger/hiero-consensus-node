syntax = "proto3";

package com.hedera.hapi.node.state.clpr;

// SPDX-License-Identifier: Apache-2.0
option java_package = "com.hederahashgraph.api.proto.java";
// <<<pbj.java_package = "com.hedera.hapi.node.state.clpr">>> This comment is special code for setting PBJ Compiler java package
option java_multiple_files = true;

import "services/timestamp.proto";

/**
 * The static configuration for a ledger participating in CLPR.
 */
message ClprLedgerConfiguration {
    /**
     * Protocol version. Implementations MUST reject configurations with
     * an unrecognized protocol_version.
     */
    uint32 protocol_version = 1;

    /**
     * CAIP-2 chain identifier (e.g., "hedera:mainnet", "eip155:1").
     * Immutable; set at genesis from configuration properties.
     */
    string chain_id = 2;

    /**
     * On-ledger address of this ledger's CLPR Service.
     *
     * For a Hiero ledger this MUST be the 20-byte EVM address of the CLPR
     * system contract (0x000000000000000000000000000000000000016e): the
     * service_address fixed in the ledger's ClprEndpointManifest, which peers
     * require this field to match (see §4.8). ClprUpdateLedgerConfiguration
     * rejects any other non-empty value and defaults this field to that
     * address when it is omitted.
     */
    bytes service_address = 3;

    /**
     * Consensus timestamp of the transaction that last modified this
     * configuration. Monotonically increasing.
     */
    proto.Timestamp timestamp = 4;

    /**
     * Capacity limits advertised by this ledger.
     */
    ClprThrottles throttles = 5;

    /**
     * Field 6 (`endpoints`, the former seed endpoint list) was removed. The
     * endpoint list lives in the ClprEndpointManifest in CLPR Service state
     * (see §2.4.2, §6.5). The number and name are reserved so they are never
     * reused.
     */
    reserved 6;
    reserved "endpoints";

    /**
     * Opaque starting trust anchor for the Channel. For Hiero TSS this is the
     * ledger_id of the ledger that produced this configuration (its own ledger_id
     * when this is the local-ledger config singleton, the peer's ledger_id when
     * received via state proof at completeChannel). Stored as
     * Channel.trust_anchor at completeChannel.
     *
     * Populated by the source ledger as part of ClprUpdateLedgerConfiguration once
     * its genesis-rooted ledger_id is available.
     */
    bytes initial_trust_anchor = 7;

    /**
     * Opaque identifier for initial_trust_anchor, stored as Channel.trust_anchor_id.
     * Non-empty iff initial_trust_anchor is non-empty.
     */
    bytes initial_trust_anchor_id = 8;

    /**
     * Largest local max_queue_depth advertised since reply-capacity tracking began.
     * Hiero maintains this value at genesis and on every local configuration update;
     * a supplied value is ignored. Zero in legacy state falls back to the current
     * max_queue_depth. Peer values never set this ledger's reserve. This local
     * accounting field is omitted from outgoing ConfigUpdate messages.
     * It remains present in configuration state proofs, so strict peer verifiers
     * MUST recognize this field before verifying new-channel configuration proofs.
     *
     * Each channel retains this many reply slots and this many ordinary slots so a
     * lower advertised limit cannot strand DATA sent under an earlier limit. Thus
     * lowering max_queue_depth limits new local sends but does not revoke historical
     * reply capacity. Total outbound depth is bounded by twice this value.
     */
    uint32 max_queue_depth_high_water = 9;
}

/**
 * Capacity limits published in the ledger's configuration.
 */
message ClprThrottles {
    /**
     * Hard cap: maximum messages in a single bundle.
     */
    uint32 max_messages_per_bundle = 1;

    /**
     * Maximum serialized size in bytes of a Data or application reply ClprMessagePayload,
     * including all metadata and protobuf framing. Oversized application returns produce
     * an empty APPLICATION_ERROR reply. DATA is not dispatched if even that empty reply
     * cannot fit. Incoming replies are hashed as attested, but an oversized reply is
     * delivered to the application as an empty APPLICATION_ERROR. Slashing still follows
     * the attested status. Control payloads are exempt.
     */
    uint32 max_message_payload_bytes = 2;

    /**
     * Maximum gas allocated to processing a single message.
     */
    uint64 max_gas_per_message = 3;

    /**
     * Current ordinary outbound queue limit per Channel. Hiero's locally initiated
     * DATA uses at most max_queue_depth - 1 slots, including queued control/reply
     * messages. A peer MUST NOT enqueue new DATA if that would exceed the most
     * recently received advertised max_queue_depth in outstanding DATA to this
     * ledger. DATA already outstanding when a lower limit arrives may drain.
     *
     * Hiero retains ordinary and reply budgets based on max_queue_depth_high_water
     * so DATA sent under an earlier higher limit can still be answered after a
     * configuration reduction. Peers that exceed advertised credit can stall their
     * channel; administrative force-close remains available for recovery.
     */
    uint32 max_queue_depth = 4;

    /**
     * Maximum total size of a serialized ClprSyncPayload.
     */
    uint64 max_sync_bytes = 5;

    /**
     * Maximum number of endpoints that may appear in the live ClprEndpointManifest
     * for this CLPR Service. Excess registrations are rejected.
     */
    uint32 max_local_endpoints = 6;

    /**
     * Maximum number of peer endpoints this ledger will cache per Channel
     * from the remote ClprEndpointManifest. Zero means no limit.
     */
    uint32 max_peer_endpoints = 7;
}

/**
 * An endpoint participating in CLPR syncs for this CLPR Service.
 * Used in ClprEndpointManifest.endpoints - the service-level on-ledger endpoint
 * manifest (see §2.4.2, §6.5).
 */
message ClprEndpoint {
    /**
     * Network address and port.
     */
    ClprServiceEndpoint service_endpoint = 1;

    /**
     * DER-encoded public certificate of the endpoint's TLS listener. Endpoints use ordinary TLS
     * for confidentiality only: peers do not validate this certificate, so it does not authenticate
     * the endpoint. Slated for deprecation.
     */
    bytes tls_certificate = 2;

    /**
     * On-ledger account associated with this endpoint node. Not used by the network.
     */
    bytes account_id = 3;
}

/**
 * Network address for a CLPR endpoint.
 */
message ClprServiceEndpoint {
    /**
     * IPv4 or IPv6 numeric address (no DNS hostnames).
     */
    string ip_address = 1;

    /**
     * Port number.
     */
    uint32 port = 2;
}
