/**
 * # Proof Key Publication Transaction
 *
 * ### Keywords
 * The key words "MUST", "MUST NOT", "REQUIRED", "SHALL", "SHALL NOT",
 * "SHOULD", "SHOULD NOT", "RECOMMENDED", "MAY", and "OPTIONAL" in this
 * document are to be interpreted as described in
 * [RFC2119](https://www.ietf.org/rfc/rfc2119) and clarified in
 * [RFC8174](https://www.ietf.org/rfc/rfc8174).
 */
syntax = "proto3";

package com.hedera.hapi.services.auxiliary.history;

// SPDX-License-Identifier: Apache-2.0
import "services/state/history/history_types.proto";
import "services/auxiliary/hints/hints_partial_signature.proto";

// SPDX-License-Identifier: Apache-2.0
option java_package = "com.hedera.hapi.services.auxiliary.history.legacy";
// <<<pbj.java_package = "com.hedera.hapi.services.auxiliary.history">>> This comment is special code for setting PBJ Compiler java package

option java_multiple_files = true;

/**
 * A transaction body to publish a node's history proof key and
 * WRAPS messages.
 */
message HistoryProofKeyPublicationTransactionBody {
  oneof data {
    /**
     * The proof key the submitting node intends to use when
     * contributing WRAPS messages for use in proving history
     * belongs to the chain of trust for the ledger id.
     */
    bytes proof_key = 1;

    /**
     * A WRAPS message from the submitting node.
     */
    bytes wraps_message = 2;
  }

  /**
   * The id of the proof construction this publication is for.
   */
  uint64 construction_id = 3;

  /**
   * The phase of the proof construction this key is being
   * published for.
   */
  com.hedera.hapi.node.state.history.WrapsPhase phase = 4;

  /**
   * For a key rotation's first WRAPS round, the submitting node's partial
   * signature under the active hinTS construction over the exact upcoming
   * hinTS verification key bytes. Its construction_id identifies the source
   * hinTS generation, independently of this body's history construction_id.
   * Required for key rotations and absent for genesis.
   */
  com.hedera.hapi.services.auxiliary.hints.HintsPartialSignatureTransactionBody hints_partial_signature = 5;
}
