syntax = "proto3";

package com.hedera.hapi.node.clpr;

// SPDX-License-Identifier: Apache-2.0
option java_package = "com.hederahashgraph.api.proto.java";
// <<<pbj.java_package = "com.hedera.hapi.node.clpr">>> This comment is special code for setting PBJ Compiler java package
option java_multiple_files = true;

/**
 * Phase 1 (Commit): Register a Connector commitment.
 *
 * Permissionless. Stores
 * keccak256(connectorId || pubKey) on-ledger so the reveal phase can verify it.
 * Anyone may call; only the holder of the matching private key can complete.
 * The referenced Channel must already exist.
 *
 * Fails with CLPR_CONNECTOR_ALREADY_EXISTS if the commitment is
 * already pending reveal or was already used to create a Connector, even one
 * that has since been deregistered.
 */
message ClprRegisterConnectorTransactionBody {
    /**
     * keccak256(connectorId || pubKey) where
     * connectorId = keccak256(channelId || pubKey || salt).
     * Must be exactly 32 bytes.
     */
    bytes commitment = 1;

    /**
     * The 32-byte ID of the existing Channel this Connector is intended for.
     * The commitment preimage is verified during completeConnector.
     */
    bytes channel_id = 2;
}
