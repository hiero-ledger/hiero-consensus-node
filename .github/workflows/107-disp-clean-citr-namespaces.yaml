# SPDX-License-Identifier: Apache-2.0
name: "107: [DISP] Clean CITR Namespaces"

# Replaces the hourly 903 cron. Chewie dispatches this (hourly) so long-running allocations don't
# fill their disks: in every CITR namespace on both perf clusters it deletes consensus-node stream
# files older than 59 minutes and empties the solo-streams/solo-backups MinIO buckets of objects
# older than an hour. It never deletes a namespace; Chewie owns allocation lifecycle.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: clean-citr-namespaces
  cancel-in-progress: false

env:
  MC_PATH: gs://performance-engineering-reports/permanent/mc

jobs:
  clean-namespaces:
    name: Clean CITR Namespaces
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access to Dallas Cluster
        id: auth-k8s-dal
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: k8s.pft.dal.lat.ope.eng.hashgraph.io
          certificate-ttl: 24h

      - name: List SSH Resources
        run: tsh -i "${{ steps.auth-ssh.outputs.identity-file }}" ls

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download MC utility
        run: |
          gcloud --no-user-output-enabled storage cp "${{ env.MC_PATH }}" mc
          chmod a+rx mc

      # Best effort: one namespace failing to clean must not stop the others.
      - name: Clean Dallas Namespaces
        run: |
          set +e
          set +x

          for namespace in $(kubectl get namespaces | awk '{print $1}' | grep -E 'solo[\-].*[\-]n[0-9]|chewie'); do
            echo "Cleaning ${namespace}"
            sh "${GITHUB_WORKSPACE}"/.github/workflows/support/citr/cronClean.sh "${namespace}"
          done
          exit 0

      - name: Authorize Teleport K8S Access to Chicago Cluster
        id: auth-k8s-chi
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: k8s.pft.chi.lat.ope.eng.hashgraph.io
          certificate-ttl: 24h

      - name: Clean Chicago Namespaces
        run: |
          set +e
          set +x

          for namespace in $(kubectl get namespaces | awk '{print $1}' | grep -E 'solo[\-].*[\-]n[0-9]|chewie'); do
            echo "Cleaning ${namespace}"
            sh "${GITHUB_WORKSPACE}"/.github/workflows/support/citr/cronClean.sh "${namespace}"
          done
          exit 0
