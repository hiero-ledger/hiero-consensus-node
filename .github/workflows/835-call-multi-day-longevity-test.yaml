# SPDX-License-Identifier: Apache-2.0
name: "835: [CALL] CITR Exec MDLT"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        default: "main"
        description: "Version of hiero-consensus-node: branch, tag, commit"
        type: string
      solo-version:
        required: true
        default: "v0.84.1"
        description: "Solo Version:"
        type: string
      nlg-accounts: #'-R -c 32 -a 100000000 -T 1000 -n 100000 -S hot -p 50 -tt 1m
        required: true
        default: "100000000"
        description: "Number of Accounts and NFT tokens (100000, 1000000, 20000000, 100000000, 500000000, 1000000000)"
        type: string
      nlg-time: #'-R -c 32 -a 100000000 -T 1000 -n 100000 -S hot -p 50 -tt 1m
        required: true
        default: "720"
        description: "Test execution time, mins (3, 9, 21, 180, 330)"
        type: string
      add-app-props:
        required: false
        default: ""
        type: string
        description: 'Add props to application.properties, e.g. "blockStream.streamMode=RECORDS". Newline is "\n"'
      add-settings:
        required: false
        default: ""
        type: string
        description: 'Add props to settings.txt, e.g. "state.saveStatePeriod, 300". Newline is "\n"'
      duration-minutes:
        required: false
        default: 8640
        description: "Chewie allocation lifetime in minutes (6 days); covers the 5-day (7200m) run plus log-review time"
        type: number
      reconnect-uptime:
        required: true
        default: "600"
        description: "Reconnect uptime (secs). Downtime is Uptime x 3"
        type: string
      request-timeout:
        required: false
        default: 3600
        description: "Time to wait for Chewie Allocation"
        type: number
      mdlt-length:
        required: false
        default: 7200
        description: "Length of the MDLT production run in minutes, launched after the smoke run (5 days by default)"
        type: number
      bnref:
        description: "BN version"
        type: string
        required: true
        default: ""
      nlg-version:
        required: true
        default: "0.14.3"
        description: "NLG Version:"
        type: string
      java-version:
        description: "Java JDK Version:"
        type: string
        required: false
    secrets:
      slack-report-webhook:
        required: true
        description: "Slack webhook for MDLT outputs notifications"
      github-token:
        required: true
        description: "GitHub Authorization Token for the workflow"
      chewie-host:
        required: true
        description: "Chewie Host"
      chewie-id-key:
        required: true
        description: "Chewie Identity Key"
    outputs:
      result:
        description: "Result of the MDLT Run"
        value: ${{ jobs.multi-day-longevity-test-result.outputs.result }}
      allocation-id:
        description: "Chewie Allocation ID for the MDLT run; pass to 225 to release the allocation early"
        value: ${{ jobs.acquire-kubernetes-resources.outputs.allocation-id }}

permissions:
  contents: write
  id-token: write
  actions: write

env:
  TIMEOUT_6H_LIMIT: 340
  GS_ROOT_DIR: gs://performance-engineering-reports/ephemeral/test_runs
  GS_ROOT_HTTPS: https://perf.analytics.eng.hashgraph.io/ephemeral/test_runs
  GRAFANA_SYSADM_DAL: https://grafana.lat.ope.eng.hashgraph.io/d/rYdddlPWk/node-exporter-single-node?orgId=1&timezone=utc&var-datasource=P5C24830FD6F1746E&var-job=performance-dallas-node-exporter
  GRAFANA_SYSADM_CHI: https://grafana.lat.ope.eng.hashgraph.io/d/rYdddlPWk/node-exporter-single-node?orgId=1&timezone=utc&var-datasource=P631E2BA859A814B3&var-job=performance-chicago-node-exporter
  NUM_OF_BLOCK_NODES: 3

jobs:
  get-chewie-jwt:
    uses: ./.github/workflows/858-call-get-chewie-jwt.yaml
    secrets:
      chewie-key: ${{ secrets.chewie-id-key }}
      chewie-host: ${{ secrets.chewie-host }}

  get-mdlt-config:
    uses: ./.github/workflows/861-call-get-test-config.yaml
    with:
      test-type: "mdlt"
      # Resource config is repo policy, not build content: read it from the workflow ref so the file
      # is always the current one (an older build tag may not have mdlt-config.json at all).
      ref: ${{ github.ref }}
    secrets:
      checkout-token: ${{ secrets.github-token }}

  validate-chewie-jwt:
    needs:
      - get-chewie-jwt
    uses: ./.github/workflows/860-call-validate-chewie-jwt.yaml
    with:
      # 860 only needs this repo's own tooling (support/chewie/decode-b64-jwt.sh), not the build
      # under test, so read it from the workflow ref like get-mdlt-config above.
      ref: ${{ github.ref }}
      chewie-expiration: ${{ needs.get-chewie-jwt.outputs.expiration }}
    secrets:
      chewie-jwt: ${{ needs.get-chewie-jwt.outputs.jwt }}
      checkout-token: ${{ secrets.github-token }}

  acquire-kubernetes-resources:
    needs:
      - validate-chewie-jwt
      - get-chewie-jwt
      - get-mdlt-config
    uses: ./.github/workflows/859-call-create-chewie-request.yaml
    with:
      instances-cn-qty: ${{ fromJSON(needs.get-mdlt-config.outputs.cn-qty) }}
      instances-cn-cpu: ${{ fromJSON(needs.get-mdlt-config.outputs.cn-cpu-request) }}
      instances-cn-memory-mb: ${{ fromJSON(needs.get-mdlt-config.outputs.cn-mem-request-mb) }}
      instances-aux-qty: ${{ fromJSON(needs.get-mdlt-config.outputs.aux-qty) }}
      instances-aux-cpu: ${{ fromJSON(needs.get-mdlt-config.outputs.aux-cpu-request) }}
      instances-aux-memory-mb: ${{ fromJSON(needs.get-mdlt-config.outputs.aux-mem-request-mb) }}
      duration-minutes: ${{ inputs.duration-minutes }}
      request-timeout: ${{ inputs.request-timeout }}
    secrets:
      github-token: ${{ secrets.github-token }}
      chewie-token: ${{ needs.get-chewie-jwt.outputs.jwt }}
      chewie-host: ${{ secrets.chewie-host }}

  print-allocation-details:
    runs-on: hl-cn-default-lin-sm
    needs:
      - acquire-kubernetes-resources
    if: ${{ !cancelled() && needs.acquire-kubernetes-resources.result == 'success' }}
    env:
      K8S_CLUSTER: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
      NAMESPACE: ${{ needs.acquire-kubernetes-resources.outputs.namespace }}
      NETWORK_ID: ${{ needs.acquire-kubernetes-resources.outputs.network-id }}
      OWNER: ${{ needs.acquire-kubernetes-resources.outputs.owner }}
    steps:
      - name: Harden Runner
        id: harden-runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Output Allocation Details
        run: |
          echo "::group::Output Step Summary"
          echo "## Allocation Details" > "${GITHUB_STEP_SUMMARY}"
          echo "- **Allocation ID**: ${{ needs.acquire-kubernetes-resources.outputs.allocation-id }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Namespace**: ${NAMESPACE}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **FQDN**: ${K8S_CLUSTER}" | tee -a  "${GITHUB_STEP_SUMMARY}"
          echo "- **CN Quantity**: ${{ needs.acquire-kubernetes-resources.outputs.cn-quantity }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Aux Node Quantity**: ${{ needs.acquire-kubernetes-resources.outputs.aux-quantity }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Network ID**: ${NETWORK_ID}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Owner**: ${OWNER}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Request Expiration (UTC)**: ${{ needs.acquire-kubernetes-resources.outputs.request-expiration }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "::endgroup::"

  longevity-tests-start:
    name: Start
    runs-on: hl-cn-mdlt-lin-lg
    if: ${{ !cancelled() && needs.acquire-kubernetes-resources.result == 'success' }}
    outputs:
      run-hcn-version: ${{ steps.set-hcn-version.outputs.run-hcn-version }}
      commit-sha: ${{ steps.hederahash.outputs.sha }}
      waiterMatrix: ${{ steps.matrix.outputs.value }}
      kubernetes-cluster: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
    needs:
      - acquire-kubernetes-resources
    env:
      K8S_CLUSTER: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
      NAMESPACE: ${{ needs.acquire-kubernetes-resources.outputs.namespace }}
      NETWORK_ID: ${{ needs.acquire-kubernetes-resources.outputs.network-id }}
      OWNER: ${{ needs.acquire-kubernetes-resources.outputs.owner }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          # The workflow ref supplies the CITR support tooling (kubectlt, Taskfiles, values files).
          # The CN and BN under test are cloned into subdirectories by the next two steps.
          checkout-ref: "${{ github.ref }}"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout target CN Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: target_consensus_node
          ref: ${{ inputs.ref }}

      - name: Checkout target BN Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "hiero-ledger/hiero-block-node"
          path: target_block_node
          ref: ${{ inputs.bnref }}

      - name: Set Grafana Details
        id: set-grafana-url
        run: |
          grafana_url="${{ env.GRAFANA_SYSADM_DAL }}"
          if [[ "${K8S_CLUSTER}" =~ [.]chi[.] ]]; then
            grafana_url="${{ env.GRAFANA_SYSADM_CHI }}"
          fi
          echo "grafana-url=${grafana_url}" >> "${GITHUB_OUTPUT}"

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.35.0

      # support/citr/kubectlt resolves the real binary as "kubectl.orig", so it only works once this
      # rename has happened. Every job in this workflow that talks to the cluster needs this step.
      - name: kubectl wrapper
        run: |
          kubectl=$(which kubectl)
          sudo mv ${kubectl} ${kubectl}.orig
          sudo cp "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt ${kubectl}
          sudo chmod a+rx ${kubectl}
          which kubectl

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: ${{ env.K8S_CLUSTER }}
          certificate-ttl: 24h

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Helm
        shell: bash
        run: |
          sudo ln -s $(find /home/runner/_work/_tool/helm/ -type f -path '*/linux-amd64/*' -name 'helm') /usr/bin/helm
          which helm
          helm version

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "${{ inputs.java-version }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: wrapper

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.39.2

      - name: OS check procedure
        id: setup
        shell: bash
        run: |
          set +x
          set +e
          export TERM=vt100
          echo Setup procedure ...
          cat /etc/*elease
          sudo apt-get update
          sudo apt-get install -qq -y net-tools iputils-ping node-typescript coreutils jq xxd openssl

      - name: Create report dir
        shell: bash
        run: |
          mkdir "${{ github.workspace }}"/report

      - name: Set CN Version
        id: set-hcn-version
        env:
          REF: ${{ inputs.ref }}
        run: |
          set +x
          set +e
          # trim the input ref
          echo "run-hcn-version=$(echo ${REF} | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Print parameters
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "inputs.ref=${REF}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "Network-ID=${NETWORK_ID}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "Owner=${OWNER}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.solo-version=${{ inputs.solo-version }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.nlg-accounts=${{ inputs.nlg-accounts }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.nlg-time=${{ inputs.nlg-time }}m" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.add-app-props=${{ inputs.add-app-props }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.add-settings=${{ inputs.add-settings }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "JOB_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt

      - name: Set hederahash sha value
        id: hederahash
        run: |
          hederahash="$(git -C target_consensus_node rev-parse HEAD)"
          echo "sha=${hederahash}" >> "${GITHUB_OUTPUT}"
          echo "hederahash=${hederahash}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt

      - name: Compile
        run: |
          set +x
          cd "${{ github.workspace }}"/target_consensus_node

          ./gradlew clean assemble

          cd "${{ github.workspace }}"

      - name: Compile BN
        if: false
        run: |
          cd "${{ github.workspace }}"/target_block_node
          ./gradlew app:distTar

          shortversion=$(echo "${{ inputs.bnref }}" | sed -e 's/^v\(.*\)/\1/g')
          cd ./block-node/app/build/distributions/
          rm -rf app-${shortversion}/plugins app-${shortversion}.tar
          tar cf app-${shortversion}.tar app-${shortversion}

          cd "${{ github.workspace }}"

      - name: Build Validator
        run: |
          cd "${{ github.workspace }}"/target_consensus_node
          ./gradlew --no-daemon :hedera-state-validator:fatModuleJar
          cd "${{ github.workspace }}"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2

      # Set up kind; needed for configuring the solo environment
      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30
          version: v0.26.0
          kubectl_version: v1.31.4
          verbosity: 3
          wait: 120s

      - name: Install Solo
        env:
          SOLO_VERSION: ${{ inputs.solo-version || 'latest' }}
        run: |
          npm install -g "@hiero-ledger/solo@${SOLO_VERSION}"

          # verify the installation
          solo --version

      - name: Deploy with Solo
        env:
          CONTEXT: hashgraph.teleport.sh-${{ env.K8S_CLUSTER }}
          REF: ${{ inputs.ref }}
        run: |
          set +x
          set +e
          curdir="$(pwd)"

          # Create the solo directory
          mkdir -p "${{ github.workspace }}"/solo && cd "${{ github.workspace}}"/solo

          # Generate the Taskfile.yml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/Taskfile.yml Taskfile.yml

          # Generate the Taskfile.citr.yml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/Taskfile.citr.yml Taskfile.citr.yml

          # Generate the log4j2.xml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/log4j2.xml log4j2.xml

          # Generate the nlg-values.yaml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/nlg-values.yaml nlg-values.yaml

          # Generate the init-containers-values7.yaml inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/init-containers-values7.yaml init-containers-values7.yaml

          # Generate the block-node-values.yaml inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/block-node-values.yaml block-node-values.yaml

          # Update Taskfile values
          sed -i -e "s@%HOME%@${HOME}@g" -e "s@%SOLO_NAMESPACE%@${NAMESPACE}@g" \
          -e "s@%HEDERA_SERVICES_ROOT%@${curdir}/target_consensus_node@g" Taskfile.yml

          # Update Init Containers and Block Node values
          sed -i -e "s@%NETWORK_ID%@${NETWORK_ID}@g" init-containers-values7.yaml block-node-values.yaml
          NETWORK_OWNER="${OWNER}"
          sed -i -e "s@%NETWORK_OWNER%@${NETWORK_OWNER}@g" init-containers-values7.yaml block-node-values.yaml

          BN_tag=$(echo "${{ inputs.bnref }}" | sed -e 's/^v\(.*\)/\1/g')
          sed -i -e "s@%BN_IMAGE_TAG%@${BN_tag}@g" block-node-values.yaml

          # Generate the application.properties file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/application.properties.txt application.properties

          # Generate the application.environment file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/application.environment.txt application.environment

          # Generate the settings.txt file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/settings.txt settings.txt

          if [[ "${{ inputs.add-app-props }}" != "" ]]
          then
            echo -e "${{ inputs.add-app-props }}" >> application.properties
            echo "New application.properties:"
            cat application.properties
          fi

          if [[ "${{ inputs.add-settings }}" != "" ]]
          then
            echo -e "${{ inputs.add-settings }}" >> settings.txt
            echo "New settings.txt:"
            cat settings.txt
          fi
          export NODE_COPY_CONCURRENT=1

          task

      - name: Add BlockNodes
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          export BLOCK_NODE_VERSION="${{ inputs.bnref }}"

          mv block-node-values.yaml block-node-values.yaml.orig

          #dedicate top-3 nodes for BN
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt get nodes --show-labels | grep "network-id=${NETWORK_ID}," | grep 'consensus-node' | sort -n -k 1 | awk '{print $1}' | head -n 1  | grep -n -E '^' > firstNode.txt

          for i in $(seq 1 1 ${{ env.NUM_OF_BLOCK_NODES }})
          do
           #create PVC values.yaml from template
           for pvc_name in application-state-storage archive-storage logging-storage live-storage plugins-storage
           do
             sed -e "s@%NODE_ID%@${i}@g" -e "s@%PVC_NAME%@${pvc_name}@g" "${{ github.workspace }}"/.github/workflows/support/citr/block-node-pvc.yaml > block-node-pvc_${pvc_name}_${i}.yaml
             sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" create -f block-node-pvc_${pvc_name}_${i}.yaml
           done
           sleep 10
          done

          bnindex=1
          BNNODE=$(grep "${bnindex}:" firstNode.txt | awk -F : '{print $2}')

          sed -i -e "s@%SOLO_NAMESPACE%@${NAMESPACE}@g" block-node-values.yaml.orig

          #BN node 1
          sed -e "s@%NODE_ID%@1@g" -e "s@%BNNODE%@${BNNODE}@g" -e "s@%ANOTHER_BN_1%@block-node-2@g" -e "s@%ANOTHER_BN_2%@block-node-3@g" block-node-values.yaml.orig > block-node-values1.yaml
          cp block-node-values1.yaml block-node-values.yaml;
          export BN_MAPPING="node1=1,node2=2,node3=3,node4=3,node5=1,node6=2,node7=2"
          task solo:block:add

          #BN node 2
          sed -e "s@%NODE_ID%@2@g" -e "s@%BNNODE%@${BNNODE}@g" -e "s@%ANOTHER_BN_1%@block-node-1@g" -e "s@%ANOTHER_BN_2%@block-node-3@g" block-node-values.yaml.orig > block-node-values2.yaml
          cp block-node-values2.yaml block-node-values.yaml;
          export BN_MAPPING="node1=3,node2=1,node3=1,node4=2,node5=3,node6=3,node7=1"
          task solo:block:add

          #BN node 3
          sed -e "s@%NODE_ID%@3@g" -e "s@%BNNODE%@${BNNODE}@g" -e "s@%ANOTHER_BN_1%@block-node-1@g" -e "s@%ANOTHER_BN_2%@block-node-2@g" block-node-values.yaml.orig > block-node-values3.yaml
          cp block-node-values3.yaml block-node-values.yaml;
          export BN_MAPPING="node1=2,node2=2,node3=3,node4=1,node5=1,node6=1,node7=3"
          task solo:block:add

          sleep 30

      # Taskfile.citr.yml's default task stops after the deployment is created; keys, network deploy
      # and node setup live in installCNs, which must run after the block nodes exist.
      - name: Deploy CNs
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          task installCNs

      - name: Generate RSARoster
        run: |
          genesisFile=$(find ${HOME}/.solo -type f -name 'genesis-network.json')
          bash "${{ github.workspace }}"/.github/workflows/support/citr/genesisNetworkBNRSARoster.sh -i ${genesisFile} -o "${{ github.workspace}}"/solo/rsa-bootstrap-roster.json
          jq . "${{ github.workspace}}"/solo/rsa-bootstrap-roster.json

      - name: Update BlockNodes
        run: |

          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep 'block-node' | awk '{print $1}'`
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- bash -c "jpid=\$(ps -aef | grep -w java | grep -v grep | awk '{print \$2}'); cat /proc/\${jpid}/environ | strings | grep -v -E 'JAVA_OPTS|JAVA_TOOL_OPTIONS'> /tmp/env.sh"
          done

      - name: Update RSA BlockNodes
        run: |

          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep 'block-node' | awk '{print $1}'`
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- bash -c "set +e; mkdir -p /opt/hiero/block-node/application-state"
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" cp "${{ github.workspace}}"/solo/rsa-bootstrap-roster.json \
              ${pod}:/opt/hiero/block-node/application-state/rsa-bootstrap-roster.json
          done

      - name: Temp down BlockNodes
        run: |
          for pod in $(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep 'block-node' | awk '{print $1}')
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- bash -c "ps -aef | grep java | grep -v grep | awk '{print \$2}' | xargs kill -9"
          done

      - name: Start BlockNodes
        run: |

          for pod in $(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep 'block-node' | awk '{print $1}')
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- \
              bash -c "find /opt/hiero/block-node/data -type f -exec rm -f {} \;" >/dev/null 2>&1
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- \
              bash -c "rm -rf /opt/hiero/block-node/logs/blocknode.log*" >/dev/null 2>&1
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- \
              bash -c ". /tmp/env.sh; export BLOCK_NODE_SERVER_MAX_MESSAGE_SIZE_BYTES=300000000; export JAVA_OPTS='-Xms48G -Xmx52G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath="/tmp/dump.hprof"'; \
                       JAVA_TOOL_OPTIONS='-Djava.util.logging.config.file=/opt/hiero/block-node/logs/config/logging.properties -Dmetrics.exporter.openmetrics.http.hostname=0.0.0.0 -Dmetrics.exporter.openmetrics.http.port=16007 -Dmetrics.exporter.openmetrics.http.path=/metrics'; \
                       nohup bash /opt/hiero/block-node/*/bin/app > /opt/hiero/block-node/logs/log.txt 2>&1 &"
          done

      - name: Start CNs
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          task start

      - name: Solo logs
        if: ${{ !cancelled() && always() }}
        env:
          CONTEXT: hashgraph.teleport.sh-${{ env.K8S_CLUSTER }}
          REF: ${{ inputs.ref }}
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          task solo:node:logs

          sleep 30
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods
          cd "${{ github.workspace }}"
          mkdir solo_deploy
          cp -r "${HOME}"/.solo/logs solo_deploy/
          sh "${{ github.workspace }}"/.github/workflows/support/citr/getClusterErrors.sh "${NAMESPACE}"
          cp -r podlog_"${NAMESPACE}" solo_deploy/
          gcloud --no-user-output-enabled storage cp --recursive solo_deploy "${{ env.GS_ROOT_DIR }}/${REF}_${NAMESPACE}_${NETWORK_ID}_${{ github.run_number }}"/solo_deploy
          echo Done: solo deploy logs  in "${{ env.GS_ROOT_HTTPS }}/${REF}_${NAMESPACE}_${NETWORK_ID}_${{ github.run_number }}"/solo_deploy

      - name: Check filesystem mounts
        run: |
          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep 'network-node' | awk '{print $1}'`
          do
            echo "Pod ${pod}"
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${pod} -- bash -c "mount | grep '/dev/md0 on .*/data/saved'"
            if [[ ${?} -ne 0 ]]
            then
              echo "Error: /dev/md0 is not mounted for CN"
              exit 13
            fi
          done

      - name: Move to Github Workspace
        run: cd "${{ github.workspace }}"

      - name: Prepare NLG parameters
        run: |
          set +x
          set +e
          cd ${{ github.workspace }}/solo

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt get svc -n "${NAMESPACE}" -l "solo.hedera.com/type=network-node-svc" |\
            grep -v 'node10' | grep -v 'CLUSTER-IP' > networks.txt
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt get svc -n "${NAMESPACE}" -l "solo.hedera.com/type=network-node-svc" |\
            grep 'node10' | grep -v 'CLUSTER-IP' >> networks.txt

          # Generate the nlg-values.yaml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/nlg-values.yaml nlg-values.yaml

          # Generate the merkledb-values.yaml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/merkledb-values.yaml merkledb-values.yaml

          #Disable auto-start
          sed -i -e 's/NftTransferLoadTest/NftTransferLoadTestDONOTSTART/g' nlg-values.yaml
          grep -v 'x.y.z' nlg-values.yaml > new.yml

          cat networks.txt | awk '{print $3}' | perl -ne "~s/\n//g; print \"     - '\$_\\\:50211=0.0.\".(3+\$.-1).\"'\n\"" >> new.yml
          mv new.yml nlg-values.yaml

          sed -i -e "s@%NETWORK_ID%@${NETWORK_ID}@g" nlg-values.yaml
          NETWORK_OWNER="${OWNER}"
          sed -i -e "s@%NETWORK_OWNER%@${NETWORK_OWNER}@g" nlg-values.yaml

      - name: Deploy NLG test
        run: |
          set +x
          set +e
          cd "${{ github.workspace }}"/solo
          /usr/bin/helm upgrade --install --set appName=nlg nlg oci://artifacts.hashgraph.io/load-generator-helm-release-local/network-load-generator --version "${{ inputs.nlg-version }}" --values nlg-values.yaml -n "${NAMESPACE}"
          sleep 180
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods
          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          # Copy run version
          echo "run_number=${{ github.run_number }}" | tee -a "${{ github.workspace }}"/version_run.txt
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" cp "${{ github.workspace }}"/version_run.txt ${nlgpod}:/app/

      - name: JDK25 for NLG pod
        run: |
          set +x
          set +e
          nlgpod=`sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep nlg-network-load-generator | awk '{print $1}'`
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -- bash -c "rm -rf /opt/java/openjdk"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -- bash -c "\
          apt update; \
          apt install -y wget apt-transport-https gpg; \
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor | tee /etc/apt/trusted.gpg.d/adoptium.gpg > /dev/null; \
          echo \"deb https://packages.adoptium.net/artifactory/deb \$(awk -F= '/^VERSION_CODENAME/{print\$2}' /etc/os-release) main\" | tee /etc/apt/sources.list.d/adoptium.list; \
          apt update; \
          apt install -y temurin-25-jdk"

      - name: Deploy Validator
        run: |
          set +x
          set +e
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" \
            cp "${{ github.workspace }}"/target_consensus_node/hedera-state-validator/build/libs/hedera-state-validator-*-SNAPSHOT-all.jar network-node1-0:/tmp/

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" \
            exec -it network-node1-0 -c root-container -- bash -c "mkdir /opt/hgcapp/services-hedera/HapiApp2.0/data/saved/validation.tmp"

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" \
            cp "${{ github.workspace }}"/.github/workflows/support/citr/checkValidatorNode.sh network-node1-0:/opt/hgcapp/services-hedera/HapiApp2.0/checkValidatorNode.sh

      - name: Distribution of K8S nodes, SysAdmin Grafana
        run: |
          set +x
          set +e

          start_date=$(date +%Y-%m-%dT%T)
          echo "NODE                                      POD" | tee -a "${GITHUB_STEP_SUMMARY}"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods -o=custom-columns=NODE:.spec.nodeName,NAME:.metadata.name | grep -v -w NODE |\
            perl -ne "if (/^([^\s]+)\s+([^\s]+)\s*$/) {print \"[\$1\](${{ steps.set-grafana-url.outputs.grafana-url }}&from=${start_date}&var-nodename=\$1) \$2\n\"}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Start Longevity test
        # MDLT smoke: launch a short validation run (nlg-time defaults to 3m) so the GitHub runner is
        # released well within the 6h cap. After it completes, the longevity-launch-production job
        # re-connects and re-runs this same NLG command with -tt <mdlt-length>m (backgrounded) for the
        # full run, then the workflow exits. Chewie owns namespace teardown and reclaims it when the
        # allocation expires; this workflow never deletes the namespace.
        run: |
          run_NLGDebugparams="-Dorg.slf4j.simpleLogger.defaultLogLevel=debug" # e.g. -Dorg.slf4j.simpleLogger.defaultLogLevel=debug
          nlgpod=`sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep nlg-network-load-generator| awk '{print $1}'`
          n=`expr ${{ inputs.nlg-accounts }} / 1000`
          NLG_c=32

          test=LongevityLoadTest

          NLGargs="-K ECDSA -R -c ${NLG_c} -a ${{ inputs.nlg-accounts }}  -n ${n} -T 1000 -S hot -p 50"

          echo kubectl -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g \
            ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${test} \
            ${NLGargs} -tt ${{ inputs.nlg-time }}m > client.log 2>&1 &"

          kubectl -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g \
            ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${test} \
            ${NLGargs} -tt ${{ inputs.nlg-time }}m > client.log 2>&1 &"
          sleep 30
      - id: matrix
        run: |
          runs=$(((${{ inputs.nlg-time }}+${{ env.TIMEOUT_6H_LIMIT }}-1)/${{ env.TIMEOUT_6H_LIMIT }}))
          runs=$(expr ${runs} + 1)
          matrix=$(seq 1 1 ${runs} | perl -ne '~s/\n//g; print "\"$_\","' | sed -e 's/^\(.*\)[,]$/\1/g')
          echo "value=[${matrix}]"
          echo "value=[${matrix}]" >> "${GITHUB_OUTPUT}"

  longevity-tests-wait:
    name: Wait for Longevity test
    runs-on: hl-cn-mdlt-lin-lg
    if: ${{ !cancelled() && needs.acquire-kubernetes-resources.result == 'success' }}
    needs:
      - acquire-kubernetes-resources
      - longevity-tests-start
    env:
      K8S_CLUSTER: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
      NAMESPACE: ${{ needs.acquire-kubernetes-resources.outputs.namespace }}
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        value: ${{fromJSON(needs.longevity-tests-start.outputs.waiterMatrix || '["1"]')}}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Set Kubernetes Cluster
        id: set-k8s-cluster
        run: |
          echo "kubernetes-cluster=${K8S_CLUSTER}" >> "${GITHUB_OUTPUT}"

      # Checked out at the workflow ref for the support tooling (support/citr/kubectlt); this job
      # does not build anything from the ref under test. It must precede the kubectl wrapper step.
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.35.0

      - name: kubectl wrapper
        run: |
          kubectl=$(which kubectl)
          sudo mv ${kubectl} ${kubectl}.orig
          sudo cp "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt ${kubectl}
          sudo chmod a+rx ${kubectl}
          which kubectl

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: ${{ steps.set-k8s-cluster.outputs.kubernetes-cluster }}
          certificate-ttl: 24h

      - name: Create report dir
        shell: bash
        run: |
          mkdir "${{ github.workspace }}"/report

      - name: Wait for Longevity
        run: |
          echo "Matrix loop number ${{ matrix.value }}"
          set +x
          set +e

          check_status() {
           logfile=${1}
           ec=2 # continue
           grep -E 'Finished .*Test' ${logfile} >/dev/null
           if [[ ${?} -eq 0 ]]
           then
              echo "Test finished, exiting..."
              ec=0
           fi

           grep -E 'ERROR com.hedera.benchmark.*LoadTest - Setup|ERROR com.hedera.benchmark.*LoadTest - Test failed' ${logfile}
           if [[ ${?} -eq 0 ]]
           then
              echo "ERROR: Wrong config/environment"
              tail "${logfile}"
              ec=1
           fi

           return ${ec}
          }

          sleep 60

          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "tail /app/client.log"

          counter=0
          start_time=`date +%s`
          max_counter=${{ env.TIMEOUT_6H_LIMIT }}

          ec=2
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
          isRunning=${?}

          while [ \( ${isRunning} -eq 0 \) -a \( ${counter} -le ${max_counter} \) ]
          do

           sleep 60
           current_time=$(date +%s)
           counter=$(expr "${current_time}" - "${start_time}")
           counter=$(expr "${counter}" \/ 60)

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "tail /app/client.log" > client.log
           tail -n 1 client.log

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
           isRunning=${?}

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "grep -E 'ERROR com.hedera.benchmark|Finished .*Test' /app/client.log" > client_state.log
           check_status client_state.log
           ec=${?}
           if [[ ${ec} -lt 2 ]] #any terminal states 0 or 1, ec=2 is to continue
           then
             break
           fi
          done

          if [[ -f "${{ github.workspace }}"/report/client.log ]]
          then
            rm -rf "${{ github.workspace }}"/report/*
          fi

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" cp ${nlgpod}:/app/client.log "${{ github.workspace }}"/report/client.log

          check_status "${{ github.workspace }}"/report/client.log
          ec=${?}

          if [[ ${ec} -eq 2 ]]
          then
            echo "Continue to wait in next Runner ..."
            ec=0
          fi

          tail "${{ github.workspace }}"/report/client.log
          echo "Finished, exit code=${ec}"
          exit ${ec}

  # Re-connect to the cluster after the smoke run and launch the full production run (mdlt-length),
  # backgrounded, then exit while it is still running. We do NOT wait for it and we do NOT clean up
  # (Chewie owns namespace teardown). Status is checked out-of-band via 204-disp-mdlt-monitor.
  longevity-launch-production:
    name: Launch MDLT production run
    runs-on: hl-cn-mdlt-lin-lg
    if: ${{ !cancelled() && needs.longevity-tests-wait.result == 'success' }}
    needs:
      - acquire-kubernetes-resources
      - longevity-tests-start
      - longevity-tests-wait
    outputs:
      launched: ${{ steps.launch.outputs.launched }}
    env:
      K8S_CLUSTER: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
      NAMESPACE: ${{ needs.acquire-kubernetes-resources.outputs.namespace }}
    steps:
      # Checked out at the workflow ref for the support tooling (support/citr/kubectlt); this job
      # does not build anything from the ref under test.
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ github.ref }}"
          checkout-token: "${{ secrets.github-token }}"

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.35.0

      - name: kubectl wrapper
        run: |
          kubectl=$(which kubectl)
          sudo mv ${kubectl} ${kubectl}.orig
          sudo cp "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt ${kubectl}
          sudo chmod a+rx ${kubectl}
          which kubectl

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: ${{ needs.longevity-tests-start.outputs.kubernetes-cluster }}
          certificate-ttl: 24h

      - name: Launch MDLT production run
        id: launch
        env:
          NLG_ACCOUNTS: ${{ inputs.nlg-accounts }}
          PRODUCTION_MINUTES: ${{ inputs.mdlt-length }} # MDLT production run length (5 days by default)
        run: |
          set +x
          set +e
          kubectlt="sh ${{ github.workspace }}/.github/workflows/support/citr/kubectlt"
          run_NLGDebugparams="-Dorg.slf4j.simpleLogger.defaultLogLevel=debug"
          nlgpod=$(${kubectlt} -n "${NAMESPACE}" get pods | grep nlg-network-load-generator | awk '{print $1}')
          n=$(expr ${NLG_ACCOUNTS} / 1000)
          NLG_c=32
          test=LongevityLoadTest
          NLGargs="-K ECDSA -R -c ${NLG_c} -a ${NLG_ACCOUNTS}  -n ${n} -T 1000 -S hot -p 50"

          # Same NLG command as the smoke, but with the full production run time. Backgrounded with nohup
          # so it keeps running on the cluster after this workflow exits.
          echo kubectl -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g \
            ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${test} \
            ${NLGargs} -tt ${PRODUCTION_MINUTES}m > client.log 2>&1 &"

          kubectl -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g \
            ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${test} \
            ${NLGargs} -tt ${PRODUCTION_MINUTES}m > client.log 2>&1 &"

          sleep 30

          # Confirm the production load generator is running, then exit (do NOT wait for it to finish).
          ${kubectlt} -n "${NAMESPACE}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
          if [[ ${?} -ne 0 ]]; then
            echo "::error title=Production run not started::The ${PRODUCTION_MINUTES}m NLG process is not running in ${NAMESPACE}."
            echo "launched=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "launched=true" >> "${GITHUB_OUTPUT}"

      - name: Print monitor values to summary
        if: ${{ always() }}
        env:
          ALLOCATION_ID: ${{ needs.acquire-kubernetes-resources.outputs.allocation-id }}
          PRODUCTION_MINUTES: ${{ inputs.mdlt-length }}
        run: |
          {
            echo "## MDLT production run started (${PRODUCTION_MINUTES}m)"
            echo "The production run is now executing on the cluster. This workflow will exit; the run continues on the cluster."
            echo "Chewie reclaims the namespace automatically when the allocation expires. To free it early, run"
            echo "**225: [DISP] Release Chewie Allocation** with the Allocation ID below."
            echo ""
            echo "### Monitor & release values"
            echo "The Allocation ID is all that is needed downstream - **204: [DISP] CITR MDLT Monitor** (status),"
            echo "**205: [DISP] CITR MDLT Publish Results** (logs), and **225: [DISP] Release Chewie Allocation**"
            echo "(early teardown) each resolve the cluster + namespace from it."
            echo "- **Allocation ID**: \`${ALLOCATION_ID}\`"
            echo "- **Cluster**: \`${K8S_CLUSTER}\`"
            echo "- **Namespace**: \`${NAMESPACE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  # Send this output back to the caller workflow. For MDLT this reflects the KICKOFF result: the smoke
  # passed and the 5-day production run was launched. The 5-day run's pass/fail is reported later via
  # 205 (publish results) and 206 (tag result).
  multi-day-longevity-test-result:
    name: Calculate Result
    runs-on: hl-cn-mdlt-lin-sm
    if: ${{ !cancelled() }}
    needs:
      - longevity-tests-wait
      - longevity-launch-production
    outputs:
      result: ${{ steps.mdlt-status.outputs.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Set output
        id: mdlt-status
        run: |
          if [[ "${{ needs.longevity-tests-wait.result }}" == "success" \
             && "${{ needs.longevity-launch-production.outputs.launched }}" == "true" ]]; then
            RESULT="success"
          else
            RESULT="failure"
          fi
          echo "## Multi Day Longevity Kickoff Result" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "result=${RESULT}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "result=${RESULT}" >> "${GITHUB_OUTPUT}"

  # Announce the kickoff to Slack (payload rendered from a gomplate template). The full run's results
  # are reported later by 205/206, not here.
  longevity-report-to-slack:
    name: Report kickoff to Slack
    runs-on: hl-cn-mdlt-lin-sm
    if: ${{ !cancelled() }}
    needs:
      - acquire-kubernetes-resources
      - longevity-tests-start
      - longevity-launch-production
      - multi-day-longevity-test-result
    env:
      K8S_CLUSTER: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
      NAMESPACE: ${{ needs.acquire-kubernetes-resources.outputs.namespace }}
    steps:
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          # Templates come from the workflow ref, not the build tag: the MDLT templates do not exist
          # in older build tags.
          checkout-ref: "${{ github.ref }}"
          checkout-sparse: ".github/workflows/templates"
          checkout-sparse-cone-mode: false
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          setup-gomplate: "true"

      - name: Clean branch or tag name from input.ref
        id: clean-branch-name
        env:
          REF: ${{ inputs.ref }}
        run: |
          raw_ref="${REF}"
          clean_ref=""
          if [[ "${raw_ref}" == refs/heads/* ]]; then
            clean_ref="${raw_ref#refs/heads/}"
          elif [[ "${raw_ref}" == refs/tags/* ]]; then
            clean_ref="${raw_ref#refs/tags/}"
          elif [[ "${raw_ref}" == refs/pull/*/merge ]]; then
            clean_ref="PR-${raw_ref#refs/pull/}"
            clean_ref="${clean_ref%/merge}"
          else
            clean_ref="${raw_ref}"
          fi
          echo "clean_ref=${clean_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build Slack Payload Message
        id: payload
        env:
          BUILD_TAG: ${{ steps.clean-branch-name.outputs.clean_ref }}
          ALLOCATION_ID: ${{ needs.acquire-kubernetes-resources.outputs.allocation-id }}
          RESULT: ${{ needs.multi-day-longevity-test-result.outputs.result }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.longevity-tests-start.outputs.commit-sha }}
        run: |
          COLOR="#00FF00"
          if [[ "${RESULT}" != "success" ]]; then
            COLOR="#FF0000"
          fi
          export COLOR
          gomplate -f "${{ github.workspace }}"/.github/workflows/templates/slack-mdlt-start.json.tpl -o slack_payload.json

      - name: Report status (slack detailed reports)
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.slack-report-webhook }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload.json
