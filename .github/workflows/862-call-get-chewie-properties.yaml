# SPDX-License-Identifier: Apache-2.0
name: "862: [CALL] Get CITR Chewie Properties"
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: "Git ref to checkout for the test config"
    secrets:
      checkout-token:
        required: true
        description: "GitHub token for accessing the repository"
    outputs:
      request-duration:
        description: "Default duration for chewie requests"
        value: ${{ jobs.get-chewie-props.outputs.request-duration }}
      request-timeout:
        description: "Default timeout for chewie requests"
        value: ${{ jobs.get-chewie-props.outputs.request-timeout }}
      mdlt-length:
        description: "Default MDLT production run length in minutes"
        value: ${{ jobs.get-chewie-props.outputs.mdlt-length }}

jobs:
  get-chewie-props:
    runs-on: hl-cn-chewie-lin-sm
    env:
      DEFAULT_RQST_DURATION: 3600
      DEFAULT_MDLT_LENGTH: 7200
    outputs:
      request-duration: ${{ steps.get-chewie-props.outputs.request-duration }}
      request-timeout: ${{ steps.get-chewie-props.outputs.request-timeout }}
      mdlt-length: ${{ steps.get-chewie-props.outputs.mdlt-length }}
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@c96d9edf7816b4f333b558f2e07fe81ebf1e822d # v1.3.0
        with:
          checkout: "true"
          checkout-token: ${{ secrets.checkout-token }}
          checkout-ref: ${{ inputs.ref }}

      - name: Read properties
        id: get-chewie-props
        run: |
          PROPERTIES_FILE=".github/chewie.yaml"
          if [[ ! -f "${PROPERTIES_FILE}" ]]; then
            echo "::error::Test config file not found: ${PROPERTIES_FILE}"
            exit 1
          fi

          # Read properties from chewie.yaml
          REQUEST_DURATION=$(yq e '.default_duration' "${PROPERTIES_FILE}")
          if [[ -z "${REQUEST_DURATION}" ]] || [[ "${REQUEST_DURATION}" == "null" ]]; then
            echo "::error::Failed to read default_duration from ${PROPERTIES_FILE}"
            REQUEST_DURATION=${DEFAULT_RQST_DURATION}  # Fallback to default value
          fi

          REQUEST_TIMEOUT=$(yq e '.default_timeout' "${PROPERTIES_FILE}")
          if [[ -z "${REQUEST_TIMEOUT}" ]] || [[ "${REQUEST_TIMEOUT}" == "null" ]]; then
            echo "::error::Failed to read default_timeout from ${PROPERTIES_FILE}"
            REQUEST_TIMEOUT=300  # Fallback to default value
          fi

          # MDLT production run length, in minutes (see the note in chewie.yaml on the unit).
          MDLT_LENGTH=$(yq e '.default_mdlt_length' "${PROPERTIES_FILE}")
          if [[ -z "${MDLT_LENGTH}" ]] || [[ "${MDLT_LENGTH}" == "null" ]]; then
            echo "::error::Failed to read default_mdlt_length from ${PROPERTIES_FILE}"
            MDLT_LENGTH=${DEFAULT_MDLT_LENGTH}  # Fallback to default value
          fi

          # set outputs
          echo "::group::Chewie Properties Values"
          echo "request-duration=${REQUEST_DURATION}" | tee -a "${GITHUB_OUTPUT}"
          echo "request-timeout=${REQUEST_TIMEOUT}" | tee -a "${GITHUB_OUTPUT}"
          echo "mdlt-length=${MDLT_LENGTH}" | tee -a "${GITHUB_OUTPUT}"
          echo "::endgroup::"
