# SPDX-License-Identifier: Apache-2.0
name: "226: [DISP] CITR XTS Controller"
# 900 matches on the candidate in the run name to avoid dispatching a commit that already has a run.
run-name: "226: [DISP] CITR XTS Controller (${{ inputs.ref }})"
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
        description: "Full commit SHA of the XTS candidate (dispatched by Chewie)"
        type: string

permissions:
  id-token: write
  actions: write
  issues: write
  pull-requests: write
  statuses: write
  checks: write
  contents: read

concurrency:
  group: xts-${{ inputs.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  XTS_PASS_GREP_PATTERN: "xts-pass-*"
  PROMOTED_GREP_PATTERN: "build-.{5}"
  BUILD_GREP_PATTERN: "build-*"

jobs:
  prime-workflow:
    name: Prime workflow
    runs-on: hl-cn-default-lin-ss
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Schedule Run
        run: |
          echo "Picking up dispatched run at $(date -u +'%Y-%m-%d %H:%M:%S') UTC"

  extract-citr-vars:
    name: Extract CITR Vars
    uses: ./.github/workflows/855-call-extract-citr-vars.yaml
    with:
      ref: ${{ inputs.ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  verify-citr-vars:
    name: Verify CITR vars
    needs:
      - extract-citr-vars
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Harden Runner
        id: harden-runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check outputs
        id: check-outputs
        run: |
          if [[ "${{ needs.extract-citr-vars.outputs.citr-solo-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.cutover-solo-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.tck-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.js-sdk-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.citr-mirror-node-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.bn-release-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.bn-mirror-node-version }}" == "" || \
            "${{ needs.extract-citr-vars.outputs.json-rpc-relay-version }}" == "" ]]; then
            echo "::error::One or more required CITR variables are missing. Failing the job."
            exit 1
          else
            echo "All required CITR variables are present."
          fi

  compute-solo-ge-0440:
    name: Compute solo-ge-0440
    needs:
      - extract-citr-vars
      - verify-citr-vars
    uses: ./.github/workflows/856-call-solo-ge044.yaml
    with:
      solo-version: ${{ needs.extract-citr-vars.outputs.citr-solo-version }}

  parameters:
    name: Determine Configurable Parameters
    runs-on: hl-cn-default-lin-sm
    needs:
      - extract-citr-vars
      - verify-citr-vars
      - compute-solo-ge-0440
    outputs:
      solo-ge-0440: ${{ needs.compute-solo-ge-0440.outputs.solo-ge-0440 }}
      solo-version: ${{ steps.set-parameters.outputs.solo-version }}
      helm-release-name: ${{ steps.set-parameters.outputs.helm-release-name }}
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2

      - name: Set Parameters
        id: set-parameters
        run: |
          SOLO_VERSION="${{ needs.extract-citr-vars.outputs.citr-solo-version }}"
          SOLO_GE_0440="${{ needs.compute-solo-ge-0440.outputs.solo-ge-0440 }}"
          HELM_NAME="mirror"
          if [[ "${SOLO_GE_0440}" == "true" ]]; then
            HELM_NAME="mirror-1"
          fi

          echo "helm-release-name=${HELM_NAME}" >> "${GITHUB_OUTPUT}"
          echo "::debug::SOLO_GE_0440=${SOLO_GE_0440}"
          echo "::notice::SOLO_VERSION=${SOLO_VERSION} SOLO_GE_0440=${SOLO_GE_0440} (gates Migration Testing + Block Node Regression panels)"
          echo "helm-release-name=${HELM_NAME}" >> "${GITHUB_OUTPUT}"
          echo "solo-ge-0440=${SOLO_GE_0440}" >> "${GITHUB_OUTPUT}"
          echo "solo-version=${SOLO_VERSION}" >> "${GITHUB_OUTPUT}"

  fetch-xts-candidate:
    name: Fetch XTS Candidate Tag
    runs-on: hl-cn-default-lin-sm
    outputs:
      xts-proceed: ${{ steps.check-tags-exist.outputs.xts-proceed }}
      xts-tag-commit: ${{ steps.check-tags-exist.outputs.xts-tag-commit }}
      xts-tag-short-commit: ${{ steps.check-tags-exist.outputs.xts-tag-short-commit }}
      xts-commit-branch: ${{ steps.check-tags-exist.outputs.xts-commit-branch }}
      xts-tag-commit-author: ${{ steps.check-tags-exist.outputs.xts-tag-commit-author }}
      xts-tag-commit-email: ${{ steps.check-tags-exist.outputs.xts-tag-commit-email }}
      xts-info: ${{ steps.check-tags-exist.outputs.xts-info }}
      commit-list: ${{ steps.check-tags-exist.outputs.commit-list }}
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "main"
          checkout-fetch-depth: "0"
          checkout-token: "${{ secrets.GH_ACCESS_TOKEN }}"

      # The candidate is chosen by Chewie and handed over as inputs.ref. The only eligibility rule
      # applied here is that the commit is not already part of a build; the default-branch check
      # below is the only other gate.
      - name: Check XTS Candidate
        id: check-tags-exist
        env:
          XTS_PASS_PATTERN: ${{ env.XTS_PASS_GREP_PATTERN }}
          BUILD_PROMO_PATTERN: ${{ env.PROMOTED_GREP_PATTERN }}
          BUILD_PATTERN: ${{ env.BUILD_GREP_PATTERN }}
          REF: ${{ inputs.ref }}
          DEFAULT_BRANCH_NAME: "main"
        run: |
          # 855, 854 and 815 check out the candidate at fetch-depth 1, which cannot resolve an
          # abbreviated SHA; reject one here rather than let the first callee fail obscurely.
          if [[ ! "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid XTS Candidate::'${REF}' is not a full 40-character lowercase commit SHA."
            exit 1
          fi

          echo "::group::Resolve XTS Candidate"
          set +e
          XTS_COMMIT="$(git rev-list -n 1 "${REF}" 2>/dev/null)"
          XTS_COMMIT_FOUND="${?}"
          set -e

          if [[ "${XTS_COMMIT_FOUND}" -ne 0 || -z "${XTS_COMMIT}" ]]; then
            echo "Ref ${REF} not found. No XTS execution will be performed."
            echo "xts-proceed=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### XTS Candidate Not Found"
              echo "Ref \`${REF}\` was not found. No XTS execution will be performed."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Emitted ahead of the eligibility checks so a rejected candidate can still be reported to Chewie.
          echo "xts-tag-commit=${XTS_COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "::endgroup::" # Resolve XTS Candidate

          echo "::group::Check Promotion Eligibility"
          # --contains also matches a build tag on any descendant: either way the commit has
          # already been promoted into a build and is not valid for promotion again.
          set +e
          BUILD_PROMOTED_TAGGED="$(git tag --contains "${XTS_COMMIT}" | grep -E "${BUILD_PROMO_PATTERN}")"
          set -e

          if [[ -n "${BUILD_PROMOTED_TAGGED}" ]]; then
            echo "Commit ${XTS_COMMIT} is already part of a build. No XTS execution will be performed."
            echo "xts-proceed=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### XTS Candidate Already Promoted"
              echo "Commit \`${XTS_COMMIT}\` is already part of a build. No XTS execution will be performed."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Get the list of commits between the previous XTS Pass (or promoted build) and the candidate
          set +e
          LATEST_XTS_PASS_TAG="$(git tag --list --sort=-version:refname "${XTS_PASS_PATTERN}" | head --lines 1)"
          LATEST_PROMOTED_BUILD_TAG="$(git tag --list --sort=-version:refname "${BUILD_PATTERN}" | head --lines 1)"
          set -e
          if [[ -n "${LATEST_XTS_PASS_TAG}" ]]; then
            echo "::debug::Using latest xts-pass tag"
            echo "Latest XTS Pass Tag: ${LATEST_XTS_PASS_TAG}"
            LATEST_XTS_PASS_COMMIT="$(git rev-list -n 1 "${LATEST_XTS_PASS_TAG}")"
            COMMIT_LIST="$(git log --pretty=format:"- [%h: %s](https://github.com/${{ github.repository }}/commit/%H)" "${LATEST_XTS_PASS_COMMIT}..${XTS_COMMIT}")"
          elif [[ -n "${LATEST_PROMOTED_BUILD_TAG}" ]]; then
            echo "::debug::Using latest promoted build tag as no xts-pass tag found"
            echo "Latest Promoted Tag: ${LATEST_PROMOTED_BUILD_TAG}"
            LATEST_PROMOTED_BUILD_COMMIT="$(git rev-list -n 1 "${LATEST_PROMOTED_BUILD_TAG}")"
            COMMIT_LIST="$(git log --pretty=format:"- [%h: %s](https://github.com/${{ github.repository }}/commit/%H)" "${LATEST_PROMOTED_BUILD_COMMIT}..${XTS_COMMIT}")"
          fi
          # Empty when there is no prior tag, or when the candidate is not ahead of the latest
          # xts-pass (a re-run of an older commit); list the candidate itself.
          if [[ -z "${COMMIT_LIST//[[:space:]]/}" ]]; then
            COMMIT_LIST="$(git log -n 1 --pretty=format:"- [%h: %s](https://github.com/${{ github.repository }}/commit/%H)" "${XTS_COMMIT}")"
          fi
          echo "::endgroup::" # Check Promotion Eligibility

          echo "::group::Check if XTS COMMIT is on default branch"
          # Determine which branch the commit belongs to
          set +e
          XTS_COMMIT_BRANCHES="$(git branch -r --contains "${XTS_COMMIT}" | sed 's/^[ *]*//')"
          set -e
          echo "::debug::XTS_COMMIT_BRANCHES=${XTS_COMMIT_BRANCHES}"

          XTS_COMMIT_BRANCH="${DEFAULT_BRANCH_NAME}"
          COMMIT_ON_DEFAULT_BRANCH=0

          # Check if the commit on the default branch
          set +e
          if echo "${XTS_COMMIT_BRANCHES}" | grep -qE "(^|/)${DEFAULT_BRANCH_NAME}$"; then
            echo "::debug::Commit ${XTS_COMMIT} found on main branch."
          else
            echo "::debug::Commit ${XTS_COMMIT} not found on main branch, determining actual branch."
            COMMIT_ON_DEFAULT_BRANCH=1
            XTS_COMMIT_BRANCH="$(
              git name-rev --name-only --refs="refs/remotes/*" "${XTS_COMMIT}" \
              | sed 's~^.*origin/~~' \
              | sed 's/~.*//'
            )"
          fi
          set -e

          # XTS_COMMIT_BRANCH is now load-bearing: deploy-xts-optional-trigger dispatches 106 on
          # it, and the workflow-dispatch API only accepts a branch or tag. git name-rev can hand
          # back something that is not a dispatchable branch (a commit reachable only from a tag,
          # or from a branch that has since been deleted), so check it and warn rather than fail -
          # mandatory XTS does not depend on this value, only the optional dispatch does.
          set +e
          git show-ref --verify --quiet "refs/remotes/origin/${XTS_COMMIT_BRANCH}"
          BRANCH_IS_DISPATCHABLE="${?}"
          set -e
          if [[ "${BRANCH_IS_DISPATCHABLE}" -ne 0 ]]; then
            echo "::warning title=XTS candidate branch not dispatchable::Resolved branch '${XTS_COMMIT_BRANCH}' for commit ${XTS_COMMIT} does not exist as refs/remotes/origin/${XTS_COMMIT_BRANCH}. Mandatory XTS is unaffected, but the optional XTS dispatch will likely fail with 'No ref found for: ${XTS_COMMIT_BRANCH}'."
            {
              echo "### Optional XTS dispatch may fail"
              echo ""
              echo "Resolved branch \`${XTS_COMMIT_BRANCH}\` for commit \`${XTS_COMMIT}\` is not a remote branch."
              echo "Mandatory XTS is unaffected; only the 106 dispatch depends on this value."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          # Print branch debug info
          echo "::debug::XTS_COMMIT_BRANCH=${XTS_COMMIT_BRANCH}"
          echo "::debug::COMMIT_ON_DEFAULT_BRANCH=${COMMIT_ON_DEFAULT_BRANCH}"
          echo "::endgroup::" # XTS COMMIT is on default branch

          echo "::group::Get XTS Commit Information"
          # Get the short commit id
          XTS_SHORT_COMMIT="$(git rev-parse --short "${XTS_COMMIT}")"
          echo "::debug::XTS_SHORT_COMMIT=${XTS_SHORT_COMMIT}"

          # Get commit author
          AUTHOR_NAME="$(git log -1 --format='%an' "${XTS_COMMIT}")"
          AUTHOR_EMAIL="$(git log -1 --format='%ae' "${XTS_COMMIT}")"
          echo "::endgroup::" # Get XTS Commit Information

          echo "::group::Set Outputs"
          # If the tag exists on the Main Branch set the output variables as appropriate
          # Otherwise cancel out
          if [[ "${COMMIT_ON_DEFAULT_BRANCH}" -eq 0 ]]; then
            # GitHub Outputs
            echo "xts-proceed=true" >> "${GITHUB_OUTPUT}"
            echo "xts-tag-short-commit=${XTS_SHORT_COMMIT}" >> "${GITHUB_OUTPUT}"
            echo "xts-tag-commit-author=${AUTHOR_NAME} <${AUTHOR_EMAIL}>" >> "${GITHUB_OUTPUT}"
            echo "xts-commit-branch=${XTS_COMMIT_BRANCH}" >> "${GITHUB_OUTPUT}"
            echo "xts-tag-commit-email=${AUTHOR_EMAIL}" >> "${GITHUB_OUTPUT}"
            echo "xts-info=${XTS_COMMIT_BRANCH} - ${XTS_SHORT_COMMIT}" >> "${GITHUB_OUTPUT}"

            COMMIT_COUNT=$(echo "$COMMIT_LIST" | wc -l)
            COMMIT_LIST_STR=""
            if [[ -z "${COMMIT_LIST//[[:space:]]/}" ]]; then
              # should never get here.
              echo "::error::No commits associated with this release; exiting."
              exit 1
            elif [[ ${COMMIT_COUNT} -gt 15 ]]; then
              COMMIT_LIST_STR="Please refer to the workflow summary for the full list of associated commits."
            else
              PARSED_COMMIT_LIST="${COMMIT_LIST//\`/}"
              ESCAPED_COMMIT_LIST=$(jq -Rs . <<< "${PARSED_COMMIT_LIST}")
              COMMIT_LIST_STR=${ESCAPED_COMMIT_LIST:1:-1}
            fi
            echo "commit-list=${COMMIT_LIST_STR}" >> "${GITHUB_OUTPUT}"

            # GitHub Step Summary
            echo "### XTS-Candidate commit found" >>  "${GITHUB_STEP_SUMMARY}"
            echo "xts-tag-commit=${XTS_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"
            echo "### Commit List" >> "${GITHUB_STEP_SUMMARY}"
            echo -e "${COMMIT_LIST}" >> "${GITHUB_STEP_SUMMARY}"
            echo "### XTS Information" >> "${GITHUB_STEP_SUMMARY}"
            echo "xts-info=${XTS_COMMIT_BRANCH} - ${XTS_SHORT_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Commit ${XTS_COMMIT} is not on ${DEFAULT_BRANCH_NAME}. No XTS execution will be performed."
            echo "xts-proceed=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### XTS Candidate Not On ${DEFAULT_BRANCH_NAME}"
              echo "Commit \`${XTS_COMMIT}\` was not found on \`${DEFAULT_BRANCH_NAME}\`. No XTS execution will be performed."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "::endgroup::" # Set Outputs

  extract-jdk-version:
    name: Extract Java Version
    needs: fetch-xts-candidate
    uses: ./.github/workflows/854-call-extract-jdk-version.yaml
    with:
      ref: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  state-validator-uberjar:
    name: Build & Publish Hedera State Validator Uber JAR
    needs:
      - fetch-xts-candidate
    if: ${{ needs.fetch-xts-candidate.result == 'success' && needs.fetch-xts-candidate.outputs.xts-proceed == 'true' }}
    uses: ./.github/workflows/816-call-build-publish-state-validator.yaml
    with:
      ref: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}

  # Required: a failed report fails the run. Starts together with XTS: same needs and condition, so it
  # reports running when XTS kicks off; a rejected candidate is reported only once, as not_run, by
  # report-xts-result. Neither waits on the other.
  report-xts-running:
    name: Report XTS Running to Chewie
    needs:
      - fetch-xts-candidate
      - parameters
      - state-validator-uberjar
      - extract-jdk-version
      - extract-citr-vars
      - verify-citr-vars
    if: ${{ needs.fetch-xts-candidate.result == 'success' && needs.fetch-xts-candidate.outputs.xts-proceed == 'true' }}
    uses: ./.github/workflows/864-call-report-suite-result.yaml
    with:
      suite-type: xts
      commit: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
      branch: ${{ needs.fetch-xts-candidate.outputs.xts-commit-branch || 'main' }}
      disposition: running
    secrets:
      chewie-key: ${{ secrets.CHEWIE_REPO_IDENTITY_KEY }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}

  xts-execution:
    name: Execute XTS
    needs:
      - fetch-xts-candidate
      - parameters
      - state-validator-uberjar
      - extract-jdk-version
      - extract-citr-vars
      - verify-citr-vars
    if: ${{ needs.fetch-xts-candidate.result == 'success' && needs.fetch-xts-candidate.outputs.xts-proceed == 'true' }}
    uses: ./.github/workflows/815-call-xts-tests.yaml
    with:
      ref: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
      branch-name: ${{ needs.fetch-xts-candidate.outputs.xts-commit-branch }}
      solo-version: ${{ needs.parameters.outputs.solo-version }}
      solo-ge-0440: ${{ needs.parameters.outputs.solo-ge-0440 }}
      helm-release-name: ${{ needs.parameters.outputs.helm-release-name }}
      custom-job-label: "XTS (main):"
      enable-timing-sensitive-test-suite: "true"
      enable-hammer-test-suite: "true"
      enable-hapi-test-suite: "true"
      enable-otter-test-suite: "true"
      enable-chaos-otter-test-suite: "true"
      enable-hedera-node-jrs-panel: "true"
      enable-sdk-tck-regression-panel: "true"
      enable-block-node-regression-panel: "true"
      enable-mirror-node-regression-panel: "true"
      enable-rpc-relay-regression-panel: "true"
      java-version: "${{ needs.extract-jdk-version.outputs.jdk-version }}"
      tck-version: "${{ needs.extract-citr-vars.outputs.tck-version }}"
      js-sdk-version: "${{ needs.extract-citr-vars.outputs.js-sdk-version }}"
      bn-release-version: "${{ needs.extract-citr-vars.outputs.bn-release-version }}"
      bn-mirror-node-version: "${{ needs.extract-citr-vars.outputs.bn-mirror-node-version }}"
      mirror-node-version: ${{ needs.extract-citr-vars.outputs.citr-mirror-node-version }}
      json-rpc-relay-version: "${{ needs.extract-citr-vars.outputs.json-rpc-relay-version }}"
    secrets:
      access-token: ${{ secrets.GITHUB_TOKEN }}
      platform-access-token: ${{ secrets.JRS_GH_ACCESS_TOKEN }}
      regression-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
      gcp-project-number: ${{ secrets.PLATFORM_GCP_PROJECT_NUMBER }}
      gcp-sa-key-contents: ${{ secrets.PLATFORM_GCP_KEY_FILE }}
      gradle-cache-username: ${{ secrets.GRADLE_CACHE_USERNAME }}
      gradle-cache-password: ${{ secrets.GRADLE_CACHE_PASSWORD }}
      jrs-ssh-user-name: ${{ secrets.PLATFORM_JRS_SSH_USER_NAME }}
      jrs-ssh-key-file: ${{ secrets.PLATFORM_JRS_SSH_KEY_FILE }}
      slack-api-token: ${{ secrets.PLATFORM_SLACK_API_TOKEN }}
      slack-citr-details-token: ${{ secrets.SLACK_CITR_DETAILED_REPORTS_WEBHOOK }}
      slack-tck-report-webhook: ${{ secrets.SLACK_TCK_MONITOR_WEBHOOK }}

  deploy-xts-optional-trigger:
    name: Trigger Optional XTS
    runs-on: hl-cn-default-lin-sm
    needs:
      - fetch-xts-candidate
    if: ${{ needs.fetch-xts-candidate.result == 'success' && needs.fetch-xts-candidate.outputs.xts-proceed == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Dispatched fire-and-forget: the optional panels do not gate promotion, and this run is
      # deliberately not awaited.
      #
      # `ref` must be a BRANCH, not a commit SHA. The action's README claims a SHA is accepted,
      # but the underlying workflow-dispatches API rejects one outright:
      #   Error: No ref found for: 1e68d40ad1a113da0c832da1bb54af3486947e8b
      # Use the branch the candidate actually lives on rather than a hardcoded `main`, so this
      # keeps working once XTS runs on release branches. The exact candidate commit is still
      # pinned -- it is handed to 106 as the `ref` input, which 106 checks out.
      - name: "Trigger 106: [DISP] XTS Optional Tests"
        uses: step-security/workflow-dispatch@b4c1dc0afa074d0b4f0e653d3b80d4b2798599aa # v1.2.7
        with:
          workflow: .github/workflows/106-disp-xts-optional-tests.yaml
          repo: hiero-ledger/hiero-consensus-node # ensure we are executing in the hiero-ledger org
          ref: ${{ needs.fetch-xts-candidate.outputs.xts-commit-branch }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          inputs: '{
            "ref": "${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}",
            "branch-name": "${{ needs.fetch-xts-candidate.outputs.xts-commit-branch }}"
            }'

  # Required: 901 promotes the newest xts-pass tag, and 900 skips commits that already carry one.
  tag-for-promotion:
    name: Tag as XTS-Passing
    runs-on: hl-cn-default-lin-sm
    needs:
      - fetch-xts-candidate
      - xts-execution
    if: ${{ needs.xts-execution.result == 'success' }}
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
          checkout-fetch-depth: "0"
          checkout-token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Import GPG Key
        id: gpg_importer
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_signingkey: true
          gpg_private_key: ${{ secrets.SVCS_GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.SVCS_GPG_KEY_PASSPHRASE }}

      - name: Tag for XTS promotion
        run: |
          TAG="xts-pass-$(date +%s)"
          git tag --annotate "${TAG}" --message "chore: tagging commit for build candidate promotion"
          git push origin "${TAG}"
          {
            echo "### Commit Tagged for Promotion"
            echo "promotion-tag=${TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

  report-success:
    name: Report XTS execution success
    runs-on: hl-cn-default-lin-sm
    needs:
      - fetch-xts-candidate
      - xts-execution
      - tag-for-promotion
    if: ${{ (needs.fetch-xts-candidate.result == 'success' &&
      needs.xts-execution.result == 'success' &&
      needs.tag-for-promotion.result == 'success') &&
      !cancelled() }}
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: main
          checkout-fetch-depth: "1"
          checkout-token: ${{ secrets.GH_ACCESS_TOKEN }}
          setup-gomplate: "true"

      - name: Build Success Slack Payload
        env:
          SLACK_COLOR: "#00FF00"
          XTS_INFO: ${{ needs.fetch-xts-candidate.outputs.xts-info }}
          FETCH_XTS_CANDIDATE_RESULT: ${{ needs.fetch-xts-candidate.result }}
          XTS_EXECUTION_RESULT: ${{ needs.xts-execution.result }}
          TAG_FOR_PROMOTION_RESULT: ${{ needs.tag-for-promotion.result }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
          COMMIT_AUTHOR: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit-author }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_LIST: ${{ needs.fetch-xts-candidate.outputs.commit-list }}
        run: gomplate -f .github/workflows/templates/slack-xts-success-detailed.json.tpl -o slack_payload.json

      - name: Report Success (slack)
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_CITR_OPERATIONS_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload.json

  report-failure:
    name: Report XTS execution failure
    runs-on: hl-cn-default-lin-sm
    needs:
      - fetch-xts-candidate
      - xts-execution
      - tag-for-promotion
    if: ${{ !( needs.fetch-xts-candidate.result == 'success' &&
      needs.xts-execution.result == 'success' &&
      needs.tag-for-promotion.result == 'success') && always() }}

    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: main
          checkout-fetch-depth: "0"
          checkout-token: ${{ secrets.GH_ACCESS_TOKEN }}
          setup-gomplate: "true"

      - name: Determine Report Category
        id: report-category
        run: |
          if [[ "${{ needs.xts-execution.result }}" == "cancelled" ]] \
            || [[ "${{ needs.fetch-xts-candidate.result }}" == "cancelled" ]] \
            || [[ "${{ needs.fetch-xts-candidate.result }}" == "success" && "${{ needs.fetch-xts-candidate.outputs.xts-proceed }}" != "true" ]]; then
            echo "category=cancelled" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ needs.fetch-xts-candidate.result }}" =~ ^(skipped|failure)$ ]] \
            || [[ "${{ needs.xts-execution.outputs.failure-mode }}" == "workflow" ]]; then
            echo "category=environment" >> "${GITHUB_OUTPUT}"
          else
            echo "category=test" >> "${GITHUB_OUTPUT}"
          fi

      - name: Collect run logs in a log file
        if: ${{ steps.report-category.outputs.category != 'cancelled' }}
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          for job_id in $(gh run view "${{ github.run_id }}" --json jobs --jq '.jobs | map(.databaseId) | .[0:-1] | .[]'); do
            echo "Fetching logs for job $job_id..."

            current_job_name="$(gh run view ${{ github.run_id }} --json jobs | jq --argjson job_id "$job_id" -r '.jobs[] | select(.databaseId == $job_id) | .name')"

            echo "Logs for job $current_job_name :" >> run.log

            gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/hiero-ledger/hiero-consensus-node/actions/jobs/$job_id/logs >> run.log
          done

      - name: Upload log as artifact
        if: ${{ steps.report-category.outputs.category != 'cancelled' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          path: run.log

      - name: Find Commit Author in Slack
        id: find-commit-author-slack
        if: ${{ steps.report-category.outputs.category == 'test' }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_CITR_BOT_TOKEN }}
          EMAIL: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit-email }}
        run: |
          bash "${{ github.workspace }}/.github/workflows/support/scripts/find-commit-author-slack.sh"
          echo "slack-user-id=${SLACK_USER_ID}" >> "${GITHUB_OUTPUT}"

      - name: Set Rootly Service Name
        id: set-rootly-service
        if: ${{ steps.report-category.outputs.category == 'test' || steps.report-category.outputs.category == 'environment' }}
        run: |
          ROOTLY_SERVICE_NAME="CITR General"
          if [[ "${{ steps.report-category.outputs.category }}" == "environment" ]]; then
            ROOTLY_SERVICE_NAME="CI/CD Workflows"
          fi
          echo "service=${ROOTLY_SERVICE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Build Rootly Summary
        id: rootly-summary
        if: ${{ steps.report-category.outputs.category == 'test' || steps.report-category.outputs.category == 'environment' }}
        env:
          PRINT_FAILED_TESTS_SCRIPT: ".github/workflows/support/scripts/print-failed-tests.sh"
          COMMIT_AUTHOR: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit-author }}
          COMMIT_LIST: ${{ needs.fetch-xts-candidate.outputs.commit-list }}
        run: |
          title="The eXtended Test Suite job failed (${{ needs.fetch-xts-candidate.outputs.xts-info }})."

          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          {
            echo 'summary<<EOF'
            echo "------------------------------------"
            echo "Status of each jobs:"
            echo "- Execute XTS: ${{ needs.xts-execution.result }}"
            echo "- Tag for Promotion: ${{ needs.tag-for-promotion.result }}"
            echo "------------------------------------"
            if [[ "${{ needs.xts-execution.result }}" != "success" ]]; then
              FAILURE_MODE="${{ needs.xts-execution.outputs.failure-mode }}"
              if [[ "${FAILURE_MODE}" == "environment" ]]; then
                FAILURE_MODE="environment"
              fi
              echo "XTS failure - ${FAILURE_MODE} error."
              echo "Failing Test(s):"
              bash "${{ github.workspace }}/${{ env.PRINT_FAILED_TESTS_SCRIPT }}" "${{ needs.xts-execution.outputs.failed-tests }}"
              echo "------------------------------------"
            fi
            echo "Commit information:"
            echo "- Author: ${COMMIT_AUTHOR}"
            echo "- Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}>"
            echo "- Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
            echo "------------------------------------"
            echo "Commit List:"
            echo -e "${COMMIT_LIST}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Log Rootly Summary
        if: ${{ steps.report-category.outputs.category == 'test' || steps.report-category.outputs.category == 'environment' }}
        run: |
          echo "## Rootly Summary:"
          echo "### Title: ${{ steps.rootly-summary.outputs.title }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.rootly-summary.outputs.summary }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "### Rootly Service" >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.set-rootly-service.outputs.service }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create Rootly Alert
        id: create-rootly-alert
        if: ${{ steps.report-category.outputs.category == 'test' || steps.report-category.outputs.category == 'environment' }}
        uses: pandaswhocode/rootly-alert-action@25cfdb8b2c006c1b130c183c7b1cbcffafb71f39 # v1.0.10
        continue-on-error: true
        with:
          api_key: ${{ secrets.ROOTLY_API_TOKEN }}
          summary: "${{ steps.rootly-summary.outputs.title }}"
          details: "${{ steps.rootly-summary.outputs.summary }}"
          notification_target_type: "Service"
          notification_target: ${{ steps.set-rootly-service.outputs.service }}
          set_as_noise: "false"
          alert_urgency: "High"
          external_id: ${{ github.run_id }}
          external_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          environments: "CITR"

      - name: Build Test Failure Slack Payload
        if: ${{ steps.report-category.outputs.category == 'test' }}
        env:
          SLACK_COLOR: "#FF0000"
          XTS_INFO: "${{ needs.fetch-xts-candidate.outputs.xts-info  || ''}}"
          FETCH_XTS_CANDIDATE_RESULT: ${{ needs.fetch-xts-candidate.result }}
          XTS_EXECUTION_RESULT: ${{ needs.xts-execution.result }}
          TAG_FOR_PROMOTION_RESULT: ${{ needs.tag-for-promotion.result }}
          FAILED_TESTS: ${{ needs.xts-execution.outputs.failed-tests }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
          COMMIT_AUTHOR: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit-author }}
          SLACK_USER_ID: ${{ steps.find-commit-author-slack.outputs.slack-user-id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_LIST: ${{ needs.fetch-xts-candidate.outputs.commit-list }}
        run: gomplate -f .github/workflows/templates/slack-xts-test-failure-detailed.json.tpl -o slack_payload.json

      - name: Build Environment Failure Slack Payload
        if: ${{ steps.report-category.outputs.category == 'environment' }}
        env:
          XTS_INFO: "${{ needs.fetch-xts-candidate.outputs.xts-info || '' }}"
          FETCH_XTS_CANDIDATE_RESULT: ${{ needs.fetch-xts-candidate.result }}
          XTS_EXECUTION_RESULT: ${{ needs.xts-execution.result }}
          TAG_FOR_PROMOTION_RESULT: ${{ needs.tag-for-promotion.result }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gomplate -f .github/workflows/templates/slack-xts-env-failure-detailed.json.tpl -o slack_payload.json

      - name: Build Environment Failure Summary Payload
        if: ${{ steps.report-category.outputs.category == 'environment' }}
        env:
          SLACK_SUMMARY_TEXT: ":warning: XTS environment failure (${{ needs.fetch-xts-candidate.outputs.xts-info }}) — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
        run: gomplate -f .github/workflows/templates/slack-env-failure-summary.json.tpl -o slack_payload_summary.json

      - name: Build Cancelled Summary Payload
        if: ${{ steps.report-category.outputs.category == 'cancelled' }}
        env:
          SLACK_SUMMARY_TEXT: ":no_entry_sign: XTS run cancelled${{ needs.fetch-xts-candidate.outputs.xts-info != '' && format(' ({0})', needs.fetch-xts-candidate.outputs.xts-info) || '' }} — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
          XTS_PROCEED: "${{needs.fetch-xts-candidate.outputs.xts-proceed}}"
        run: gomplate -f .github/workflows/templates/slack-cancelled-summary.json.tpl -o slack_payload_summary.json

      # Notification routing:
      #   test failures       -> citr-operations (detailed)
      #   environment         -> citr-operations (summary) + citr-failures (detailed)
      #   canceled            -> citr-operations (summary)
      - name: Notify test failure detailed (citr-operations)
        if: ${{ steps.report-category.outputs.category == 'test' }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_CITR_OPERATIONS_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload.json

      - name: Notify environment failure summary (citr-operations)
        if: ${{ steps.report-category.outputs.category == 'environment' }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_CITR_OPERATIONS_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload_summary.json

      - name: Notify environment failure detailed (citr-failures)
        if: ${{ steps.report-category.outputs.category == 'environment' }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_CITR_FAILURES_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload.json

      - name: Notify cancelled summary (citr-operations)
        if: ${{ steps.report-category.outputs.category == 'cancelled' }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_CITR_OPERATIONS_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload_summary.json

  # Required: a failed report fails the run.
  report-xts-result:
    name: Report XTS Result to Chewie
    needs:
      - fetch-xts-candidate
      - report-xts-running # keeps the terminal report after the running one, so it is the latest
      - xts-execution
    if: ${{ always() && needs.fetch-xts-candidate.outputs.xts-tag-commit != '' }}
    uses: ./.github/workflows/864-call-report-suite-result.yaml
    with:
      suite-type: xts
      commit: ${{ needs.fetch-xts-candidate.outputs.xts-tag-commit }}
      branch: ${{ needs.fetch-xts-candidate.outputs.xts-commit-branch || 'main' }}
      # Reflects XTS itself, not the tagging step; a rejected candidate is not_run.
      disposition:
        ${{ needs.fetch-xts-candidate.outputs.xts-proceed != 'true' && 'not_run'
        || needs.xts-execution.result == 'success' && 'passed'
        || needs.xts-execution.result == 'failure' && 'failed'
        || needs.xts-execution.result == 'cancelled' && 'cancelled'
        || 'not_run' }}
    secrets:
      chewie-key: ${{ secrets.CHEWIE_REPO_IDENTITY_KEY }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}
