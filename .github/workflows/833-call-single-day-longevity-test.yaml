          grep -E 'Finished HeliSwapLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' >> "${GITHUB_OUTPUT}"
          grep -E 'Finished HeliSwapLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' | grep -E 'value=[0-9][0-9]*'

      - name: Extract benchmark score of CryptoTransferLoadTest test
        id: CryptoTransferLoadTestLogs
        run: |
          grep -E 'Finished CryptoTransferLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' >> "${GITHUB_OUTPUT}"
          grep -E 'Finished CryptoTransferLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' | grep -E 'value=[0-9][0-9]*'

      - name: Extract benchmark score of HCSLoadTest test
        id: HCSLoadTestLogs
        run: |
          grep -E 'Finished HCSLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' >> "${GITHUB_OUTPUT}"
          grep -E 'Finished HCSLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' | grep -E 'value=[0-9][0-9]*'

      - name: Extract benchmark score of SmartContractLoadTest test
        id: SmartContractLoadTestLogs
        run: |
          grep -E 'Finished SmartContractLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' >> "${GITHUB_OUTPUT}"
          grep -E 'Finished SmartContractLoadTest' "${{ github.workspace }}"/report/client.log | sed -e 's/^.*Finished \([A-Za-z0-9][A-ZA-z0-9]*LoadTest\).*TPS[\:][ \t]*\([0-9][0-9]*\)$/value=\2/g' | grep -E 'value=[0-9][0-9]*'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish logs
        if: ${{ !cancelled() }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          cd "${{ github.workspace }}"/

          gcloud --no-user-output-enabled storage ls gs://performance-engineering-reports 2>/dev/null | grep permanent >/dev/null 2>&1
          if [[ ${?} -ne 0 ]]
          then
            sleep 10
            gcloud --no-user-output-enabled storage ls gs://performance-engineering-reports | grep permanent >/dev/null
          fi

          echo "Size of report dir:"
          du -sk report

          gcloud --no-user-output-enabled storage cp --recursive report "${{ env.GS_ROOT_DIR }}/${REF}_${{ inputs.test-asset }}_${{ github.run_number }}/report/longevity"
          echo Done: see results in "${{ env.GS_ROOT_HTTPS }}/${REF}_${{ inputs.test-asset }}_${{ github.run_number }}/report/longevity"

          #echo "Truncating logs for next test..."
          #sh "${{ github.workspace }}"/.github/workflows/support/citr/resetCNlogs.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"

  # Send this output back to the caller workflow
  longevity-test-reconnect:
    name: Reconnect test
    runs-on: hl-cn-sdlt-lin-lg
    if: ${{ !cancelled() }}
    needs:
      - acquire-kubernetes-resources
      - longevity-tests-start
      - longevity-tests-finish
    outputs:
      ReconnectStatus: ${{ steps.reconnect-status.outputs.value }}
    steps:
      - name: Check Test Asset
        id: set-k8s-cluster
        run: |
          K8S_CLUSTER=${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
          echo "kubernetes-cluster=${K8S_CLUSTER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.35.0

      - name: kubectl wrapper
        run: |
          kubectl=$(which kubectl)
          sudo mv ${kubectl} ${kubectl}.orig
          sudo cp "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt ${kubectl}
          sudo chmod a+rx ${kubectl}
          which kubectl
          kubectl version

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: ${{ needs.longevity-tests-start.outputs.kubernetes-cluster }}
          certificate-ttl: 24h

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Create report dir
        shell: bash
        run: |
          mkdir "${{ github.workspace }}"/report

      - name: Start Longevity test
        run: |
          run_NLGDebugparams="-Dorg.slf4j.simpleLogger.defaultLogLevel=debug" # e.g. -Dorg.slf4j.simpleLogger.defaultLogLevel=debug
          nlgpod=`sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator | awk '{print $1}'`
          n=`expr ${{ inputs.nlg-accounts }} / 1000`
          NLG_c=32

          test=LongevityLoadTest

          NLGargs="-K ECDSA -R -c ${NLG_c} -a ${{ inputs.nlg-accounts }}  -n ${n} -T 1000 -S hot -p 50"

          echo kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g \
            ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${test} \
            ${NLGargs} -tt ${{ inputs.nlg-time }}m > client.log 2>&1 &"

          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g \
            ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${test} \
            ${NLGargs} -tt ${{ inputs.nlg-time }}m > client.log 2>&1 &"
          sleep 30

      - name: Start Reconnect
        id: reconnect-status
        run: |
          set +x
          set +e

          downtime=$(expr ${{ inputs.reconnect-uptime }} \* 3)
          warmtime=${{ inputs.reconnect-uptime }}
          NofLoops=3
          result=13

          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator | awk '{print $1}')"
          mkdir -p "${{ github.workspace }}"/report/reconnect
          bash "${{ github.workspace }}"/.github/workflows/support/citr/profileReconnectLoopK8s.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" ${downtime} ${warmtime} ${NofLoops} 2>&1 | tee "${{ github.workspace }}"/report/reconnect/reconnect.log

          nlgpod=`sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator | awk '{print $1}'`
          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "tail -n 20 /app/client.log"
          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "ps -aef" | grep 'com.hedera.benchmark'
          result=$?

          if [ ${result} -ne 0 ]
          then
            echo "Failure: Reconnect finished after LoadTest"
            echo "value=${result}" >> "${GITHUB_OUTPUT}"
          else
            echo "Check for status of loop N=${NofLoops}:"
            grep -E "Reconnect N=${NofLoops} done" "${{ github.workspace }}"/report/reconnect/reconnect.log
            result=$?
            echo "value=${result}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run Validator after Reconnect
        id: validator-status
        run: |
          set +x
          set +e
          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" \
            exec -it network-node1-0 -c root-container -- bash -c "cd /opt/hgcapp/services-hedera/HapiApp2.0; bash checkValidatorNode.sh 0" 2>&1 | tee "${{ github.workspace }}"/report/reconnect/validator_status.log
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" \
            cp network-node1-0:/opt/hgcapp/services-hedera/HapiApp2.0/data/saved/validation.tmp/validator.log "${{ github.workspace }}"/report/reconnect/validator.log
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" \
            cp network-node1-0:/opt/hgcapp/services-hedera/HapiApp2.0/data/saved/validation.tmp/validatorRun.log "${{ github.workspace }}"/report/reconnect/validatorRun.log
          cat "${{ github.workspace }}"/report/reconnect/validator_status.log
          grep -E 'validation .* is OK' "${{ github.workspace }}"/report/reconnect/validator_status.log

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Copy logs
        run: |
          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${nlgpod}:/app/client.log "${{ github.workspace }}"/report/reconnect/client.log
          cat "${{ github.workspace }}"/report/client.log | perl -pne '~s/\b([A-Z_]+[\:]\d+)\b/\n$1\n/g' | perl "${{ github.workspace }}"/.github/workflows/support/citr/collectNLG_Errors.pl > "${{ github.workspace }}"/report/reconnect/client.stats.txt
          sh "${{ github.workspace }}"/.github/workflows/support/citr/getClusterErrors.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${nlgpod}:/app/version_run.txt "${{ github.workspace }}"/report/reconnect/version_run.txt
          cp -r podlog_"${{ needs.acquire-kubernetes-resources.outputs.namespace }}" "${{ github.workspace }}"/report/reconnect/

      - name: Publish logs
        if: ${{ !cancelled() }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          cd "${{ github.workspace }}"/

          gcloud --no-user-output-enabled storage ls gs://performance-engineering-reports 2>/dev/null | grep permanent >/dev/null 2>&1
          if [[ ${?} -ne 0 ]]
          then
            sleep 10
            gcloud --no-user-output-enabled storage ls gs://performance-engineering-reports | grep permanent >/dev/null
          fi

          gcloud --no-user-output-enabled storage cp --recursive report "${{ env.GS_ROOT_DIR }}/${REF}_${{ inputs.test-asset }}_${{ github.run_number }}/report/reconnect"
          echo Done: see results in "${{ env.GS_ROOT_HTTPS }}/${REF}_${{ inputs.test-asset }}_${{ github.run_number }}/report/reconnect"

      - name: Delete namespace
        if: ${{ inputs.delete-namespace == true }}
        run: |
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt delete namespace "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"

  # Send this output back to the caller workflow
  single-day-longevity-test-result:
    name: Calculate Result
    runs-on: hl-cn-sdlt-lin-lg
    if: ${{ !cancelled() }}
    needs:
      - longevity-tests-start
      - longevity-tests-finish
      - longevity-test-reconnect
    outputs:
      result: ${{ steps.sdlt-status.outputs.result }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Set output
        id: sdlt-status
        run: |
          RESULT="failure"
          NFT="${{ needs.longevity-tests-finish.outputs.NFTscore }}"
          HELI="${{ needs.longevity-tests-finish.outputs.Heliscore }}"
          CRYPTO="${{ needs.longevity-tests-finish.outputs.Cryptoscore }}"
          HCS="${{ needs.longevity-tests-finish.outputs.HCSscore }}"
          SMART="${{ needs.longevity-tests-finish.outputs.Smartscore }}"
          VALIDATOR="${{ needs.longevity-tests-finish.outputs.ValidatorStatus }}"
          RECONNECT="${{ needs.longevity-test-reconnect.outputs.ReconnectStatus }}"

          # Check if any variable is empty. If it is, we set the result to failure.
          if [[ -z "${NFT}" ]] || [[ -z "${HELI}" ]] || [[ -z "${CRYPTO}" ]] || [[ -z "${HCS}" ]] || [[ -z "${SMART}" ]] || [[ "${VALIDATOR}" != "0" ]] || [[ "${RECONNECT}" != "0" ]]; then
            RESULT="failure"
          else
            RESULT="success"
          fi

          echo "## Single Day Longevity Result" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "result=${RESULT}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "result=${RESULT}" >> "${GITHUB_OUTPUT}"

          echo "## Individual Results" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- NftTransferLoadTest TPS: ${NFT}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- HeliSwapLoadTest TPS: ${HELI}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- CryptoTransferLoadTest TPS: ${CRYPTO}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- HCSLoadTest TPS: ${HCS}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- SmartContractLoadTest TPS: ${SMART}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- Validator: ${VALIDATOR}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- Reconnect: ${RECONNECT}" | tee -a "${GITHUB_STEP_SUMMARY}"

  longevity-report-failures:
    name: Report Failures
    runs-on: hl-cn-sdlt-lin-sm
    needs:
      - longevity-tests-start
      - longevity-tests-wait
      - longevity-tests-finish
      - longevity-test-reconnect
      - single-day-longevity-test-result
    if: ${{ (needs.longevity-tests-finish.result != 'success' ||
      needs.single-day-longevity-test-result.result != 'success' ||
      needs.longevity-test-reconnect.result != 'success') &&
      !cancelled() && always() }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Build Summary Details
        id: summary
        env:
          REF: ${{ inputs.ref }}
        run: |
          title="The Single Day Longevity Test workflow failed (SDLT ${{ inputs.test-asset }} - ${REF})"
          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          {
            echo 'summary<<EOF'
            echo "------------------------------------"
            echo "Status of each jobs:"
            echo "- Longevity Tests Start: ${{ needs.longevity-tests-start.result }}"
            echo "- Longevity Tests Wait: ${{ needs.longevity-tests-wait.result }}"
            echo "- Longevity Tests Finish: ${{ needs.longevity-tests-finish.result }}"
            echo "- Single Day Longevity Test Result: ${{ needs.single-day-longevity-test-result.result }}"
            echo "------------------------------------"
            echo "Commit information:"
            echo "- Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ needs.longevity-tests-start.outputs.commit-sha }}>"
            echo "- Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Log Job Summary
        run: |
          echo "## Rootly Summary" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "### Title: ${{ steps.summary.outputs.title }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.summary.outputs.summary }}" | tee -a "${GITHUB_STEP_SUMMARY}"

  longevity-report-to-slack:
    runs-on: hl-cn-sdlt-lin-sm
    needs:
      - longevity-tests-finish
      - single-day-longevity-test-result
      - longevity-test-reconnect

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Clean branch or tag name from input.ref
        id: clean-branch-name
        env:
          REF: ${{ inputs.ref }}
        run: |
          raw_ref="${REF}"
          echo "Raw input ref: ${raw_ref}"
          clean_ref=""

          if [[ "${raw_ref}" == refs/heads/* ]]; then
            clean_ref="${raw_ref#refs/heads/}"
          elif [[ "${raw_ref}" == refs/tags/* ]]; then
            clean_ref="${raw_ref#refs/tags/}"
          elif [[ "${raw_ref}" == refs/pull/*/merge ]]; then
            clean_ref="PR-${raw_ref#refs/pull/}"
            clean_ref="${clean_ref%/merge}"
          fi

          echo "clean_ref=${clean_ref}" >> "${GITHUB_OUTPUT}"

      - name: Build Slack Payload Message
        id: payload
        env:
          REF: ${{ inputs.ref }}
        run: |

          report="\
            NftTransferLoadTest ${{ needs.longevity-tests-finish.outputs.NFTscore }} \n\
            HCSLoadTest ${{ needs.longevity-tests-finish.outputs.HCSscore }} \n\
            CryptoTransferLoadTest ${{ needs.longevity-tests-finish.outputs.Cryptoscore }} \n\
            HeliSwapLoadTest ${{ needs.longevity-tests-finish.outputs.Heliscore }}\n\
            SmartContractLoadTest ${{ needs.longevity-tests-finish.outputs.Smartscore }}"

          if [[ "${{ needs.longevity-tests-finish.outputs.ValidatorStatus }}" == "0" ]]
          then
            Validator="PASSED"
          else
            Validator="FAILED"
          fi

          if [[ "${{ needs.longevity-test-reconnect.outputs.ReconnectStatus }}" == "0" ]]
          then
            Reconnect="PASSED"
          else
            Reconnect="FAILED"
          fi

          #last line is 5, it does not need comma block separator
          freport=`/usr/bin/echo -e "$report" | awk '{print $1" "$2}'| perl -ne 'if ($. < 5) {$comma=","} else {$comma="";} ($t,$d)=split(/\s+/,$_,2);printf("{\"type\": \"text\",\"text\": \"%-25s %7d \\\n\"}%s",$t,$d,$comma);'`
          freport="{\"type\": \"text\",\"text\": \"Name                          TPS\n\"},${freport},\
           {\"type\": \"text\",\"text\": \"ValidatorTest ${Validator}\n\"},
           {\"type\": \"text\",\"text\": \"ReconnectTest ${Reconnect}\"}"

          COLOR="#FF0000"
          if [[ "${{ needs.single-day-longevity-test-result.outputs.result }}" == "success" ]]; then
            COLOR="#00FF00"
          elif [[ "${{ needs.single-day-longevity-test-result.outputs.result }}" == "cancelled" ]]; then
            COLOR="#555555"
          fi

          cat <<EOF > slack_payload.json
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "NLG Longevity Test Report (SDLT) - ${{ steps.clean-branch-name.outputs.clean_ref }}",
                      "emoji": true
                    }
                  },
                  {
                    "type": "divider"
                  },
                  {
                      "type": "rich_text",
                      "elements": [
                        {
                          "type": "rich_text_preformatted",
                          "elements": [
                            ${freport}
                          ]
                        }
                      ]
                  },
                  {
                    "type": "divider"
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Workflow and Commit Information*"
                    },
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Workflow run ID*:"
                      },
                      {
                        "type": "mrkdwn",
                        "text": " ${{ github.run_id }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Version*: ${REF}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF

      ## Slack notifications
      - name: Report status (slack detailed reports)
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.slack-report-webhook }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload.json
