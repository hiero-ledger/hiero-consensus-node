              fi
            fi
          done
          [[ "${FAILED}" -eq 0 ]] || exit 1

          PUSH_BASE="${GCP_IMAGE_BASE}"
          if [[ "${DRY_RUN}" == "true" ]]; then
            PUSH_BASE="localhost:5000"
            docker run -d -p 5000:5000 --restart=always --name registry registry:latest
