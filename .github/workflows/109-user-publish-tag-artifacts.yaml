            IMAGE_PREFIX=${{ steps.image.outputs.push-base }}/
          context: ${{ env.CONTAINERS }}/main-network-node
          tags: ${{ steps.image.outputs.push-base }}/main-network-node:${{ env.VERSION }}

      - name: Render Job Summary
        env:
          PUSH_BASE: ${{ steps.image.outputs.push-base }}
        run: |
          echo "### Local Node Images" >>"${GITHUB_STEP_SUMMARY}"
          for IMAGE in network-node-haveged network-node-base main-network-node; do
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "- Dry run: \`${PUSH_BASE}/${IMAGE}:${VERSION}\` (not \`${GCP_IMAGE_BASE}\`)" >>"${GITHUB_STEP_SUMMARY}"
