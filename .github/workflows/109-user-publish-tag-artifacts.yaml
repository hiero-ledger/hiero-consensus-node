        uses: step-security/setup-buildx-action@f931205d68723ad9589fd2a7e2ece238bf9de341 # v4.0.0
        with:
          version: v0.32.1
          driver-opts: network=host,image=ghcr.io/hashgraph/runner-images/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://hub.mirror.docker.lat.ope.eng.hashgraph.io"]

      - name: Resolve Images
        id: image
        run: |
          FAILED=0
          for IMAGE in network-node-haveged network-node-base main-network-node; do
            if docker buildx imagetools inspect "${GCP_IMAGE_BASE}/${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              if [[ "${DRY_RUN}" != "true" ]]; then
                echo "::error title=Image Exists::${GCP_IMAGE_BASE}/${IMAGE}:${VERSION} already exists. It is not overwritten."
