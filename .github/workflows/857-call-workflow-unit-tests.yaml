# SPDX-License-Identifier: Apache-2.0
name: "857: [CALL] Workflow Unit Tests"
on:
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test-gomplate-templates:
    name: Validate Gomplate Templates
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          setup-gomplate: "true"

      - name: Test Templates
        run: bash ./.github/workflows/support/tests/test-gomplate-templates.sh

  test-resolve-ref:
    name: Validate Ref Resolution
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Test Ref Resolution
        run: bash ./.github/workflows/support/tests/test-resolve-ref.sh

  test-evm-timeout-only-failures:
    name: Validate EVM Timeout Retry Classification
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Test EVM Timeout Retry Classification
        run: bash ./.github/workflows/support/tests/test-evm-timeout-only-failures.sh

  test-resolve-cn-versions:
    name: Validate Consensus Node Version Resolution
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          setup-jq: "true"

      - name: Test Consensus Node Config Resolution
        run: bash ./.github/workflows/support/tests/test-resolve-cn-configs.sh

  test-summarize-bn-matrix:
    name: Validate Block Node Matrix Summary
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          setup-jq: "true"

      - name: Test Block Node Matrix Summary
        run: bash ./.github/workflows/support/tests/test-summarize-bn-matrix.sh

  test-resolve-bn-versions:
    name: Validate Block Node Version Resolution
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          setup-jq: "true"

      - name: Test Block Node Version Resolution
        run: bash ./.github/workflows/support/tests/test-resolve-bn-versions.sh

  test-ci-metrics:
    name: Validate CI Metrics Scripts
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"

      # The runner image's Python: on the hl-cn runners, setup-python installs a build that needs a newer glibc than
      # the image has (same pattern as 007, 822, 823 and 905)
      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3

      - name: Test CI Metrics Scripts
        run: python3 -I -m unittest discover -s .github/workflows/support/scripts/ci-metrics/tests

  # TEMPORARY, remove before merge: does the setup-python input of initialize-github-job work on the hl-cn runners?
  # (actions/setup-python installs a CPython build that needs glibc 2.38; the hl-cn-default-lin-sm image has less.)
  # continue-on-error keeps a failure here from failing the workflow.
  temp-check-setup-python-v122:
    name: "TEMP Check initialize-github-job setup-python (v1.2.2)"
    runs-on: hl-cn-default-lin-sm
    continue-on-error: true
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          setup-python: "true"
          python-version: "3.12"

      - name: Run Python
        run: |
          ldd --version | head -1
          which python3
          python3 --version
          python3 -c "import sys; print('python ok', sys.version)"

  # TEMPORARY, remove before merge: does the setup-python input of initialize-github-job work on the hl-cn runners?
  # (actions/setup-python installs a CPython build that needs glibc 2.38; the hl-cn-default-lin-sm image has less.)
  # continue-on-error keeps a failure here from failing the workflow.
  temp-check-setup-python-v150:
    name: "TEMP Check initialize-github-job setup-python (v1.5.0)"
    runs-on: hl-cn-default-lin-sm
    continue-on-error: true
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@74303607c68fe88ff9b7bfc05c40ca948fa04b13 # v1.5.0
        with:
          setup-python: "true"
          python-version: "3.12"

      - name: Run Python
        run: |
          ldd --version | head -1
          which python3
          python3 --version
          python3 -c "import sys; print('python ok', sys.version)"
