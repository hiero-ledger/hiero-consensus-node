# SPDX-License-Identifier: Apache-2.0
name: "205: [DISP] CITR MDLT Publish Results"
run-name: "MDLT Publish Results for ${{ github.event.inputs.build-tag }} (allocation ${{ github.event.inputs.allocation-id }})"

# Collects MDLT run logs/status from the cluster and publishes them to GCS. The cluster and namespace
# are resolved from the Chewie allocation, so the only run-specific value needed is the Allocation ID
# printed by the 835 kickoff. Short-term this is user-triggered; longer-term Chewie dispatches it.

on:
  workflow_dispatch:
    inputs:
      build-tag:
        required: true
        description: "The build tag this MDLT run is associated with (e.g. build-12345)"
        type: string
      allocation-id:
        required: true
        description: "The Chewie Allocation ID for the MDLT run - from the 835 kickoff summary"
        type: string
      fsts_report:
        description: "Generate PDF reports with FSTS_Insight (requires the FSTS_* repo secrets to be provisioned)"
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash

permissions:
  contents: read
  id-token: write

env:
  GS_ROOT_DIR: gs://performance-engineering-reports/ephemeral/test_runs
  GS_ROOT_HTTPS: https://perf.analytics.eng.hashgraph.io/ephemeral/test_runs

jobs:
  get-chewie-jwt:
    name: Get Chewie JWT
    uses: ./.github/workflows/858-call-get-chewie-jwt.yaml
    secrets:
      chewie-key: ${{ secrets.CHEWIE_REPO_IDENTITY_KEY }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}

  validate-chewie-jwt:
    name: Validate Chewie JWT
    needs: get-chewie-jwt
    uses: ./.github/workflows/860-call-validate-chewie-jwt.yaml
    with:
      ref: ${{ github.ref }}
      chewie-expiration: ${{ needs.get-chewie-jwt.outputs.expiration }}
    secrets:
      chewie-jwt: ${{ needs.get-chewie-jwt.outputs.jwt }}
      checkout-token: ${{ secrets.GITHUB_TOKEN }}

  publish-mdlt-results:
    name: Publish MDLT Results
    runs-on: hl-cn-mdlt-lin-sm
    needs:
      - get-chewie-jwt
      - validate-chewie-jwt
    env:
      HOST: "${{ secrets.CHEWIE_HOST }}"
      API_EP_COMPUTE_ALLOCATION: "api/v1/compute/allocation"
      ALLOCATION_ID: "${{ inputs.allocation-id }}"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Mask Chewie JWT
        env:
          CHEWIE_JWT_B64: ${{ needs.get-chewie-jwt.outputs.jwt }}
        run: |
          # The JWT arrives here as a job output rather than through a secrets: input the way 859
          # receives it, so nothing has registered it for redaction. Masks are job-scoped, so this
          # has to happen in this job, ahead of every step that handles the token.
          echo "::add-mask::${CHEWIE_JWT_B64}"

      - name: Validate Allocation ID
        run: |
          # Chewie parses :id as a positive int64; reject anything else before spending a request on it.
          if [[ ! "${ALLOCATION_ID}" =~ ^[0-9]+$ ]] || [[ "${ALLOCATION_ID}" -le 0 ]]; then
            echo "::error title=Invalid Allocation ID::'${ALLOCATION_ID}' is not a positive integer."
            exit 1
          fi

      - name: Resolve Chewie Allocation
        id: allocation
        env:
          CHEWIE_JWT_B64: ${{ needs.get-chewie-jwt.outputs.jwt }}
        run: |
          # No -g/-x: the allocation was built by the 835 run, so let the script discover whatever
          # instance groups Chewie recorded. Emits namespace/kubernetes-fqdn as step outputs and
          # writes the allocation detail to the job summary.
          .github/workflows/support/chewie/parse-chewie-allocation.sh \
            -o "${HOST}" \
            -e "${API_EP_COMPUTE_ALLOCATION}" \
            -i "${ALLOCATION_ID}" \
            -f both

      - name: Verify Allocation Is Usable
        env:
          NAMESPACE: ${{ steps.allocation.outputs.namespace }}
          FQDN: ${{ steps.allocation.outputs.kubernetes-fqdn }}
          STATUS: ${{ steps.allocation.outputs.status }}
        run: |
          # A released/expired allocation has no cluster left to collect from; fail with the reason
          # rather than handing an empty cluster name to Teleport.
          if [[ -z "${NAMESPACE}" || "${NAMESPACE}" == "null" || -z "${FQDN}" || "${FQDN}" == "null" ]]; then
            echo "::error title=Allocation not usable::Allocation ${ALLOCATION_ID} is '${STATUS}' and has no namespace/cluster."
            exit 1
          fi

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.33.0

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: "${{ steps.allocation.outputs.kubernetes-fqdn }}"
          certificate-ttl: 24h

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: List Kubernetes Pods
        env:
          NAMESPACE: ${{ steps.allocation.outputs.namespace }}
        run: sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${NAMESPACE}" get pods

      # --- FSTS Insight setup (only when fsts_report is enabled) ---------------------------------
      # Generates PDF reports from the network MainNetStats CSVs. The FSTS Insight tool lives in
      # hashgraph/jrs-legacy (accessed with the same token XTS uses). The insight configs are fetched
      # over Teleport (reusing the auth-ssh identity), so no SSH key/host secrets are needed. Requires:
      #   JRS_GH_ACCESS_TOKEN        - GitHub token with read access to hashgraph/jrs-legacy
      #   FSTS_INSIGHT_CONFIGS_HOST  - Teleport SSH node that serves the .insight_configs directory
      #   FSTS_INSIGHT_CONFIGS_LOGIN - SSH login (OS user) on that node
      #   FSTS_INSIGHT_CONFIGS_PATH  - remote path to the .insight_configs directory
      - name: Checkout FSTS Insight tool
        if: ${{ inputs.fsts_report == true }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hashgraph/jrs-legacy
          ref: develop
          token: ${{ secrets.JRS_GH_ACCESS_TOKEN }}
          path: jrs-legacy

      - name: Setup Python
        if: ${{ inputs.fsts_report == true }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install FSTS Insight
        if: ${{ inputs.fsts_report == true }}
        run: |
          pip install ./jrs-legacy/assets/fsts_insight
          fsts_insight --help
          echo "FSTS is ready"

      - name: Fetch FSTS insight configs
        if: ${{ inputs.fsts_report == true }}
        env:
          TELEPORT_IDENTITY: ${{ steps.auth-ssh.outputs.identity-file }}
          TELEPORT_LOGIN: ${{ secrets.FSTS_INSIGHT_CONFIGS_LOGIN }}
          TELEPORT_HOST: ${{ secrets.FSTS_INSIGHT_CONFIGS_HOST }}
          INSIGHT_CONFIGS_PATH: ${{ secrets.FSTS_INSIGHT_CONFIGS_PATH }}
        run: |
          sh "${{ github.workspace }}"/.github/workflows/support/citr/scpR.sh "${INSIGHT_CONFIGS_PATH}" "${HOME}/"

      # GS_ROOT_DIR / GS_ROOT_HTTPS are read from the workflow environment by the script.
      - name: Collect MDLT results and publish to GCS
        env:
          NAMESPACE: ${{ steps.allocation.outputs.namespace }}
          BUILD_TAG: ${{ inputs.build-tag }}
          FSTS_REPORT: ${{ inputs.fsts_report }}
        run: |
          bash "${{ github.workspace }}"/.github/workflows/support/citr/collectMdltResults.sh \
            "${NAMESPACE}" "${BUILD_TAG}" "${FSTS_REPORT}"
