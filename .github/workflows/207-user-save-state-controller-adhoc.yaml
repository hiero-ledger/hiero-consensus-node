# SPDX-License-Identifier: Apache-2.0
name: "207: [USER] CITR Save state"
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The git ref (branch or tag) to checkout"
        required: false
        default: ""
      nlg-accounts: #'-R -c 32 -a 100000000 -T 1000 -n 100000 -S hot -p 50 -tt 1m
        required: true
        default: "100000"
        description: "Number of Accounts and NFT tokens"
        type: choice
        options:
          - "100000"
          - "1000000"
          - "20000000"
          - "100000000"
          - "500000000"
          - "1000000000"
      nlg-time: #'-R -c 32 -a 100000000 -T 1000 -n 100000 -S hot -p 50 -tt 1m
        required: true
        default: "3"
        description: "Test execution time options"
        type: choice
        options:
          - "3"
          - "9"
          - "21"
          - "30"
          - "60"
          - "180"
          - "330"
          - "720"
          - "960"
          - "1200"
          - "10080"
          - "20160"
      add-app-props:
        required: false
        default: ""
        type: string
        description: 'Add props to application.properties, e.g. "blockStream.streamMode=RECORDS". Newline is "\n"'
      add-settings:
        required: false
        default: ""
        type: string
        description: 'Add props to settings.txt, e.g. "state.saveStatePeriod, 300". Newline is "\n"'
      duration-minutes:
        required: false
        default: "1440"
        description: "Expected duration of all tests in minutes"
        type: string
      disable-notifications:
        required: false
        default: true
        type: boolean
        description: "If true, skip tag and notifications"
      perf:
        required: false
        default: ""
        description: "Expected duration of all tests in minutes"
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  id-token: write
  actions: write
  statuses: write

jobs:
  verify-tag:
    name: Verify Tag
    runs-on: hl-cn-sdlt-lin-sm
    continue-on-error: true
    outputs:
      build-number: ${{ steps.resolve-ref.outputs.build-number }}
      commit: ${{ steps.resolve-ref.outputs.commit }}
      branch: ${{ steps.resolve-ref.outputs.branch }}
      build-tag-number: ${{ steps.resolve-ref.outputs.build-tag-number }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref || github.ref }}"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"

      # Chewie records AdHoc results against the commit under test, with its branch when the ref is a
      # branch and its build number when the ref is a build tag.
      - name: Resolve Ref
        id: resolve-ref
        env:
          REF: "${{ inputs.ref || github.ref }}"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/support/citr/resolve-ref.sh -r "${REF}" -d "${DEFAULT_BRANCH}" -l SDLT

  extract-jdk-version:
    name: Extract Java Version
    uses: ./.github/workflows/854-call-extract-jdk-version.yaml
    with:
      ref: ${{ github.ref }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  extract-citr-vars:
    name: Extract CITR Vars
    uses: ./.github/workflows/855-call-extract-citr-vars.yaml
    with:
      ref: ${{ github.ref }}
      env-file: ".github/workflows/support/citr/.citr-env.save"
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  extract-chewie-props:
    name: Extract Chewie Properties
    uses: ./.github/workflows/862-call-get-chewie-properties.yaml
    with:
      ref: ${{ github.ref }}
    secrets:
      checkout-token: ${{ secrets.GITHUB_TOKEN }}

  verify-citr-vars:
    name: Verify CITR vars
    needs:
      - extract-citr-vars
      - extract-chewie-props
    runs-on: hl-cn-default-lin-sm
    outputs:
      request-duration: ${{ steps.check-chewie-outputs.outputs.request-duration }}
      request-timeout: ${{ steps.check-chewie-outputs.outputs.request-timeout }}
    steps:
      - name: Harden Runner
        id: harden-runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check CITR Variables
        id: check-citr-vars-outputs
        run: |
          if [[ "${{ needs.extract-citr-vars.outputs.adhoc-solo-version }}" == "" ]]; then
            echo "::error::One or more required CITR variables are missing. Failing the job."
            exit 1
          else
            echo "All required CITR variables are present."
          fi

      - name: Check Chewie Properties
        id: check-chewie-outputs
        run: |
          DEFAULT_DURATION=""
          if [[ "${{ inputs.duration-minutes }}" != "" ]]; then
            DEFAULT_DURATION="${{ inputs.duration-minutes }}"
          else
            DEFAULT_DURATION_SECONDS="${{ needs.extract-chewie-props.outputs.request-duration }}"
            if [[ "${DEFAULT_DURATION_SECONDS}" == "" ]]; then
              echo "::error::Chewie default duration is missing. Failing the job."
              exit 1
            fi
            DEFAULT_DURATION=$((DEFAULT_DURATION_SECONDS / 60))
          fi

          DEFAULT_TIMEOUT="${{ needs.extract-chewie-props.outputs.request-timeout }}"
          if [[ "${DEFAULT_TIMEOUT}" == "" ]]; then
            echo "::error::Chewie default timeout is missing. Failing the job."
            exit 1
          fi

          # Note: Duration is in minutes, Timeout is in seconds
          echo "request-duration=${DEFAULT_DURATION}" >> "${GITHUB_OUTPUT}"
          echo "request-timeout=${DEFAULT_TIMEOUT}" >> "${GITHUB_OUTPUT}"

  get-chewie-jwt:
    name: Get Chewie JWT
    uses: ./.github/workflows/858-call-get-chewie-jwt.yaml
    secrets:
      chewie-key: ${{ secrets.CHEWIE_REPO_IDENTITY_KEY }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}

  get-sdlt-config:
    name: Get SDLT Test Config
    uses: ./.github/workflows/861-call-get-test-config.yaml
    with:
      test-type: "sdlt"
      ref: ${{ github.ref }}
    secrets:
      checkout-token: ${{ secrets.GITHUB_TOKEN }}

  validate-chewie-jwt:
    name: Validate Chewie JWT
    needs: get-chewie-jwt
    uses: ./.github/workflows/860-call-validate-chewie-jwt.yaml
    with:
      ref: ${{ github.ref }}
      chewie-expiration: ${{ needs.get-chewie-jwt.outputs.expiration }}
    secrets:
      chewie-jwt: ${{ needs.get-chewie-jwt.outputs.jwt }}
      checkout-token: ${{ secrets.GITHUB_TOKEN }}

  acquire-kubernetes-resources:
    name: Acquire Kubernetes Resources
    needs:
      - validate-chewie-jwt
      - get-chewie-jwt
      - get-sdlt-config
      - verify-citr-vars
    uses: ./.github/workflows/859-call-create-chewie-request.yaml
    with:
      instances-cn-qty: ${{ fromJSON(needs.get-sdlt-config.outputs.cn-qty) }}
      instances-cn-cpu: ${{ fromJSON(needs.get-sdlt-config.outputs.cn-cpu-request) }}
      instances-cn-memory-mb: ${{ fromJSON(needs.get-sdlt-config.outputs.cn-mem-request-mb) }}
      instances-aux-qty: ${{ fromJSON(needs.get-sdlt-config.outputs.aux-qty) }}
      instances-aux-cpu: ${{ fromJSON(needs.get-sdlt-config.outputs.aux-cpu-request) }}
      instances-aux-memory-mb: ${{ fromJSON(needs.get-sdlt-config.outputs.aux-mem-request-mb) }}
      duration-minutes: ${{ fromJSON(needs.verify-citr-vars.outputs.request-duration) }}
      request-timeout: ${{ fromJSON(needs.verify-citr-vars.outputs.request-timeout) }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      chewie-token: ${{ needs.get-chewie-jwt.outputs.jwt }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}

  # Required: a failed report fails the run. Starts together with the test: same needs, so it reports
  # running when the test kicks off. Neither waits on the other. Reported whether or not notifications
  # are disabled; that input only controls the tags and Slack.
  report-adhoc-sdlt-running:
    name: Report AdHoc SDLT Running to Chewie
    needs:
      - verify-tag
      - extract-jdk-version
      - extract-citr-vars
      - verify-citr-vars
      - acquire-kubernetes-resources
    if: ${{ needs.verify-tag.outputs.commit != '' }}
    uses: ./.github/workflows/864-call-report-suite-result.yaml
    with:
      suite-type: adhoc_sdlt
      commit: ${{ needs.verify-tag.outputs.commit }}
      branch: ${{ needs.verify-tag.outputs.branch }}
      build-number: ${{ needs.verify-tag.outputs.build-tag-number }}
      disposition: running
    secrets:
      chewie-key: ${{ secrets.CHEWIE_REPO_IDENTITY_KEY }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}

  run-single-day-longevity-test:
    name: Longevity Test
    needs:
      - verify-tag
      - extract-jdk-version
      - extract-citr-vars
      - verify-citr-vars
      - acquire-kubernetes-resources
    uses: ./.github/workflows/867-call-save-state-longevity-test.yaml
    if: ${{ needs.verify-tag.result == 'success' || inputs.disable-notifications == true }}
    with:
      ref: "${{ inputs.ref || github.ref }}"
      bnref: "${{ needs.extract-citr-vars.outputs.bn-release-version }}"
      mirrorref: "${{ needs.extract-citr-vars.outputs.bn-mirror-node-version }}"
      explorerref: "${{ needs.extract-citr-vars.outputs.mirror-node-explorer-version }}"
      relayref: "${{ needs.extract-citr-vars.outputs.json-rpc-relay-version }}"
      solo-version: "${{ needs.extract-citr-vars.outputs.adhoc-solo-version }}"
      nlg-accounts: "${{ inputs.nlg-accounts }}"
      nlg-time: "${{ inputs.nlg-time }}"
      add-app-props: "${{ inputs.add-app-props }}"
      add-settings: "${{ inputs.add-settings }}"
      allocation-id: ${{ needs.acquire-kubernetes-resources.outputs.allocation-id }}
      java-version: "${{ needs.extract-jdk-version.outputs.jdk-version }}"
      nlg-version: "${{ needs.extract-citr-vars.outputs.nlg-version }}"
    secrets:
      slack-report-webhook: ${{ secrets.SLACK_CITR_DETAILED_REPORTS_WEBHOOK }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      github-token2: ${{ inputs.perf }}
      chewie-id-key: ${{ secrets.CHEWIE_REPO_IDENTITY_KEY }}
      chewie-host: ${{ secrets.CHEWIE_HOST }}
