# SPDX-License-Identifier: Apache-2.0
name: "600: [FLOW] PR Checks"
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  checks: write
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-change-type:
    name: Detect Change Type
    runs-on: hl-cn-default-lin-sm
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      enable-tests: ${{ steps.classify.outputs.enable-tests }}
      workflow-files-changed: ${{ steps.classify.outputs.workflow-files-changed }}
      smart-contracts-changed: ${{ steps.classify.outputs.smart-contracts-changed }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: ${{ secrets.GITHUB_TOKEN }}
          checkout-fetch-depth: "0"

      - name: Classify Changed Files
        id: classify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const script = require('.github/workflows/support/scripts/classify-changed-files.js');
            await script({github, context, core})

  extract-jdk-version:
    name: Extract Java Version
    uses: ./.github/workflows/854-call-extract-jdk-version.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  mats-pr-checks:
    name: MATS
    needs:
      - detect-change-type
      - extract-jdk-version
    uses: ./.github/workflows/800-call-mats-tests.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      enable-dependency-check: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-unit-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-integration-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-hapi-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-otter-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-snyk-scan: ${{ needs.detect-change-type.outputs.enable-tests }}
      java-version: ${{ needs.extract-jdk-version.outputs.jdk-version }}
      java-distribution: "temurin"
      custom-job-label: "Standard"
    secrets:
      access-token: ${{ secrets.GITHUB_TOKEN }}
      codacy-project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      gradle-cache-username: ${{ secrets.GRADLE_CACHE_USERNAME }}
      gradle-cache-password: ${{ secrets.GRADLE_CACHE_PASSWORD }}
      snyk-token: ${{ secrets.SNYK_TOKEN }}

  workflow-unit-tests:
    name: Workflow File Tests
    needs:
      - detect-change-type
    if: ${{ needs.detect-change-type.outputs.workflow-files-changed == 'true' }}
    uses: ./.github/workflows/857-call-workflow-unit-tests.yaml

  # The EVM functional tests (870) run only when a non-documentation file under the smart-contract service
  # modules changed, or when the PR carries the "Run EVM Tests" (or "Run Full CI") label. The gate is a job-level
  # `if:` rather than an `on.pull_request.paths` filter so the workflow always reports; a skipped job counts as
  # passing. The result is advisory: it is surfaced in the PR summary and the per-shard check runs, but
  # `ci-complete` (a required status check) does not depend on it. The tests run after MATS and only when MATS
  # succeeded, so a PR that does not compile or fails MATS does not spend 18 solo deployments.
  extract-citr-vars:
    name: Extract CITR Vars
    needs:
      - detect-change-type
    if: ${{ needs.detect-change-type.outputs.smart-contracts-changed == 'true' }}
    uses: ./.github/workflows/855-call-extract-citr-vars.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  evm-functional-tests:
    name: EVM Functional Tests
    needs:
      - detect-change-type
      - extract-jdk-version
      - extract-citr-vars
      - mats-pr-checks
    if: ${{ needs.detect-change-type.outputs.smart-contracts-changed == 'true' }}
    uses: ./.github/workflows/870-call-evm-functional-tests.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      custom-job-name: "Standard"
      java-version: ${{ needs.extract-jdk-version.outputs.jdk-version }}
      java-distribution: "temurin"
      solo-version: ${{ needs.extract-citr-vars.outputs.citr-solo-version }}
      # When citr values get updated change back to
      # ${{ needs.extract-citr-vars.outputs.citr-mirror-node-version }}
      # Needs v 163 of MN so contract/result works as expected
      mirror-node-version: "0.163.1"
      # Deliberately not `needs.extract-citr-vars.outputs.json-rpc-relay-version` (v0.78.0): the HIP-1340 shards
      # need TX_TYPE_4_ENABLED, which first shipped in relay 0.79.0-rc1. Bumping .citr-env instead would also move
      # the XTS JSON-RPC relay regression panel (818).
      json-rpc-relay-version: "0.79.0-rc1"
    secrets:
      access-token: ${{ secrets.GITHUB_TOKEN }}
      gradle-cache-username: ${{ secrets.GRADLE_CACHE_USERNAME }}
      gradle-cache-password: ${{ secrets.GRADLE_CACHE_PASSWORD }}

  ci-complete:
    name: CI Complete
    runs-on: hl-cn-default-lin-sm
    needs:
      - detect-change-type
      - mats-pr-checks
      - workflow-unit-tests
    if: ${{ !cancelled() && always() }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Evaluate Results
        run: |
          echo "Docs-only: ${{ needs.detect-change-type.outputs.docs-only }}"
          echo "MATS result: ${{ needs.mats-pr-checks.result }}"

          if [[ "${{ needs.workflow-unit-tests.result }}" == "failure" ]]; then
            echo "Workflow file tests failed."
            exit 1
          fi

          if [[ "${{ needs.mats-pr-checks.result }}" == "success" ]]; then
            echo "All required checks passed."
            exit 0
          else
            echo "MATS checks did not succeed (result: ${{ needs.mats-pr-checks.result }})."
            exit 1
          fi

  report-summary:
    name: Report PR Check Summary
    runs-on: hl-cn-default-lin-sm
    needs:
      - detect-change-type
      - mats-pr-checks
      - workflow-unit-tests
      - evm-functional-tests
    if: ${{ !cancelled() && always() }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: ${{ github.event.pull_request.head.sha }}
          checkout-token: ${{ secrets.GITHUB_TOKEN }}
          checkout-fetch-depth: "0"

      - name: Report Summary
        id: report-summary
        env:
          PRINT_FAILED_TESTS_SCRIPT: ".github/workflows/support/scripts/print-failed-tests.sh"
        run: |
          echo "::debug::Generating PR Check Summary"

          # Append summary to GitHub Step Summary
          {
            echo "## PR Check Summary"
            echo ""
            if [[ "${{ needs.detect-change-type.outputs.docs-only }}" == "true" ]]; then
              echo "> **Docs-only PR detected.** Unit, integration, HAPI, otter, determinism, dependency, and Snyk checks were skipped. Build and Spotless still ran."
              echo ""
            fi
            echo "------------------------------------"
            echo "### Results"
            echo "- **MATS Tests:** ${{ needs.mats-pr-checks.result }}"
            echo "- **Workflow File Tests:** ${{ needs.workflow-unit-tests.result }}"
            echo "- **EVM Functional Tests (advisory):** ${{ needs.evm-functional-tests.result }}"
            echo "------------------------------------"
            if [[ "${{ needs.mats-pr-checks.result }}" == "failure" ]]; then
                echo "### MATS Test Failures"
                echo ""
                echo "- **Failure Mode:** ${{ needs.mats-pr-checks.outputs.failure-mode }}"
                echo "- **Failed Tests:**"
                bash "${{ github.workspace }}/${{ env.PRINT_FAILED_TESTS_SCRIPT }}" "${{ needs.mats-pr-checks.outputs.failed-tests }}"
                echo "------------------------------------"
            fi
            if [[ "${{ needs.detect-change-type.outputs.smart-contracts-changed }}" != "true" ]]; then
                echo "> **EVM Functional Tests skipped.** No non-documentation change under the smart-contract service modules and no \`Run EVM Tests\` label."
                echo "------------------------------------"
            elif [[ "${{ needs.evm-functional-tests.result }}" == "skipped" ]]; then
                echo "> **EVM Functional Tests skipped.** They run after MATS, and an upstream job did not succeed (MATS result: ${{ needs.mats-pr-checks.result }})."
                echo "------------------------------------"
            elif [[ "${{ needs.evm-functional-tests.result }}" == "failure" ]]; then
                echo "### EVM Functional Test Failures (advisory, does not gate CI Complete)"
                echo ""
                echo "- **Failure Mode:** ${{ needs.evm-functional-tests.outputs.failure-mode }}"
                echo "- **Failed Shards:**"
                bash "${{ github.workspace }}/${{ env.PRINT_FAILED_TESTS_SCRIPT }}" "${{ needs.evm-functional-tests.outputs.failed-tests }}"
                echo "------------------------------------"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
