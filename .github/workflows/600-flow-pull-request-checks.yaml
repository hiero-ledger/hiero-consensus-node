# SPDX-License-Identifier: Apache-2.0
name: "600: [FLOW] PR Checks"
# The event action (opened, synchronize, labeled, reopened) goes in the run title so it is queryable through the
# runs API (display_title). It shows which runs are re-triggers of a commit that already ran. See .github/ci-metrics.
run-name: "PR #${{ github.event.pull_request.number }} ${{ github.event.action }}: ${{ github.event.pull_request.title }}"
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  actions: read
  issues: write
  pull-requests: write
  statuses: write
  checks: write
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  detect-change-type:
    name: Detect Change Type
    runs-on: hl-cn-default-lin-sm
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      enable-tests: ${{ steps.classify.outputs.enable-tests }}
      workflow-files-changed: ${{ steps.classify.outputs.workflow-files-changed }}
      smart-contracts-changed: ${{ steps.classify.outputs.smart-contracts-changed }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: ${{ secrets.GITHUB_TOKEN }}
          checkout-fetch-depth: "0"

      - name: Classify Changed Files
        id: classify
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const script = require('.github/workflows/support/scripts/classify-changed-files.js');
            await script({github, context, core})

  extract-jdk-version:
    name: Extract Java Version
    uses: ./.github/workflows/854-call-extract-jdk-version.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  mats-pr-checks:
    name: MATS
    needs:
      - detect-change-type
      - extract-jdk-version
    uses: ./.github/workflows/800-call-mats-tests.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      enable-dependency-check: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-unit-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-integration-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-hapi-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-otter-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-falcon-tests: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-benchmark-smoke: ${{ needs.detect-change-type.outputs.enable-tests }}
      enable-evm-functional-tests: ${{ github.base_ref == github.event.repository.default_branch && needs.detect-change-type.outputs.smart-contracts-changed || 'false' }}
      citr-vars-ref: ${{ github.sha }}
      java-version: ${{ needs.extract-jdk-version.outputs.jdk-version }}
      java-distribution: "temurin"
      custom-job-label: "Standard"
    secrets:
      access-token: ${{ secrets.GITHUB_TOKEN }}
      codacy-project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
      gradle-cache-username: ${{ secrets.GRADLE_CACHE_USERNAME }}
      gradle-cache-password: ${{ secrets.GRADLE_CACHE_PASSWORD }}

  workflow-unit-tests:
    name: Workflow File Tests
    needs:
      - detect-change-type
    if: ${{ needs.detect-change-type.outputs.workflow-files-changed == 'true' }}
    uses: ./.github/workflows/857-call-workflow-unit-tests.yaml

  ci-complete:
    name: CI Complete
    runs-on: hl-cn-default-lin-sm
    needs:
      - detect-change-type
      - mats-pr-checks
      - workflow-unit-tests
    if: ${{ !cancelled() && always() }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Evaluate Results
        run: |
          echo "Docs-only: ${{ needs.detect-change-type.outputs.docs-only }}"
          echo "MATS result: ${{ needs.mats-pr-checks.result }}"

          if [[ "${{ needs.workflow-unit-tests.result }}" == "failure" ]]; then
            echo "Workflow file tests failed."
            exit 1
          fi

          if [[ "${{ needs.mats-pr-checks.result }}" == "success" ]]; then
            echo "All required checks passed."
            exit 0
          else
            echo "MATS checks did not succeed (result: ${{ needs.mats-pr-checks.result }})."
            exit 1
          fi

  report-summary:
    name: Report PR Check Summary
    runs-on: hl-cn-default-lin-sm
    needs:
      - detect-change-type
      - mats-pr-checks
      - workflow-unit-tests
    if: ${{ !cancelled() && always() }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: ${{ github.event.pull_request.head.sha }}
          checkout-token: ${{ secrets.GITHUB_TOKEN }}
          checkout-fetch-depth: "0"

      - name: Report Summary
        id: report-summary
        env:
          PRINT_FAILED_TESTS_SCRIPT: ".github/workflows/support/scripts/print-failed-tests.sh"
        run: |
          echo "::debug::Generating PR Check Summary"

          # Append summary to GitHub Step Summary
          {
            echo "## PR Check Summary"
            echo ""
            echo "### Run context"
            echo "- **Event action:** ${{ github.event.action }}"
            echo "- **Head commit:** ${{ github.event.pull_request.head.sha }}"
            echo "- **Docs only:** ${{ needs.detect-change-type.outputs.docs-only }}"
            echo "- **Tests enabled:** ${{ needs.detect-change-type.outputs.enable-tests }}"
            echo "- **Workflow files changed:** ${{ needs.detect-change-type.outputs.workflow-files-changed }}"
            echo "- **Smart contracts changed:** ${{ needs.detect-change-type.outputs.smart-contracts-changed }}"
            echo ""
            if [[ "${{ needs.detect-change-type.outputs.docs-only }}" == "true" ]]; then
              echo "> **Docs-only PR detected.** Unit, integration, HAPI, otter, determinism, and dependency checks were skipped. Build and Spotless still ran."
              echo ""
            fi
            echo "------------------------------------"
            echo "### Results"
            echo "- **MATS Tests:** ${{ needs.mats-pr-checks.result }}"
            echo "- **Workflow File Tests:** ${{ needs.workflow-unit-tests.result }}"
            echo "------------------------------------"
            if [[ "${{ needs.mats-pr-checks.result }}" == "failure" ]]; then
                echo "### MATS Test Failures"
                echo ""
                echo "- **Failure Mode:** ${{ needs.mats-pr-checks.outputs.failure-mode }}"
                echo "- **Failed Tests:**"
                bash "${{ github.workspace }}/${{ env.PRINT_FAILED_TESTS_SCRIPT }}" "${{ needs.mats-pr-checks.outputs.failed-tests }}"
                echo "------------------------------------"
            fi
            if [[ "${{ github.base_ref }}" != "${{ github.event.repository.default_branch }}" ]]; then
                echo "> **EVM Functional Tests not run.** MATS runs them only for PRs into \`${{ github.event.repository.default_branch }}\`."
                echo "------------------------------------"
            elif [[ "${{ needs.detect-change-type.outputs.smart-contracts-changed }}" != "true" ]]; then
                echo "> **EVM Functional Tests not run.** MATS runs them only for a non-documentation change under the smart-contract service modules or the \`Run EVM Tests\` label."
                echo "------------------------------------"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-run-metrics:
    # Writes this run's jobs, step timings and per-test timings to an artifact while all of that still exists
    # (the API drops step detail after ~18 days and JUnit reports after 7). ingest.py in .github/ci-metrics loads it
    # into a local SQLite database. Never gates the PR: nothing depends on it and it may fail without effect.
    name: Publish Run Metrics
    runs-on: hl-cn-default-lin-sm
    needs:
      - detect-change-type
      - mats-pr-checks
      - workflow-unit-tests
      - ci-complete
    if: ${{ !cancelled() && github.event.repository.visibility == 'public' && github.event.pull_request.head.repo.full_name == github.repository }}
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/ci-metrics
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Collect Run Metrics
        env:
          GH_TOKEN: ${{ github.token }}
          CTX_ACTION: ${{ github.event.action }}
          CTX_DOCS_ONLY: ${{ needs.detect-change-type.outputs.docs-only }}
          CTX_ENABLE_TESTS: ${{ needs.detect-change-type.outputs.enable-tests }}
          CTX_WORKFLOW_FILES_CHANGED: ${{ needs.detect-change-type.outputs.workflow-files-changed }}
          CTX_SMART_CONTRACTS_CHANGED: ${{ needs.detect-change-type.outputs.smart-contracts-changed }}
          CTX_FAILURE_MODE: ${{ needs.mats-pr-checks.outputs.failure-mode }}
        run: python3 -I .github/ci-metrics/run_metrics.py --out run-metrics.json

      - name: Upload Run Metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-metrics
          path: run-metrics.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
