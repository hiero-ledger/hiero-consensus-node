# SPDX-License-Identifier: Apache-2.0
name: "802: [CALL] Compile And Spotless"
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag or SHA to checkout."
        required: false
        type: string
        default: ""
      java-distribution:
        description: "Java JDK Distribution:"
        type: string
        required: false
        default: "temurin"
      java-version:
        description: "Java JDK Version:"
        type: string
        required: false
      node-version:
        description: "NodeJS Version:"
        type: string
        required: false
        default: "20"
    secrets:
      access-token:
        description: "The GitHub access token used to checkout the repository, submodules, and make GitHub API calls."
        required: true
      gcp-project-number:
        description: "GCP project for storing Gradle remote cache entries."
        required: true
    outputs:
      failure-mode:
        description: "Failure Mode"
        value: ${{ jobs.compile-and-spotless-check.outputs.failure-mode }}

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  actions: read
  pull-requests: write
  statuses: write
  checks: write
  contents: read

env:
  GCP_PROJECT_NUMBER: ${{ secrets.gcp-project-number }}
  GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew
  CG_EXEC: ionice -c 2 -n 2 nice -n 19

jobs:
  compile-and-spotless-check:
    name: "Compile and Spotless Check"
    runs-on: hl-cn-compile-app-lin
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref }}"
          checkout-fetch-depth: "0"
          checkout-token: "${{ secrets.access-token }}"
          setup-java: "true"
          java-version: "${{ inputs.java-version }}"
          java-distribution: "${{ inputs.java-distribution }}"
          setup-gradle: "true"
          setup-testlens: "true"
          gradle-cache-read-only: "false"
          setup-node: "true"
          node-version: "${{ inputs.node-version }}"

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: step-security/google-github-auth@40f6deebd366f16c782d7a0ad0844e3b96a032a6 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Compile Application Code
        id: compile-source
        run: ${GRADLE_EXEC} assemble :yahcli:yahCliJar

      - name: Spotless Check
        id: spotless-check
        if: ${{ steps.compile-source.outcome == 'success' }}
        run: ${GRADLE_EXEC} spotlessCheck

      - name: Set Failure Mode Output
        id: set-failure-mode
        if: ${{ always() }}
        env:
          INPUT_TEST_OUTCOMES: >-
            ${{ steps.compile-source.outcome }}
            ${{ steps.spotless-check.outcome }}
          INPUT_WORKFLOW_OUTCOMES: ${{ steps.prepare-runner.outcome }}
        run: bash .github/workflows/support/scripts/set-failure-mode.sh
