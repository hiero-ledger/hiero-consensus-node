# SPDX-License-Identifier: Apache-2.0
name: "301: [FLOW] Deploy Prod Release"
# The tag is in the run name so a dispatcher can find the run it started.
run-name: "301: [FLOW] Deploy Prod Release (${{ inputs.tag || github.ref_name }})"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-?*"
  # Builds and publishes an existing release tag: a re-run, or a release
  # dispatched by Chewie or hcn-release-automation rather than started by a tag push.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (vX.Y.Z, optionally with a suffix). It must already exist. Re-run only a release that failed before publishing: Maven Central refuses a version it already has."
        required: true
        type: string

# A dispatch and the tag push for the same tag must not build it at the same time.
concurrency:
  group: 301-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  prepare-tag-release:
    name: Prepare Release [Tag]
    runs-on: hl-cn-default-lin-sm
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          setup-semver: "true"

      # Both triggers build a commit, never a tag ref: 850 resolves a tag ref
      # with git ls-remote, which returns the tag object's SHA for an annotated
      # tag, so building the ref would give a dispatch a different commit-id,
      # artifact names and version from a push. A tag push builds the pushed
      # commit. A dispatch builds the commit of the named tag, which must
      # already exist, read from the remote and peeled through an annotated tag.
      - name: Resolve Release Tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSHED_TAG: ${{ github.ref_name }}
          PUSHED_SHA: ${{ github.sha }}
          REPO_URL: "https://github.com/${{ github.repository }}"
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
            # Anchored at both ends: git ls-remote treats its patterns as globs,
            # so a tag such as "v0.66.0*" would match several tags.
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error title=Invalid Release Tag::'${TAG}' is not a release tag (vX.Y.Z, optionally with a suffix)."
              exit 1
            fi
            REF_INFO="$(git ls-remote --tags "${REPO_URL}" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
            if [[ -z "${REF_INFO}" ]]; then
              echo "::error title=Release Tag Not Found::Tag '${TAG}' does not exist in ${REPO_URL}."
              exit 1
            fi
            COMMIT="$(awk '$2 ~ /\^\{\}$/ {print $1}' <<<"${REF_INFO}")"
            [[ -z "${COMMIT}" ]] && COMMIT="$(awk 'NR == 1 {print $1}' <<<"${REF_INFO}")"
          else
            TAG="${PUSHED_TAG}"
            COMMIT="${PUSHED_SHA}"
          fi

          {
            echo "tag=${TAG}"
            echo "commit=${COMMIT}"
          } >>"${GITHUB_OUTPUT}"

      - name: Extract Tag Version
        id: tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          RELEASE_VERSION="$(semver get release "${TAG}")"
          PRERELEASE_VERSION="$(semver get prerel "${TAG}")"

          FINAL_VERSION="${RELEASE_VERSION}"
          PRERELEASE_FLAG="false"
          [[ -n "${PRERELEASE_VERSION}" ]] && FINAL_VERSION="${RELEASE_VERSION}-${PRERELEASE_VERSION}"
          [[ -n "${PRERELEASE_VERSION}" ]] && PRERELEASE_FLAG="true"

          echo "version=${FINAL_VERSION}" >>"${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE_FLAG}" >>"${GITHUB_OUTPUT}"

  extract-jdk-version:
    name: Extract Java Version
    uses: ./.github/workflows/854-call-extract-jdk-version.yaml
    needs:
      - prepare-tag-release
    with:
      ref: ${{ needs.prepare-tag-release.outputs.commit }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  release-tag:
    name: Release [Tag]
    uses: ./.github/workflows/850-call-build-release-artifact.yaml
    needs:
      - extract-jdk-version
      - prepare-tag-release
    with:
      version-policy: specified
      new-version: ${{ needs.prepare-tag-release.outputs.version }}
      trigger-env-deploy: none
      release-profile: ${{ needs.prepare-tag-release.outputs.prerelease == 'true' && 'PrereleaseChannel' || 'MavenCentral' }}
      # Pre-release tags (rc, alpha, ...) are not published to Maven Central.
      publish-maven-central: ${{ needs.prepare-tag-release.outputs.prerelease != 'true' }}
      ref: ${{ needs.prepare-tag-release.outputs.commit }}
      ref-name: ${{ needs.prepare-tag-release.outputs.tag }}
      java-version: ${{ needs.extract-jdk-version.outputs.jdk-version }}
      java-distribution: "temurin"
    secrets:
      access-token: ${{ secrets.GITHUB_TOKEN }}
      bucket-name: ${{ secrets.RELEASE_ARTIFACT_BUCKET_NAME }}
      cdn-bucket-name: ${{ secrets.CDN_ARTIFACT_BUCKET_NAME }}
      central-publishing-username: ${{ secrets.CENTRAL_PUBLISHING_USERNAME }}
      central-publishing-password: ${{ secrets.CENTRAL_PUBLISHING_PASSWORD }}
      sdk-gpg-key-contents: ${{ secrets.PLATFORM_GPG_KEY_CONTENTS }}
      sdk-gpg-key-passphrase: ${{ secrets.PLATFORM_GPG_KEY_PASSPHRASE }}
      slack-webhook-url: ${{ secrets.SLACK_CITR_BUILD_PROMOTION_WEBHOOK }}
      jf-url: ${{ vars.JF_URL }}
      jf-docker-registry: ${{ vars.JF_DOCKER_REGISTRY }}
      jf-user-name: ${{ vars.JF_USER_NAME }}
      jf-access-token: ${{ secrets.JF_ACCESS_TOKEN }}

  update-hedera-protobufs:
    name: Update Hedera Protobufs
    runs-on: hl-cn-default-lin-sm
    needs:
      - prepare-tag-release
      - release-tag
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Hiero Consensus Node Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          ref: ${{ needs.prepare-tag-release.outputs.commit }}
          fetch-depth: "0"

      - name: Checkout Hedera Protobufs Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.PROTOBUFS_GH_ACCESS_TOKEN }}
          fetch-depth: "0"
          repository: hashgraph/hedera-protobufs
          path: hedera-protobufs

      - name: Install rsync
        run: sudo apt update && sudo apt -y install rsync

      - name: Update the folders owned by Services
        working-directory: hedera-protobufs
        run: |
          git push --delete origin v${{ needs.prepare-tag-release.outputs.version }} || true
          git tag --delete v${{ needs.prepare-tag-release.outputs.version }} || true
          rsync -a --delete ../hapi/hedera-protobuf-java-api/src/main/proto/services/ services/

      - name: Import GPG key for commit signoff
        id: gpg_import
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          gpg_private_key: ${{ secrets.PROTOBUFS_GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.PROTOBUFS_GPG_KEY_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Add & Commit
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          cwd: "hedera-protobufs"
          author_name: swirlds-eng-automation
          author_email: ${{ secrets.PROTOBUFS_GPG_USER_EMAIL }}
          commit: --signoff
          message: "ci: Copied recent protobuf changes from hedera-services"
          new_branch: "update-recent-protobuf-changes-${{ github.run_number }}"
          tag: 'v${{ needs.prepare-tag-release.outputs.version }} -s -m "Hedera Protobufs v${{ needs.prepare-tag-release.outputs.version }}" -u "${{ steps.gpg_import.outputs.keyid }}"'

  # Runs only when a job this workflow depends on failed. A job skipped because
  # an earlier one failed is covered by that earlier job's failure, so testing
  # for 'failure' rather than for '!= success' cannot fire on a successful run.
  report-failures:
    name: Report Production Release Failures
    runs-on: hl-cn-default-lin-sm
    needs:
      - extract-jdk-version
      - prepare-tag-release
      - release-tag
      - update-hedera-protobufs
    # A dispatch whose tag did not resolve is bad input, not a failed release:
    # the run already shows the error to whoever dispatched it, and with no
    # resolved commit the report would name an unrelated commit's author.
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') &&
      !(github.event_name == 'workflow_dispatch' && needs.prepare-tag-release.result == 'failure') }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ needs.prepare-tag-release.outputs.commit || github.sha }}"
          checkout-token: "${{ secrets.GH_ACCESS_TOKEN }}"
          checkout-fetch-depth: "0"
          setup-gomplate: "true"

      - name: Collect run logs in a log file
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: |
          for job_id in $(gh run view ${{ github.run_id }} --json jobs --jq '.jobs | map(.databaseId) | .[0:-1] | .[]'); do
            echo "Fetching logs for job $job_id..."

            current_job_name=$(gh run view ${{ github.run_id }} --json jobs | jq --argjson job_id "$job_id" -r '.jobs[] | select(.databaseId == $job_id) | .name')

            echo "Logs for job $current_job_name :" >> run.log

            gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/hiero-ledger/hiero-consensus-node/actions/jobs/$job_id/logs >> run.log
          done

      - name: Upload log as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true
        with:
          path: run.log

      - name: Get Commit Information
        id: fetch-commit-info
        continue-on-error: true
        env:
          REF: ${{ needs.prepare-tag-release.outputs.commit || github.sha }}
        run: |
          echo "commit-hash=${REF}" >> "${GITHUB_OUTPUT}"
          echo "commit-author=$(git show -s --format='%an <%ae>' ${REF})" >> "${GITHUB_OUTPUT}"
          echo "commit-email=$(git show -s --format='%ae' ${REF})" >> "${GITHUB_OUTPUT}"

      - name: Find Commit Author in Slack
        id: find-commit-author-slack
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_CITR_BOT_TOKEN }}
          EMAIL: ${{ steps.fetch-commit-info.outputs.commit-email }}
        run: |
          bash "${{ github.workspace }}/.github/workflows/support/scripts/find-commit-author-slack.sh"
          echo "slack-user-id=${SLACK_USER_ID}" >> "${GITHUB_OUTPUT}"

      - name: Build Rootly Summary
        id: rootly-summary
        env:
          REF: ${{ needs.prepare-tag-release.outputs.commit || github.sha }}
          TAG: ${{ needs.prepare-tag-release.outputs.tag || inputs.tag || github.ref_name }}
        run: |
          title="Deploy Production Release job failed (${TAG} - ${REF})."
          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          {
            echo 'summary<<EOF'
            echo "------------------------------------"
            echo "Status of each jobs:"
            echo "- Extract Java Version: ${{ needs.extract-jdk-version.result }}"
            echo "- Prepare Release [Tag]: ${{ needs.prepare-tag-release.result }}"
            echo "- Release [Tag]: ${{ needs.release-tag.result }}"
            echo "- Update Hedera Protobufs: ${{ needs.update-hedera-protobufs.result }}"
            echo "------------------------------------"
            echo "Commit information:"
            echo "- Author: ${{ steps.fetch-commit-info.outputs.commit-author }}"
            echo "- Commit: <${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.fetch-commit-info.outputs.commit-hash }}>"
            echo "- Workflow: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Log Rootly Summary
        run: |
          echo "## Rootly Summary:"
          echo "### Title: ${{ steps.rootly-summary.outputs.title }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "${{ steps.rootly-summary.outputs.summary }}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Create Rootly Alert
        id: create-rootly-alert
        uses: pandaswhocode/rootly-alert-action@25cfdb8b2c006c1b130c183c7b1cbcffafb71f39 # v1.0.10
        continue-on-error: true
        with:
          api_key: ${{ secrets.ROOTLY_API_TOKEN }}
          summary: "${{ steps.rootly-summary.outputs.title }}"
          details: "${{ steps.rootly-summary.outputs.summary }}"
          notification_target_type: "Service"
          notification_target: "CI/CD Workflows"
          set_as_noise: "false"
          alert_urgency: "High"
          external_id: ${{ github.run_id }}
          external_url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          environments: "CITR"

      - name: Build Slack Payload Message
        id: payload
        env:
          REPORT_TITLE: "Deploy Production Release"
          JOB_RESULTS: |-
            *Extract Java Version*: ${{ needs.extract-jdk-version.result }}
            *Prepare Release [Tag]*: ${{ needs.prepare-tag-release.result }}
            *Release [Tag]*: ${{ needs.release-tag.result }}
            *Update Hedera Protobufs*: ${{ needs.update-hedera-protobufs.result }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.fetch-commit-info.outputs.commit-hash }}
          COMMIT_AUTHOR: ${{ steps.fetch-commit-info.outputs.commit-author }}
          SLACK_USER_ID: ${{ steps.find-commit-author-slack.outputs.slack-user-id }}
          REF_NAME: ${{ needs.prepare-tag-release.outputs.tag || inputs.tag || github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gomplate -f .github/workflows/templates/slack-deploy-release-failure.json.tpl -o slack_payload.json

      - name: Report failure (slack citr-failures)
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_CITR_FAILURES_WEBHOOK }}
          webhook-type: incoming-webhook
          payload-templated: true
          payload-file-path: slack_payload.json
