# SPDX-License-Identifier: Apache-2.0
name: "837: [CALL] Exec HAPI Rec Crypto"
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag or SHA to checkout."
        required: false
        type: string
        default: ""
      java-distribution:
        description: "Java JDK Distribution:"
        required: false
        type: string
        default: "temurin"
      java-version:
        description: "Java JDK Version:"
        required: false
        type: string
      node-version:
        description: "NodeJS Version:"
        required: false
        type: string
        default: "24"
      enable-network-log-capture:
        description: "Network Log Capture Enabled"
        required: false
        type: string
        default: "false"
      hapi-test-config-profile:
        description: "Node config profile for the HAPI tasks (e.g. testnet); blank keeps the production defaults"
        required: false
        type: string
        default: ""
      name-suffix:
        description: "Suffix for the job, check and artifact names (keeps reruns apart from MATS)"
        required: false
        type: string
        default: ""
    secrets:
      access-token:
        description: "The GitHub access token used to checkout the repository, submodules, and make GitHub API calls."
        required: true
      gradle-cache-username:
        description: "The username used to authenticate with the Gradle Build Cache Node."
        required: true
      gradle-cache-password:
        description: "The password used to authenticate with the Gradle Build Cache Node."
        required: true
    outputs:
      failure-mode:
        description: "Indicates the failure mode of the job, if any."
        value: ${{ jobs.hapi-tests-misc-records-crypto-and-serial.outputs.failure-mode }}

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  actions: read
  pull-requests: write
  statuses: write
  checks: write
  contents: read

env:
  GRADLE_CACHE_USERNAME: ${{ secrets.gradle-cache-username }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.gradle-cache-password }}
  GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew
  CG_EXEC: ionice -c 2 -n 2 nice -n 19
  HAPI_TEST_CONFIG_PROFILE: ${{ inputs.hapi-test-config-profile }}

jobs:
  hapi-tests-misc-records-crypto-and-serial:
    name: "HAPI Tests (Misc Records, Crypto & Misc Serial)${{ inputs.name-suffix }}"
    runs-on: hl-cn-hapi-lin-lg
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    steps:
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref }}"
          checkout-fetch-depth: "1"
          checkout-token: "${{ secrets.access-token }}"
          setup-java: "true"
          java-version: "${{ inputs.java-version }}"
          java-distribution: "${{ inputs.java-distribution }}"
          setup-gradle: "true"
          setup-testlens: "true"
          gradle-cache-read-only: "false"
          setup-node: "true"
          node-version: "${{ inputs.node-version }}"

      - name: HAPI Testing (Misc Records, Crypto & Misc Serial)
        id: gradle-hapi-misc-records-crypto-and-serial
        env:
          LC_ALL: en.UTF-8
          LANG: en_US.UTF-8
        run: |
          status=0
          run_subtask() {
            local t=$1
            echo "::group::$t"
            if ${GRADLE_EXEC} "$t" --rerun --no-daemon; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            status=1
            echo "::error::$t failed"
            echo "❌ $t FAILED — expand group above for details"
          }
          # TEMP debug: measure CPU starvation when TransactionHandler stalls
          (
            set +e +o pipefail
            D=hedera-node/test-clients/build/hapi-test/hapiTestMiscRecords
            L=$D/node0/output/swirlds.log
            P() { echo "[probe $(date +%T)] $*"; }
            P "nproc=$(nproc) cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null)"
            n=0; i=0
            while [ $i -lt 2400 ]; do
              sleep 1; i=$((i+1))
              [ $((i % 15)) -eq 0 ] && P "load=$(cut -d' ' -f1-4 /proc/loadavg) psi_cpu=$(head -1 /proc/pressure/cpu 2>/dev/null)"
              c=$(grep -cE 'TransactionHandler.*unhealthy' $L 2>/dev/null); c=${c:-0}
              [ "$c" -gt "$n" ] || continue
              n=$c
              P "STALL #$n psi_cpu: $(tr '\n' ' ' < /proc/pressure/cpu) psi_mem: $(head -1 /proc/pressure/memory) psi_io: $(head -1 /proc/pressure/io)"
              ps -eo pid,pcpu,rss,etimes,args --sort=-pcpu | head -12 | cut -c1-180 | sed 's/^/[probe] ps /'
              : > /tmp/tids
              for p in $(pgrep -f ServicesMain); do
                "${JAVA_HOME}/bin/jcmd" "$p" Thread.print -l > "$D/node0/output/threaddump-$n-$p.txt" 2>&1
                t=$(grep -m1 '"<scheduler TransactionHandler>"' "$D/node0/output/threaddump-$n-$p.txt" | grep -oE '\[[0-9]+\]' | tr -d '[]')
                [ -n "$t" ] && echo "$p $t $(grep -A2 -m1 '"<scheduler TransactionHandler>"' "$D/node0/output/threaddump-$n-$p.txt" | tail -1 | sed -E 's/^\s+at //; s/\(.*//')" >> /tmp/tids
              done
              while read -r p t f; do echo "$p $t $(cat /proc/$p/task/$t/schedstat 2>/dev/null)"; done < /tmp/tids > /tmp/s1
              sleep 5
              while read -r p t f; do echo "$p $t $(cat /proc/$p/task/$t/schedstat 2>/dev/null)"; done < /tmp/tids > /tmp/s2
              # schedstat = ns on cpu, ns waiting in run queue, timeslices
              awk 'NR==FNR{c[$1]=$3; w[$1]=$4; next} {printf "[probe] node pid %s handle thread over 5s: on_cpu %d ms, runq_wait %d ms\n", $1, ($3-c[$1])/1e6, ($4-w[$1])/1e6}' /tmp/s1 /tmp/s2
              sed 's/^/[probe] top frame: /' /tmp/tids
            done
          ) &
          run_subtask hapiTestMiscRecords
          run_subtask hapiTestMiscRecordsSerial
          run_subtask hapiTestCrypto
          run_subtask hapiTestCryptoEmbedded
          run_subtask hapiTestCryptoSerial
          run_subtask hapiTestBlockHashingSha256
          run_subtask hapiTestMiscSerial
          exit $status

      - name: Publish HAPI Test (Misc Records, Crypto & Misc Serial) Reports
        uses: step-security/publish-unit-test-result-action@681100d67b09305624c089873f12c545ee7cbc24 # v2.23.0
        with:
          check_name: "Node: HAPI Test (Misc Records, Crypto & Misc Serial)${{ inputs.name-suffix }} Results"
          json_thousands_separator: ","
          junit_files: "**/test-clients/build/test-results/**/TEST-*.xml"
          comment_mode: errors # only comment if we could not find or parse the JUnit XML files

      - name: Upload HAPI Test (Misc Records, Crypto & Misc Serial) Report Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "HAPI Test (Misc Records, Crypto & Misc Serial)${{ inputs.name-suffix }} Reports"
          path: "**/test-clients/build/test-results/**/TEST-*.xml"
          retention-days: 7

      - name: Upload HAPI Test (Misc Records, Crypto & Misc Serial) Network Logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && inputs.enable-network-log-capture && steps.gradle-hapi-misc-records-crypto-and-serial.conclusion == 'failure' }}
        with:
          name: "HAPI Test (Misc Records, Crypto & Misc Serial)${{ inputs.name-suffix }} Network Logs"
          path: |
            hedera-node/test-clients/build/*-test/**/output/**
            hedera-node/test-clients/build/*-test/*.log
            hedera-node/test-clients/output/**
          retention-days: 7

      - name: Upload HAPI Test (Misc Records, Crypto & Misc Serial) Failure Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.gradle-hapi-misc-records-crypto-and-serial.conclusion == 'failure' }}
        with:
          name: "HAPI Test (Misc Records, Crypto & Misc Serial)${{ inputs.name-suffix }} Failure Artifacts"
          path: |
            hedera-node/test-clients/build/**/*.blk.gz
            hedera-node/test-clients/build/**/*.rcd.gz
            hedera-node/test-clients/build/**/*.pb
            hedera-node/test-clients/build/**/*.pces
            hedera-node/test-clients/build/*-test/**/output/**
            hedera-node/test-clients/build/*-test/**/*.log
            hedera-node/test-clients/output/**
          retention-days: 7

      - name: Set Failure Mode Output
        id: set-failure-mode
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.gradle-hapi-misc-records-crypto-and-serial.outcome || 'skipped' }}" == "success" \
             || "${{ steps.gradle-hapi-misc-records-crypto-and-serial.outcome || 'skipped' }}" == "skipped" ]]; then
            echo "failure-mode=none" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ steps.gradle-hapi-misc-records-crypto-and-serial.outcome || 'skipped' }}" == "failure" ]]; then
            echo "failure-mode=test" >> "${GITHUB_OUTPUT}"
          else
            echo "failure-mode=workflow" >> "${GITHUB_OUTPUT}"
          fi
