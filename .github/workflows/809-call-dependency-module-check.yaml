# SPDX-License-Identifier: Apache-2.0
name: "809: [CALL] Dependency Module Chk"
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag or SHA to checkout."
        required: false
        type: string
      java-distribution:
        description: "Java JDK Distribution:"
        type: string
        required: false
        default: "temurin"
      java-version:
        description: "Java JDK Version:"
        type: string
        required: false
      node-version:
        description: "NodeJS Version:"
        type: string
        required: false
        default: "24"
    secrets:
      access-token:
        description: "The GitHub access token used to checkout the repository, submodules, and make GitHub API calls."
        required: true
      gradle-cache-username:
        description: "The username used to authenticate with the Gradle Build Cache Node."
        required: true
      gradle-cache-password:
        description: "The password used to authenticate with the Gradle Build Cache Node."
        required: true
    outputs:
      failure-mode:
        description: "Failure Mode"
        value: ${{ jobs.dependency-module-check.outputs.failure-mode }}

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  actions: read
  pull-requests: write
  statuses: write
  checks: write
  contents: read

env:
  GRADLE_CACHE_USERNAME: ${{ secrets.gradle-cache-username }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.gradle-cache-password }}
  GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew
  CG_EXEC: ionice -c 2 -n 2 nice -n 19

jobs:
  dependency-module-check:
    name: "Dependency Module Check"
    runs-on: hl-cn-default-lin-md
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref }}"
          checkout-fetch-depth: "1"
          checkout-token: "${{ secrets.access-token }}"
          setup-java: "true"
          java-version: "${{ inputs.java-version }}"
          java-distribution: "${{ inputs.java-distribution }}"
          setup-gradle: "true"
          setup-testlens: "true"
          gradle-cache-read-only: "false"
          setup-node: "true"
          node-version: "${{ inputs.node-version }}"

      # BEGIN TEMPORARY: Checkout PBJ repository and publish to local Maven repository so
      # that the application code can compile against it.
      #
      # TODO: Remove these two steps before publishing to a public registry.
      # TODO: SEC-FIX-PBJ-INLINE-BUILDS
      - name: Checkout PBJ Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          token: ${{ secrets.access-token }}
          path: ${{ github.workspace }}/pbj-releases
          repository: hashgraph/pbj-releases
          ref: release/0.15
          fetch-depth: 0

      - name: Publish PBJ to Local Maven Repository
        id: publish-pbj
        env:
          PBJ_VERSION: 0.15.14
        working-directory: ${{ github.workspace }}/pbj-releases/pbj-core
        run: |
          echo "::group::Configure PBJ Version"
          ./gradlew clean versionAsSpecified -PnewVersion=${PBJ_VERSION}
          echo "::endgroup::"
          echo "::group::Publish PBJ to Local Maven Repository"
          ./gradlew assemble publishToMavenLocal
          echo "::endgroup::"
      # END TEMPORARY
      - name: Gradle Dependency Scopes Check
        id: check-dependency-scopes
        run: ${GRADLE_EXEC} checkAllModuleInfo checkVersionConsistency validatePomFiles

      - name: Set Failure Mode Output
        id: set-failure-mode
        if: ${{ always() }}
        env:
          INPUT_TEST_OUTCOMES: ${{ steps.check-dependency-scopes.outcome }}
          INPUT_WORKFLOW_OUTCOMES: ${{ steps.prepare-runner.outcome }}
        run: bash .github/workflows/support/scripts/set-failure-mode.sh
