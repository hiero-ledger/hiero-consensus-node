# TEMPORARY: reproduces the windows-2022 ':hapi:generatePbjSource' "'other' has different root" failure.
name: "ZZZ: [DEBUG] Windows PBJ Root"
on:
  push:
    branches: [debug-windows-pbj-root]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: "Debug (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Environment
        shell: bash
        run: |
          echo "Image: ${ImageOS:-?} ${ImageVersion:-?}"
          echo "workspace=$GITHUB_WORKSPACE"
          echo "TEMP=$TEMP RUNNER_TEMP=$RUNNER_TEMP"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-<unset>} HOME=$HOME USERPROFILE=$USERPROFILE"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Keep Gradle user home on the workspace drive
        shell: bash
        run: echo "GRADLE_USER_HOME=${RUNNER_TEMP%\\*}\\.gradle" >> "${GITHUB_ENV}"

      - name: Generate PBJ sources
        shell: bash
        run: ./gradlew :hapi:generatePbjSource --no-build-cache --stacktrace -I .github/workflows/support/pbj-debug.init.gradle
