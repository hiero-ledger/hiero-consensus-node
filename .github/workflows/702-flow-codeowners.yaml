# SPDX-License-Identifier: Apache-2.0
name: "702: [FLOW] Codeowners Plus"
on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

defaults:
  run:
    shell: bash

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codeowners-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codeowners:
    name: Codeowners Check
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Initialize Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          # codeowners-plus reads .codeowners from the base ref and diffs
          # base..head with local git, so both commits must be present,
          # which is why fetch-depth is 0 rather than the default shallow clone.
          checkout-ref: "${{ github.event.pull_request.head.sha }}"
          checkout-fetch-depth: "0"

      - name: Check Codeowner Approvals
        uses: PandasWhoCode/codeowners-plus@bd703939d2725406edf073b42706af7b23d94d53 # v1.0.0
        with:
          github-token: ${{ secrets.GH_AUTO_UNAPPROVE_TOKEN }}
          team-token: ${{ secrets.TEAM_MEMBERS_TOKEN }}
          pr: ${{ github.event.pull_request.number }}
          # Parse .codeowners with standard GitHub semantics (last-match-wins).
          # Without this input the file is read with the native per-directory
          # format, which resolves by longest match and yields different owners.
          github-codeowners-file: ".codeowners"
          verbose: "true"
