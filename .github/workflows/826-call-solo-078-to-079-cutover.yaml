# SPDX-License-Identifier: Apache-2.0
name: "826: [CALL] Solo 078-079 Cutover"
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag, or SHA to checkout. Determines both the local build and the scripts that drive the run."
        required: false
        type: string
      custom-job-name:
        description: "The custom job name to use for the job."
        required: false
        type: string
      solo-version:
        description: "The Solo version to install for this cutover (Block Node >= v0.41.0 requires Solo >= v0.84.0)."
        required: true
        type: string
      java-version:
        description: "Java JDK Version:"
        required: false
        type: string
      starting-tag:
        description: "Consensus-node release tag for the initial 0.78 network deploy. The 0.79 cutover always upgrades to the local build from the checked-out ref. Leave blank to default to v0.78.0-rc.5."
        required: false
        type: string
      block-node-ref:
        description: "hiero-block-node ref to checkout. Only used for the serverStatus/proto sources consumed by the grpcurl diagnostics; the deployed Block Node chart version is pinned inside the scenario script. Defaults to the tag matching that chart."
        required: false
        type: string
        default: "v0.41.0"
    outputs:
      failure-mode:
        description: "Failure Mode"
        value: ${{ jobs.solo-078-to-079-cutover.outputs.failure-mode }}

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

env:
  SOLO_CLUSTER_NAME: "cutover-078-to-079"
  SOLO_NAMESPACE: "solo"
  SOLO_DEPLOYMENT: "solo-deployment"
  SOLO_CLUSTER_SETUP_NAMESPACE: "solo-cluster"
  GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew

jobs:
  solo-078-to-079-cutover:
    name: ${{ inputs.custom-job-name || 'Solo 0.78 -> 0.79 BLOCKS Cutover' }}
    runs-on: hl-cn-rpc-relay-lin-lg
    timeout-minutes: 120
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref || '' }}"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          checkout-fetch-depth: "0"
          setup-java: "true"
          java-version: "${{ inputs.java-version }}"
          java-distribution: "temurin"
          setup-gradle: "true"
          gradle-cache-read-only: "false"
          setup-node: "true"
          node-version: "22"
          setup-go: "true"
          go-version: "1.26.4"

      - name: Checkout Block Node
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hiero-ledger/hiero-block-node
          ref: ${{ inputs.block-node-ref }}
          path: hiero-block-node
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install Solo
        env:
          SOLO_VERSION: ${{ inputs.solo-version }}
        run: |
          npm install -g "@hiero-ledger/solo@${SOLO_VERSION}"
          solo --version

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: kindest/node:v1.32.0
          version: v0.29.0
          kubectl_version: v1.32.2
          verbosity: 3
          wait: 120s

      - name: Install Helm v3.14.2
        run: |
          set -eo pipefail
          HELM_VERSION="v3.14.2"
          ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${ARCHIVE}" -o "${RUNNER_TEMP}/${ARCHIVE}"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm"
          export PATH="${RUNNER_TEMP}:${PATH}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm" version --short

      - name: Verify Solo Dependency Versions
        run: |
          set -eo pipefail
          helm version --short
          kind --version
          kubectl version --client=true

      - name: Install grpcurl
        run: |
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@v1.8.7
          grpcurl --version

      - name: Build Consensus Node Local Artifacts
        # The 0.79 cutover always upgrades to the local build, so a build is always required.
        run: ${GRADLE_EXEC} assemble

      - name: Run 0.78 -> 0.79 BLOCKS Cutover Scenario
        id: run-cutover
        env:
          DEPLOY_RELEASE_TAG: ${{ inputs.starting-tag || 'v0.78.0-rc.5' }}
        run: |
          set -eo pipefail
          SCRIPT_PATH="hedera-node/test-clients/scripts/solo/e2e-block-stream-cutover/solo-078-to-079-cutover.sh"
          chmod +x "${SCRIPT_PATH}"
          timeout --signal=SIGINT --kill-after=5m 100m \
            env \
              BLOCK_NODE_REPO_PATH="${GITHUB_WORKSPACE}/hiero-block-node" \
              DEPLOY_RELEASE_TAG="${DEPLOY_RELEASE_TAG}" \
            "${SCRIPT_PATH}" 2>&1 | tee "${RUNNER_TEMP}/078-to-079-cutover-script.log"

      - name: Collect Diagnostics On Failure
        if: ${{ !cancelled() && failure() }}
        run: |
          set +e
          OUT_DIR="${RUNNER_TEMP}/078-to-079-cutover-diagnostics"
          mkdir -p "${OUT_DIR}"

          kubectl get pods -A -o wide > "${OUT_DIR}/kubectl-pods.txt" 2>&1
          kubectl get svc -A > "${OUT_DIR}/kubectl-services.txt" 2>&1
          kubectl get events -A --sort-by=.lastTimestamp > "${OUT_DIR}/kubectl-events.txt" 2>&1
          # The block node is rolled mid-scenario (seed + `block node upgrade`), so a plain `logs`
          # returns nothing when the failure lands while the pod is still initializing. Capture the
          # previous container's logs and the pod description too, otherwise a block node rejection
          # (e.g. EndOfStream BAD_BLOCK_PROOF seen by the CN) cannot be attributed to a cause.
          kubectl -n "${SOLO_NAMESPACE}" logs "pod/block-node-1-0" --all-containers --tail=-1 \
            > "${OUT_DIR}/block-node-1-0.log" 2>&1
          kubectl -n "${SOLO_NAMESPACE}" logs "pod/block-node-1-0" --all-containers --previous --tail=-1 \
            > "${OUT_DIR}/block-node-1-0.previous.log" 2>&1
          kubectl -n "${SOLO_NAMESPACE}" describe pod "block-node-1-0" \
            > "${OUT_DIR}/block-node-1-0.describe.txt" 2>&1

          for node in node1 node2 node3 node4; do
            pod="network-${node}-0"
            kubectl -n "${SOLO_NAMESPACE}" logs "${pod}" -c root-container --tail=-1 > "${OUT_DIR}/${pod}-root-container.log" 2>&1
            kubectl -n "${SOLO_NAMESPACE}" exec "${pod}" -c root-container -- sh -lc \
              "cat /opt/hgcapp/services-hedera/HapiApp2.0/output/hgcaa.log" \
              > "${OUT_DIR}/${pod}-hgcaa.log" 2>&1
            kubectl -n "${SOLO_NAMESPACE}" exec "${pod}" -c root-container -- sh -lc \
              "cat /opt/hgcapp/services-hedera/HapiApp2.0/output/block-node-comms.log" \
              > "${OUT_DIR}/${pod}-block-node-comms.log" 2>&1
          done

          if [[ -d "${HOME}/.solo/logs" ]]; then
            mkdir -p "${OUT_DIR}/solo-logs"
            cp -R "${HOME}/.solo/logs/." "${OUT_DIR}/solo-logs/" || true
            # Strip ONLY the multi-GB WRAPS proving key (data/keys/wraps*) from the copied
            # per-node log-config bundles. Everything else — swirlds.log, hgcaa.log,
            # swirlds-hashstream, block-node-comms, configs — is retained for debugging;
            # the proving key is a reproducible ~4 GB download, not a log.
            find "${OUT_DIR}/solo-logs" -type f -name '*-log-config.zip' | while IFS= read -r z; do
              zip -d "${z}" 'data/keys/wraps*' 'data/keys/wraps-archive/*' >/dev/null 2>&1 || true
            done
          fi

      - name: Upload 078-to-079 Cutover Failure Artifacts
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: 078-to-079-Cutover-Failure-Artifacts
          path: |
            ${{ runner.temp }}/078-to-079-cutover-script.log
            ${{ runner.temp }}/078-to-079-cutover-diagnostics/**
            hedera-node/test-clients/scripts/solo/e2e-block-stream-cutover/generated/**
          if-no-files-found: warn
          retention-days: 7

      - name: Always Destroy Kind Cluster
        if: ${{ always() }}
        continue-on-error: true
        run: |
          kind delete cluster -n "${SOLO_CLUSTER_NAME}"

      - name: Set Failure Mode Output
        id: set-failure-mode
        if: ${{ always() }}
        env:
          INPUT_TEST_OUTCOMES: ${{ steps.run-cutover.outcome }}
          INPUT_WORKFLOW_OUTCOMES: ${{ steps.prepare-runner.outcome }}
        run: bash .github/workflows/support/scripts/set-failure-mode.sh
