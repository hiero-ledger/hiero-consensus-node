  set-failure-mode:
    name: Set Failure Mode
    runs-on: hl-cn-default-lin-sm
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    needs:
      - hapi-tests-restart-no-tss
      - hapi-tests-nd-reconnect-no-tss
      - hapi-tests-atomic-batch-serial-no-tss
      - hapi-tests-time-consuming-no-tss
    if: ${{ always() }}
    steps:
      - name: Set Failure Mode
        id: set-failure-mode
        run: |
          statuses=(
            "${{ needs.hapi-tests-restart-no-tss.result }}"
            "${{ needs.hapi-tests-nd-reconnect-no-tss.result }}"
            "${{ needs.hapi-tests-atomic-batch-serial-no-tss.result }}"
            "${{ needs.hapi-tests-time-consuming-no-tss.result }}"
          )
          mode="none"
          for s in "${statuses[@]}"; do
            [[ "$s" == "failure" ]] && mode="test" && break
          done
          echo "failure-mode=${mode}" >> "${GITHUB_OUTPUT}"
