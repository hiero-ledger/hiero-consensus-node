# SPDX-License-Identifier: Apache-2.0
# Runs one HAPI test suite: the caller names the suite and lists its Gradle tasks, and every suite
# shares the same steps
name: "874: [CALL] Exec HAPI Suite"
on:
  workflow_call:
    inputs:
      suite-name:
        description: "Suite name, shown in the job, check and artifact names (e.g. Misc)"
        required: true
        type: string
      gradle-tasks:
        description: "Whitespace-separated Gradle tasks to run, each in its own Gradle invocation"
        required: true
        type: string
      runner:
        description: "Runner label for the suite"
        required: false
        type: string
        default: "hl-cn-hapi-lin-lg"
      timeout-minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 360
      node-pool-mib:
        description: "Heap pool in MiB shared by the node JVMs (HAPI_TEST_NODE_POOL_MIB); blank lets test-clients size it from the runner"
        required: false
        type: string
        default: ""
      bn-release-version:
        description: "Block Node version used by the tests that start a real Block Node container (default: the version pinned in .citr-env)"
        required: false
        type: string
        default: ""
      ref:
        description: "The branch, tag or SHA to checkout."
        required: false
        type: string
        default: ""
      java-distribution:
        description: "Java JDK Distribution:"
        required: false
        type: string
        default: "temurin"
      java-version:
        description: "Java JDK Version:"
        required: false
        type: string
      node-version:
        description: "NodeJS Version:"
        required: false
        type: string
        default: "24"
      enable-network-log-capture:
        description: "Network Log Capture Enabled"
        required: false
        type: string
        default: "false"
      hapi-test-config-profile:
        description: "Node config profile for the HAPI tasks (e.g. pre-cutover); blank keeps the production defaults"
        required: false
        type: string
        default: ""
      name-suffix:
        description: "Suffix for the job, check and artifact names (keeps reruns apart from MATS)"
        required: false
        type: string
        default: ""
      artifact-suffix:
        description: "Suffix for the check and artifact names only, so parallel runs stay unique (letters, digits, '.', '_', '-')"
        required: false
        type: string
        default: ""
    secrets:
      access-token:
        description: "The GitHub access token used to checkout the repository, submodules, and make GitHub API calls."
        required: true
      gradle-cache-username:
        description: "The username used to authenticate with the Gradle Build Cache Node."
        required: true
      gradle-cache-password:
        description: "The password used to authenticate with the Gradle Build Cache Node."
        required: true
    outputs:
      failure-mode:
        description: "Indicates the failure mode of the job, if any."
        value: ${{ jobs.hapi-tests.outputs.failure-mode }}

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  actions: read
  pull-requests: write
  statuses: write
  checks: write
  contents: read

env:
  GRADLE_CACHE_USERNAME: ${{ secrets.gradle-cache-username }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.gradle-cache-password }}
  GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew
  CG_EXEC: ionice -c 2 -n 2 nice -n 19
  HAPI_TEST_CONFIG_PROFILE: ${{ inputs.hapi-test-config-profile }}
  SUITE_LABEL: "(${{ inputs.suite-name }})${{ inputs.name-suffix }}"
  ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix && format(' {0}', inputs.artifact-suffix) || '' }}

jobs:
  hapi-tests:
    name: "HAPI Tests (${{ inputs.suite-name }})${{ inputs.name-suffix }}"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    steps:
      - name: Prepare Runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref }}"
          checkout-fetch-depth: "1"
          checkout-token: "${{ secrets.access-token }}"
          setup-java: "true"
          java-version: "${{ inputs.java-version }}"
          java-distribution: "${{ inputs.java-distribution }}"
          setup-gradle: "true"
          setup-testlens: "true"
          gradle-cache-read-only: "false"
          setup-node: "true"
          node-version: "${{ inputs.node-version }}"

      - name: HAPI Testing (${{ inputs.suite-name }})
        id: gradle-hapi
        env:
          LC_ALL: en.UTF-8
          LANG: en_US.UTF-8
          GRADLE_TASKS: ${{ inputs.gradle-tasks }}
          # Blank values fall back to the test-clients defaults
          HAPI_TEST_NODE_POOL_MIB: ${{ inputs.node-pool-mib }}
          BLOCK_NODE_VERSION: ${{ inputs.bn-release-version }}
        # Run each task in isolation with clean builds because we dynamically reconfigure Log4j for each mode
        run: |
          read -r -d '' -a tasks <<< "${GRADLE_TASKS}" || true
          if [[ "${#tasks[@]}" -eq 0 ]]; then
            echo "::error::No Gradle tasks given for HAPI Tests ${SUITE_LABEL}"
            exit 1
          fi

          status=0
          run_subtask() {
            local t=$1
            echo "::group::$t"
            if ${GRADLE_EXEC} "$t" --no-daemon; then
              echo "::endgroup::"
              return 0
            fi
            echo "::endgroup::"
            status=1
            echo "::error::$t failed"
            echo "❌ $t FAILED — expand group above for details"
          }
          for t in "${tasks[@]}"; do
            run_subtask "${t}"
          done
          exit $status

      # BlockNodeContainer caches the plugin jars it needs under .../block-node/<version>/; a ref without the
      # BLOCK_NODE_VERSION override caches them for its pinned version instead, so a missing directory means the
      # suite did not test the requested Block Node version. The one optional step: it only applies when a caller
      # requests a Block Node version.
      - name: Verify Requested Block Node Version Was Used
        if: ${{ !cancelled() && inputs.bn-release-version != '' }}
        env:
          BN_VERSION: ${{ inputs.bn-release-version }}
        run: |
          version="${BN_VERSION#v}"
          if ! find hedera-node/test-clients/build -type d -path "*/block-node/${version}" | grep -q .; then
            echo "::error::No Block Node ${version} data found; the tests did not run the requested Block Node version"
            find hedera-node/test-clients/build -type d -path "*/block-node/*" -maxdepth 4 || true
            exit 1
          fi

      - name: Publish HAPI Test ${{ env.SUITE_LABEL }} Reports
        uses: step-security/publish-unit-test-result-action@8cf946dca1a299ebf36dff640273fda13717050a # v2.24.0
        with:
          check_name: "Node: HAPI Test ${{ env.SUITE_LABEL }} Results${{ env.ARTIFACT_SUFFIX }}"
          json_thousands_separator: ","
          junit_files: |
            **/test-clients/build/test-results/**/TEST-*.xml
            **/yahcli/build/test-results/**/TEST-*.xml
          comment_mode: errors # only comment if we could not find or parse the JUnit XML files

      - name: Upload HAPI Test ${{ env.SUITE_LABEL }} Report Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "HAPI Test ${{ env.SUITE_LABEL }} Reports${{ env.ARTIFACT_SUFFIX }}"
          path: |
            **/test-clients/build/test-results/**/TEST-*.xml
            **/yahcli/build/test-results/**/TEST-*.xml
          retention-days: 7

      # The @Tag(MULTINETWORK) CLPR suites run under testSubprocess, so their node + test-client
      # logs live under hedera-node/test-clients/build, including the multinetwork-test-clients dir.
      - name: Upload HAPI Test ${{ env.SUITE_LABEL }} Network Logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && inputs.enable-network-log-capture == 'true' && steps.gradle-hapi.conclusion == 'failure' }}
        with:
          name: "HAPI Test ${{ env.SUITE_LABEL }} Network Logs${{ env.ARTIFACT_SUFFIX }}"
          path: |
            hedera-node/test-clients/build/*-test/**/output/**
            hedera-node/test-clients/build/*-test/*.log
            hedera-node/test-clients/build/multinetwork-test-clients/**
            hedera-node/test-clients/output/**
            hedera-node/yahcli/build/hapi-test/**/output/**
            hedera-node/yahcli/build/hapi-test/**/*.log
          retention-days: 7

      - name: Upload HAPI Test ${{ env.SUITE_LABEL }} Failure Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && steps.gradle-hapi.conclusion == 'failure' }}
        with:
          name: "HAPI Test ${{ env.SUITE_LABEL }} Failure Artifacts${{ env.ARTIFACT_SUFFIX }}"
          path: |
            hedera-node/test-clients/build/**/*.blk.gz
            hedera-node/test-clients/build/**/*.rcd.gz
            hedera-node/test-clients/build/**/*.pb
            hedera-node/test-clients/build/**/*.pces
            hedera-node/test-clients/build/*-test/**/output/**
            hedera-node/test-clients/build/*-test/**/*.log
            hedera-node/test-clients/output/**
            hedera-node/yahcli/build/**/*.blk.gz
            hedera-node/yahcli/build/**/*.rcd.gz
            hedera-node/yahcli/build/**/*.pb
            hedera-node/yahcli/build/**/*.pces
            hedera-node/yahcli/build/reports/tests/testSubprocess/**
            hedera-node/yahcli/build/hapi-test/**/output/**
            hedera-node/yahcli/build/hapi-test/**/*.log
          retention-days: 7

      - name: Set Failure Mode Output
        id: set-failure-mode
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.gradle-hapi.outcome || 'skipped' }}" == "success" \
             || "${{ steps.gradle-hapi.outcome || 'skipped' }}" == "skipped" ]]; then
            echo "failure-mode=none" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ steps.gradle-hapi.outcome || 'skipped' }}" == "failure" ]]; then
            echo "failure-mode=test" >> "${GITHUB_OUTPUT}"
          else
            echo "failure-mode=workflow" >> "${GITHUB_OUTPUT}"
          fi
