// Temporary debug aid: print the PBJ source roots so we can see which one is on a different drive.
gradle.lifecycle.beforeProject { p ->
    if (p.path == ':hapi') {
        p.afterEvaluate {
            p.tasks.matching { it.name == 'generatePbjSource' }.configureEach { t ->
                t.doFirst {
                    println "PBJDEBUG project dir: ${p.projectDir}"
                    println "PBJDEBUG build dir: ${p.layout.buildDirectory.get().asFile}"
                    p.sourceSets.main.extensions.getByName('pbj').srcDirs.each { println "PBJDEBUG srcDir: ${it}" }
                    t.inputs.files.files.take(10).each { println "PBJDEBUG input: ${it}" }
                }
            }
        }
    }
}
