# SPDX-License-Identifier: Apache-2.0
replicas: 1

resources:
  limits:
    cpu: 10
    memory: 40Gi
  requests:
    cpu: 10
    memory: 40Gi

nodeSelector:
  chewie-group: aux

loadGenerator:
  java:
    maxMemory: "30g"
  test:
    className: com.hedera.benchmark.NftTransferLoadTest
    args:
      - -c
      - "32"
      - -a
      - "1000"
      - -T
      - "10"
      - -n
      - "100"
      - -S
      - "hot"
      - -p
      - "50"
      - -t
      - "1m"
  properties:
    - 'x.y.z.1\:50211=0.0.3'
