# SPDX-License-Identifier: Apache-2.0
name: "858: [CALL] Solo SHA-256 Roster Rekey"
on:
  workflow_call:
    inputs:
      ref:
        description: "The branch, tag, or SHA to checkout."
        required: false
        type: string
      custom-job-name:
        description: "The custom job name to use for the job."
        required: false
        type: string
      solo-version:
        description: "The Solo version to install."
        required: true
        type: string
      java-version:
        description: "Java JDK Version."
        required: false
        type: string
      starting-tag:
        description: "Published CN tag for the v0.78 baseline. Leave blank to use the local build."
        required: false
        type: string
    outputs:
      failure-mode:
        description: "Failure Mode"
        value: ${{ jobs.solo-sha256-roster-rekey.outputs.failure-mode }}

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

env:
  SOLO_CLUSTER_NAME: "sha256-roster-rekey"
  SOLO_NAMESPACE: "solo"
  SOLO_DEPLOYMENT: "solo-sha256-roster-rekey"
  SOLO_CLUSTER_SETUP_NAMESPACE: "solo-cluster"
  GRADLE_EXEC: ionice -c 2 -n 2 nice -n 19 ./gradlew

jobs:
  solo-sha256-roster-rekey:
    name: ${{ inputs.custom-job-name || 'Solo SHA-256 Roster Rekey' }}
    runs-on: hl-cn-rpc-relay-lin-lg
    timeout-minutes: 120
    outputs:
      failure-mode: ${{ steps.set-failure-mode.outputs.failure-mode }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ inputs.ref || '' }}"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          checkout-fetch-depth: "0"
          setup-java: "true"
          java-version: "${{ inputs.java-version }}"
          java-distribution: "temurin"
          setup-gradle: "true"
          gradle-cache-read-only: "false"
          setup-node: "true"
          node-version: "24"

      - name: Install Solo
        env:
          SOLO_VERSION: ${{ inputs.solo-version }}
        run: |
          npm install -g "@hiero-ledger/solo@${SOLO_VERSION}"
          solo --version

      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: kindest/node:v1.32.0
          version: v0.29.0
          kubectl_version: v1.32.2
          verbosity: 3
          wait: 120s

      - name: Install Helm v3.14.2
        run: |
          set -eo pipefail
          HELM_VERSION="v3.14.2"
          ARCHIVE="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://get.helm.sh/${ARCHIVE}" -o "${RUNNER_TEMP}/${ARCHIVE}"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}"
          install "${RUNNER_TEMP}/linux-amd64/helm" "${RUNNER_TEMP}/helm"
          export PATH="${RUNNER_TEMP}:${PATH}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/helm" version --short

      - name: Verify Tool Versions
        run: |
          set -eo pipefail
          helm version --short
          kind --version
          kubectl version --client=true

      - name: Build Consensus Node Local Artifacts
        run: ${GRADLE_EXEC} assemble

      - name: Run SHA-256 Roster Rekey Scenario
        id: run-scenario
        env:
          DEPLOY_RELEASE_TAG: ${{ inputs.starting-tag || '' }}
        run: |
          set -eo pipefail
          SCRIPT_PATH="hedera-node/test-clients/scripts/solo/sha256-roster-rekey/solo-078-to-079-sha256-roster-rekey.sh"
          chmod +x "${SCRIPT_PATH}"
          timeout --signal=SIGINT --kill-after=5m 100m \
            "${SCRIPT_PATH}" 2>&1 | tee "${RUNNER_TEMP}/sha256-roster-rekey-script.log"

      - name: Collect Diagnostics On Failure
        if: ${{ !cancelled() && failure() }}
        run: |
          set +e
          OUT_DIR="${RUNNER_TEMP}/sha256-roster-rekey-diagnostics"
          mkdir -p "${OUT_DIR}"

          kubectl get pods -A -o wide > "${OUT_DIR}/kubectl-pods.txt" 2>&1
          kubectl get svc -A > "${OUT_DIR}/kubectl-services.txt" 2>&1
          kubectl get events -A --sort-by=.lastTimestamp > "${OUT_DIR}/kubectl-events.txt" 2>&1

          for node in node1 node2 node3; do
            pod="network-${node}-0"
            kubectl -n "${SOLO_NAMESPACE}" logs "${pod}" -c root-container --tail=-1 \
              > "${OUT_DIR}/${pod}-root-container.log" 2>&1
            kubectl -n "${SOLO_NAMESPACE}" exec "${pod}" -c root-container -- sh -lc \
              "cat /opt/hgcapp/services-hedera/HapiApp2.0/output/hgcaa.log" \
              > "${OUT_DIR}/${pod}-hgcaa.log" 2>&1
            kubectl -n "${SOLO_NAMESPACE}" exec "${pod}" -c root-container -- sh -lc \
              "cat /opt/hgcapp/services-hedera/HapiApp2.0/output/swirlds.log" \
              > "${OUT_DIR}/${pod}-swirlds.log" 2>&1
          done

          if [[ -d "${HOME}/.solo/logs" ]]; then
            cp -R "${HOME}/.solo/logs/." "${OUT_DIR}/solo-logs/" || true
          fi

      - name: Upload Failure Artifacts
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SHA-256-Roster-Rekey-Failure-Artifacts
          path: |
            ${{ runner.temp }}/sha256-roster-rekey-script.log
            ${{ runner.temp }}/sha256-roster-rekey-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      - name: Always Destroy Kind Cluster
        if: ${{ always() }}
        continue-on-error: true
        run: kind delete cluster -n "${SOLO_CLUSTER_NAME}"

      - name: Set Failure Mode Output
        id: set-failure-mode
        if: ${{ always() }}
        env:
          INPUT_TEST_OUTCOMES: ${{ steps.run-scenario.outcome }}
          INPUT_WORKFLOW_OUTCOMES: ${{ steps.prepare-runner.outcome }}
        run: bash .github/workflows/support/scripts/set-failure-mode.sh
