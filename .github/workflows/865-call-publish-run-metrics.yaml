# SPDX-License-Identifier: Apache-2.0
name: "865: [CALL] Publish Run Metrics"
# Last job of a workflow run: writes the run's jobs, step timings, trigger context and per-test timings to one artifact,
# `run-metrics`, while all of that still exists (the API drops step detail after ~18 days and the JUnit reports are kept
# for 7). The caller adds every other job of its run to `needs`, so this one starts last, and calls it with
# `if: always()` so that cancelled runs are recorded too. A failure here never fails the calling run.
# See .github/workflows/docs/ci-metrics.md.
on:
  workflow_call:
    inputs:
      context:
        description: "JSON object of string values recorded with the run (event action, change-type outputs and the like)"
        type: string
        required: false
        default: "{}"

defaults:
  run:
    shell: bash

permissions:
  contents: read
  actions: read

jobs:
  publish-run-metrics:
    name: Publish Run Metrics
    runs-on: hl-cn-default-lin-sm
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/workflows/support/scripts/ci-metrics
          persist-credentials: false

      # The runner image's Python: on the hl-cn runners, setup-python installs a build that needs a newer glibc than
      # the image has (same pattern as 007, 822, 823 and 905)
      - name: Install Python
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3

      - name: Collect Run Metrics
        env:
          GH_TOKEN: ${{ github.token }}
          CTX_JSON: ${{ inputs.context }}
        run: python3 -I .github/workflows/support/scripts/ci-metrics/run_metrics.py --out run-metrics.json

      - name: Upload Run Metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: run-metrics
          path: run-metrics.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
