# SPDX-License-Identifier: Apache-2.0
name: "831: [CALL] CITR Exec SDPT"

on:
  workflow_call:
    inputs:
      ref:
        required: true
        default: "main"
        description: "Version of hiero-consensus-node: branch, tag, commit"
        type: string
      solo-version:
        required: true
        default: "v0.84.1"
        description: "Solo Version:"
        type: string
      nlg-accounts: #'-R -c 32 -a 100000000 -T 1000 -n 100000 -S hot -p 50 -tt 1m
        required: true
        default: "100000"
        description: "Number of Accounts and NFT tokens (100000, 1000000, 20000000, 100000000, 500000000, 1000000000)"
        type: string
      nlg-time: #'-R -c 32 -a 100000000 -T 1000 -n 100000 -S hot -p 50 -tt 1m
        required: true
        default: "3"
        description: "Test execution time, mins (3, 9, 21, 180, 330)"
        type: string
      add-app-props:
        required: false
        default: ""
        type: string
        description: 'Add props to application.properties, e.g. "blockStream.streamMode=RECORDS". Newline is "\n"'
      add-settings:
        required: false
        default: ""
        type: string
        description: 'Add props to settings.txt, e.g. "state.saveStatePeriod, 300". Newline is "\n"'
      crypto-bench-merkle-db-java-args:
        required: true
        default: "-XX:+UseZGC -XX:+ZGenerational -XX:ZAllocationSpikeTolerance=2 -XX:ConcGCThreads=14 -XX:ZMarkStackSpaceLimit=12g -XX:MaxDirectMemorySize=24g -Xmx90g"
        description: "JMH javaargs"
        type: string
      crypto-bench-merkle-db-test-params:
        required: true
        default: "-p maxKey=500000000 -p numRecords=100000 -p keySize=24 -p recordSize=1024 -p numFiles=6000"
        description: "Test params"
        type: string
      duration-minutes:
        required: true
        description: "Expected duration of all tests in minutes"
        type: number
      bnref:
        description: "BN version"
        type: string
        required: true
        default: ""
      nlg-version:
        required: true
        default: "0.14.3"
        description: "NLG Version:"
        type: string
      chewie-request-timeout:
        required: true
        description: "Chewie request timeout in seconds"
        type: number
      java-version:
        description: "Java JDK Version:"
        type: string
    secrets:
      slack-report-webhook:
        required: true
        description: "Slack webhook for SDPT outputs notifications"
      github-token:
        required: true
        description: "GitHub Authorization Token for the workflow"
      chewie-host:
        required: true
        description: "Chewie Host"
      chewie-id-key:
        required: true
        description: "Chewie Identity Key"
    outputs:
      result:
        description: "Result of the SDPT Run"
        value: ${{ jobs.single-day-performance-test-result.outputs.result }}

permissions:
  contents: write
  id-token: write
  actions: write

env:
  TIMEOUT_6H_LIMIT: 340
  GS_ROOT_DIR: gs://performance-engineering-reports/ephemeral/test_runs
  GS_ROOT_HTTPS: https://perf.analytics.eng.hashgraph.io/ephemeral/test_runs
  GRAFANA_SYSADM_DAL: https://grafana.lat.ope.eng.hashgraph.io/d/rYdddlPWk/node-exporter-single-node?orgId=1&timezone=utc&var-datasource=P5C24830FD6F1746E&var-job=performance-dallas-node-exporter
  GRAFANA_SYSADM_CHI: https://grafana.lat.ope.eng.hashgraph.io/d/rYdddlPWk/node-exporter-single-node?orgId=1&timezone=utc&var-datasource=P631E2BA859A814B3&var-job=performance-chicago-node-exporter
  NUM_OF_BLOCK_NODES: 3
  #Thresholds for performance
  #benchmarks
  #CryptoTransfer   HCS   NftTransfer SmartContract HeliSwap CryptoBenchMerkleDb
  #         25000 31000         13249          7192     1337               115000
  #-15%
  #         21250 26350         11261          6113     1136                97750
  MinNFTscore: 11261
  MinMerkleDBscore: 97750
  MinHCSLoadTest: 26350
  MinCryptoTransferLoadTest: 21250
  MinHeliSwapLoadTest: 1136
  MinSmartContractLoadTest: 6113
  ValidatorExitCode: 0

jobs:
  get-chewie-jwt:
    uses: ./.github/workflows/858-call-get-chewie-jwt.yaml
    secrets:
      chewie-key: ${{ secrets.chewie-id-key }}
      chewie-host: ${{ secrets.chewie-host }}

  get-sdpt-config:
    uses: ./.github/workflows/861-call-get-test-config.yaml
    with:
      test-type: "sdpt"
      ref: ${{ github.ref }}
    secrets:
      checkout-token: ${{ secrets.github-token }}

  validate-chewie-jwt:
    needs: get-chewie-jwt
    uses: ./.github/workflows/860-call-validate-chewie-jwt.yaml
    with:
      ref: ${{ github.ref }}
      chewie-expiration: ${{ needs.get-chewie-jwt.outputs.expiration }}
    secrets:
      chewie-jwt: ${{ needs.get-chewie-jwt.outputs.jwt }}
      checkout-token: ${{ secrets.github-token }}

  acquire-kubernetes-resources:
    needs:
      - validate-chewie-jwt
      - get-chewie-jwt
      - get-sdpt-config
    uses: ./.github/workflows/859-call-create-chewie-request.yaml
    with:
      instances-cn-qty: ${{ fromJSON(needs.get-sdpt-config.outputs.cn-qty) }}
      instances-cn-cpu: ${{ fromJSON(needs.get-sdpt-config.outputs.cn-cpu-request) }}
      instances-cn-memory-mb: ${{ fromJSON(needs.get-sdpt-config.outputs.cn-mem-request-mb) }}
      instances-aux-qty: ${{ fromJSON(needs.get-sdpt-config.outputs.aux-qty) }}
      instances-aux-cpu: ${{ fromJSON(needs.get-sdpt-config.outputs.aux-cpu-request) }}
      instances-aux-memory-mb: ${{ fromJSON(needs.get-sdpt-config.outputs.aux-mem-request-mb) }}
      duration-minutes: ${{ inputs.duration-minutes }}
      request-timeout: ${{ inputs.chewie-request-timeout }}
    secrets:
      github-token: ${{ secrets.github-token }}
      chewie-token: ${{ needs.get-chewie-jwt.outputs.jwt }}
      chewie-host: ${{ secrets.chewie-host }}

  print-allocation-details:
    runs-on: hl-cn-default-lin-sm
    needs:
      - acquire-kubernetes-resources
    if: ${{ !cancelled() && needs.acquire-kubernetes-resources.result == 'success' }}
    steps:
      - name: Harden Runner
        id: harden-runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Output Allocation Details
        run: |
          echo "::group::Output Step Summary"
          echo "## Allocation Details" > "${GITHUB_STEP_SUMMARY}"
          echo "- **Namespace**: ${{ needs.acquire-kubernetes-resources.outputs.namespace }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **FQDN**: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}" | tee -a  "${GITHUB_STEP_SUMMARY}"
          echo "- **CN Quantity**: ${{ needs.acquire-kubernetes-resources.outputs.cn-quantity }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Aux Node Quantity**: ${{ needs.acquire-kubernetes-resources.outputs.aux-quantity }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Network ID**: ${{ needs.acquire-kubernetes-resources.outputs.network-id }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Owner**: ${{ needs.acquire-kubernetes-resources.outputs.owner }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "- **Request Expiration (UTC)**: ${{ needs.acquire-kubernetes-resources.outputs.request-expiration }}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "::endgroup::"

  performance-tests-start:
    name: Start
    runs-on: hl-cn-sdpt-lin-lg
    if: ${{ !cancelled() && needs.acquire-kubernetes-resources.result == 'success' }}
    needs:
      - acquire-kubernetes-resources
    env:
      run_NLG_Test: NftTransferLoadTest
    outputs:
      run-hcn-version: ${{ steps.set-hcn-version.outputs.run-hcn-version }}
      commit-sha: ${{ steps.hederahash.outputs.sha }}
      grafana-url: ${{ steps.set-k8s-cluster.outputs.grafana-url }}
    steps:
      - name: Prepare Runner
        id: prepare-runner
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-ref: "${{ github.ref }}"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout target CN Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: target_consensus_node
          ref: ${{ inputs.ref }}

      - name: Checkout target BN Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "hiero-ledger/hiero-block-node"
          path: target_block_node
          ref: ${{ inputs.bnref }}

      - name: Set Kubernetes Cluster
        id: set-k8s-cluster
        run: |
          K8S_CLUSTER="${{ needs.acquire-kubernetes-resources.outputs.fqdn }}"
          grafana_url="${{ env.GRAFANA_SYSADM_DAL }}"
          if [[ "${{ needs.acquire-kubernetes-resources.outputs.fqdn }}" =~ [.]chi[.] ]]; then
            grafana_url="${{ env.GRAFANA_SYSADM_CHI }}"
          fi
          echo "kubernetes-cluster=${K8S_CLUSTER}" >> "${GITHUB_OUTPUT}"
          echo "kubernetes-cluster=${K8S_CLUSTER}" >> "${GITHUB_STEP_SUMMARY}"
          echo "grafana-url=${grafana_url}" >> "${GITHUB_OUTPUT}"

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.35.0

      - name: kubectl wrapper
        run: |
          kubectl=$(which kubectl)
          sudo mv ${kubectl} ${kubectl}.orig
          sudo cp "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt ${kubectl}
          sudo chmod a+rx ${kubectl}
          which kubectl

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: ${{ steps.set-k8s-cluster.outputs.kubernetes-cluster }}
          certificate-ttl: 168h

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: step-security/google-github-auth@40f6deebd366f16c782d7a0ad0844e3b96a032a6 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Helm
        shell: bash
        run: |
          sudo ln -s $(find /home/runner/_work/_tool/helm/ -type f -path '*/linux-amd64/*' -name 'helm') /usr/bin/helm
          which helm
          helm version

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "${{ inputs.java-version }}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          gradle-version: wrapper

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.39.2

      - name: OS check procedure
        id: setup
        shell: bash
        run: |
          set +x
          set +e
          export TERM=vt100
          echo Setup procedure ...
          cat /etc/*elease
          sudo apt-get update
          sudo apt-get install -qq -y net-tools iputils-ping node-typescript coreutils jq xxd openssl

      - name: Create report dir
        shell: bash
        run: |
          mkdir "${{ github.workspace }}"/report

      - name: Set CN Version
        id: set-hcn-version
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set +x
          set +e
          # trim the input ref
          echo "run-hcn-version=$(echo "${INPUT_REF}" | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Print parameters
        run: |
          echo "inputs.ref=${{ steps.set-hcn-version.outputs.run-hcn-version }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "Network-ID=${{ needs.acquire-kubernetes-resources.outputs.network-id }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "Owner=${{ needs.acquire-kubernetes-resources.outputs.owner }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.solo-version=${{ inputs.solo-version }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.nlg-accounts=${{ inputs.nlg-accounts }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.nlg-time=${{ inputs.nlg-time }}m" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.add-app-props=${{ inputs.add-app-props }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.add-settings=${{ inputs.add-settings }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.nlg-test=${{ env.run_NLG_Test }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "inputs.NLGDparams=${{ inputs.NLGDparams }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt
          echo "JOB_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt

      - name: Set hederahash sha value
        id: hederaHash
        run: |
          hederahash="$(git -C target_consensus_node rev-parse HEAD)"
          echo "sha=${hederahash}" >> "${GITHUB_OUTPUT}"
          echo "hederahash=${hederahash}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt

      - name: Compile
        run: |
          set +x
          cd "${{ github.workspace }}"/target_consensus_node

          ./gradlew clean assemble

          cd "${{ github.workspace }}"

      - name: Compile BN
        run: |
          cd "${{ github.workspace }}"/target_block_node
          ./gradlew app:distTar

          shortversion=$(echo "${{ inputs.bnref }}" | sed -e 's/^v\(.*\)/\1/g')
          cd ./block-node/app/build/distributions/
          rm -rf app-${shortversion}/plugins app-${shortversion}.tar
          tar cf app-${shortversion}.tar app-${shortversion}

          cd "${{ github.workspace }}"

      - name: Build Validator
        run: |
          cd "${{ github.workspace }}"/target_consensus_node
          ./gradlew --no-daemon :hedera-state-validator:shadowJar
          cd "${{ github.workspace }}"

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2

      # Set up kind; needed for configuring the solo environment
      - name: Setup Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          install_only: true
          node_image: kindest/node:v1.31.4@sha256:2cb39f7295fe7eafee0842b1052a599a4fb0f8bcf3f83d96c7f4864c357c6c30
          version: v0.26.0
          kubectl_version: v1.31.4
          verbosity: 3
          wait: 120s

      - name: Install Solo
        env:
          SOLO_VERSION: ${{ inputs.solo-version || 'latest' }}
        run: |
          npm install -g "@hiero-ledger/solo@${SOLO_VERSION}"

          # verify the installation
          solo --version

      - name: Deploy with Solo
        env:
          CONTEXT: hashgraph.teleport.sh-${{ steps.set-k8s-cluster.outputs.kubernetes-cluster }}
          INPUT_ADD_APP_PROPS: ${{ inputs.add-app-props }}
          INPUT_ADD_SETTINGS: ${{ inputs.add-settings }}
        run: |
          set +x
          set +e
          curdir="$(pwd)"

          # Create the solo directory
          mkdir -p "${{ github.workspace }}"/solo && cd "${{ github.workspace}}"/solo

          # Generate the Taskfile.yml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/Taskfile.yml Taskfile.yml

          # Generate the Taskfile.citr.yml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/Taskfile.citr.yml Taskfile.citr.yml

          # Generate the log4j2.xml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/log4j2.xml log4j2.xml

          # Generate the nlg-values.yaml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/nlg-values.yaml nlg-values.yaml

          # Generate the init-containers-values7.yaml inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/init-containers-values7.yaml init-containers-values7.yaml

          # Generate the block-node-values.yaml inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/block-node-values.yaml block-node-values.yaml

          # Update Taskfile values
          sed -i -e "s@%HOME%@${HOME}@g" -e "s@%SOLO_NAMESPACE%@${{ needs.acquire-kubernetes-resources.outputs.namespace }}@g" \
          -e "s@%HEDERA_SERVICES_ROOT%@${curdir}/target_consensus_node@g" Taskfile.yml

          # Update Init Containers values
          NETWORK_ID="${{ needs.acquire-kubernetes-resources.outputs.network-id }}"
          sed -i -e "s@%NETWORK_ID%@${NETWORK_ID}@g" init-containers-values7.yaml
          sed -i -e "s@%NETWORK_ID%@${NETWORK_ID}@g" block-node-values.yaml

          NETWORK_OWNER="${{ needs.acquire-kubernetes-resources.outputs.owner }}"
          sed -i -e "s@%NETWORK_OWNER%@${NETWORK_OWNER}@g" init-containers-values7.yaml
          sed -i -e "s@%NETWORK_OWNER%@${NETWORK_OWNER}@g" block-node-values.yaml

          # Generate the application.properties file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/application.properties.txt application.properties

          # Generate the application.environment file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/application.environment.txt application.environment

          # Generate the settings.txt file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/settings.txt settings.txt

          if [[ "${INPUT_ADD_APP_PROPS}" != "" ]]
          then
            echo -e "${INPUT_ADD_APP_PROPS}" >> application.properties
            echo "New application.properties:"
            cat application.properties
          fi

          if [[ "${INPUT_ADD_SETTINGS}" != "" ]]
          then
            echo -e "${INPUT_ADD_SETTINGS}" >> settings.txt
            echo "New settings.txt:"
            cat settings.txt
          fi
          export NODE_COPY_CONCURRENT=1

          task

      - name: Add BlockNodes
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo

          mv block-node-values.yaml block-node-values.yaml.orig

          #dedicate top-3 nodes for BN
          NETWORK_ID="${{ needs.acquire-kubernetes-resources.outputs.network-id}}"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt get nodes --show-labels | grep "network-id=${NETWORK_ID}," | grep 'consensus-node' | sort -n -k 1 | awk '{print $1}' | head -n 1  | grep -n -E '^' > firstNode.txt

          for i in $(seq 1 1 ${{ env.NUM_OF_BLOCK_NODES }})
          do
           #create PVC values.yaml from template
           for pvc_name in application-state-storage archive-storage logging-storage live-storage plugins-storage
           do
             sed -e "s@%NODE_ID%@${i}@g" -e "s@%PVC_NAME%@${pvc_name}@g" "${{ github.workspace }}"/.github/workflows/support/citr/block-node-pvc.yaml > block-node-pvc_${pvc_name}_${i}.yaml
             echo "kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" create -f block-node-pvc_${pvc_name}_${i}.yaml"
             sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" create -f block-node-pvc_${pvc_name}_${i}.yaml
           done
           sleep 10
          done

          bnindex=1
          BNNODE=$(grep "${bnindex}:" firstNode.txt | awk -F : '{print $2}')

          sed -i -e "s@%SOLO_NAMESPACE%@${{ needs.acquire-kubernetes-resources.outputs.namespace }}@g" block-node-values.yaml.orig

          #BN node 1
          sed -e "s@%NODE_ID%@1@g" -e "s@%BNNODE%@${BNNODE}@g" -e "s@%ANOTHER_BN_1%@block-node-2@g" -e "s@%ANOTHER_BN_2%@block-node-3@g" block-node-values.yaml.orig > block-node-values1.yaml
          cp block-node-values1.yaml block-node-values.yaml;
          export BN_MAPPING="node1=1,node2=2,node3=3,node4=3,node5=1,node6=2,node7=2"
          task solo:block:add

          #BN node 2
          sed -e "s@%NODE_ID%@2@g" -e "s@%BNNODE%@${BNNODE}@g" -e "s@%ANOTHER_BN_1%@block-node-1@g" -e "s@%ANOTHER_BN_2%@block-node-3@g" block-node-values.yaml.orig > block-node-values2.yaml
          cp block-node-values2.yaml block-node-values.yaml;
          export BN_MAPPING="node1=3,node2=1,node3=1,node4=2,node5=3,node6=3,node7=1"
          task solo:block:add

          #BN node 3
          sed -e "s@%NODE_ID%@3@g" -e "s@%BNNODE%@${BNNODE}@g" -e "s@%ANOTHER_BN_1%@block-node-1@g" -e "s@%ANOTHER_BN_2%@block-node-2@g" block-node-values.yaml.orig > block-node-values3.yaml
          cp block-node-values3.yaml block-node-values.yaml;
          export BN_MAPPING="node1=2,node2=2,node3=3,node4=1,node5=1,node6=1,node7=3"
          task solo:block:add

          sleep 30

      - name: Deploy CNs
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          task installCNs

      - name: Generate RSARoster
        run: |
          genesisFile=$(find $HOME/.solo -type f -name 'genesis-network.json')
          bash "${{ github.workspace }}"/.github/workflows/support/citr/genesisNetworkBNRSARoster.sh -i ${genesisFile} -o "${{ github.workspace}}"/solo/rsa-bootstrap-roster.json
          jq . "${{ github.workspace}}"/solo/rsa-bootstrap-roster.json

      - name: Update BlockNodes
        run: |
          ls "${{ github.workspace }}"/target_block_node
          ls "${{ github.workspace }}"/target_block_node/block-node/app/build/distributions/
          bnTar=$(ls "${{ github.workspace }}"/target_block_node/block-node/app/build/distributions/app-*.tar)
          bnVersion=$(basename ${bnTar} | sed -e 's/[\.]tar//g')
          echo "bnTar=$bnTar"
          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep 'block-node' | awk '{print $1}'`
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${bnTar} ${pod}:/tmp/BN.tar
          done

          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep 'block-node' | awk '{print $1}'`
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- bash -c "jpid=\$(ps -aef | grep -w java | grep -v grep | awk '{print \$2}'); cat /proc/\$jpid/environ | strings | grep -v -E 'JAVA_OPTS|JAVA_TOOL_OPTIONS'> /tmp/env.sh"
          done

      - name: Update RSA BlockNodes
        run: |

          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep 'block-node' | awk '{print $1}'`
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- bash -c "mkdir -p /opt/hiero/block-node/application-state"
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp "${{ github.workspace}}"/solo/rsa-bootstrap-roster.json \
              ${pod}:/opt/hiero/block-node/application-state/rsa-bootstrap-roster.json
          done

      - name: Temp down BlockNodes
        run: |
          for pod in $(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep 'block-node' | awk '{print $1}')
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- bash -c "ps -aef | grep java | grep -v grep | awk '{print \$2}' | xargs kill -9"
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- bash -c "cd /opt/hiero/block-node/; tar xf /tmp/BN.tar --overwrite"
          done

      - name: Start BlockNodes
        run: |
          bnTar=$(ls "${{ github.workspace }}"/target_block_node/block-node/app/build/distributions/app-*.tar)
          bnVersion=$(basename $bnTar | sed -e 's/.tar//g')
          for pod in $(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep 'block-node' | awk '{print $1}')
          do
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- \
              bash -c "find /opt/hiero/block-node/data -type f -exec rm -f {} \;" >/dev/null 2>&1
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- \
              bash -c "rm -rf /opt/hiero/block-node/logs/blocknode.log*" >/dev/null 2>&1
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- \
              bash -c ". /tmp/env.sh; export BLOCK_NODE_SERVER_MAX_MESSAGE_SIZE_BYTES=300000000; export JAVA_OPTS='-Xms48G -Xmx52G -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath="/tmp/dump.hprof"'; \
                       JAVA_TOOL_OPTIONS='-Djava.util.logging.config.file=/opt/hiero/block-node/logs/config/logging.properties -Dmetrics.exporter.openmetrics.http.hostname=0.0.0.0 -Dmetrics.exporter.openmetrics.http.port=16007 -Dmetrics.exporter.openmetrics.http.path=/metrics'; \
                       nohup bash /opt/hiero/block-node/${bnVersion}/bin/app > /opt/hiero/block-node/logs/log.txt 2>&1 &"
          done

      - name: Start CNs
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          task start

      - name: Solo logs
        if: ${{ !cancelled() && always() }}
        env:
          NAMESPACE_ALIAS: ${{ inputs.test-asset }}
          CONTEXT: hashgraph.teleport.sh-${{ steps.set-k8s-cluster.outputs.kubernetes-cluster }}
        run: |
          set +x
          set +e
          cd "${{ github.workspace}}"/solo
          task solo:node:logs

          sleep 30
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods
          cd "${{ github.workspace }}"
          mkdir solo_deploy
          cp -r "${HOME}"/.solo/logs solo_deploy/
          sh "${{ github.workspace }}"/.github/workflows/support/citr/getClusterErrors.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"
          cp -r podlog_"${{ needs.acquire-kubernetes-resources.outputs.namespace }}" solo_deploy/
          gcloud --no-user-output-enabled storage cp --recursive solo_deploy "${{ env.GS_ROOT_DIR }}/${{ steps.set-hcn-version.outputs.run-hcn-version }}_${{ needs.acquire-kubernetes-resources.outputs.namespace }}_${{needs.acquire-kubernetes-resources.outputs.network-id }}_${{ github.run_number }}"/solo_deploy
          echo Done: solo deploy logs  in "${{ env.GS_ROOT_HTTPS }}/${{ steps.set-hcn-version.outputs.run-hcn-version }}_${{ needs.acquire-kubernetes-resources.outputs.namespace }}_${{needs.acquire-kubernetes-resources.outputs.network-id }}_${{ github.run_number }}"/solo_deploy

      - name: Check filesystem mounts
        run: |
          for pod in `sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep 'network-node' | awk '{print $1}'`
          do
            echo "Pod ${pod}"
            sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${pod} -- bash -c "mount | grep '/dev/md0 on .*/data/saved'"
            if [[ $? -ne 0 ]]
            then
              echo "Error: /dev/md0 is not mounted for CN"
              exit 13
            fi
          done

      - name: Move to Github Workspace
        run: cd "${{ github.workspace }}"

      - name: Prepare NLG parameters
        run: |
          set +x
          set +e
          cd ${{ github.workspace }}/solo

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt get svc -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" -l "solo.hedera.com/type=network-node-svc" |\
            grep -v 'node10' | grep -v 'CLUSTER-IP' > networks.txt
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt get svc -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" -l "solo.hedera.com/type=network-node-svc" |\
            grep 'node10' | grep -v 'CLUSTER-IP' >> networks.txt

          # Generate the nlg-values.yaml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/nlg-values.yaml nlg-values.yaml

          # Generate the merkledb-values.yaml file inline
          cp "${{ github.workspace }}"/.github/workflows/support/citr/merkledb-values.yaml merkledb-values.yaml

          #Disable auto-start
          sed -i -e 's/NftTransferLoadTest/NftTransferLoadTestDONOTSTART/g' nlg-values.yaml
          grep -v 'x.y.z' nlg-values.yaml > new.yml

          cat networks.txt | awk '{print $3}' | perl -ne "~s/\n//g; print \"     - '\$_\\\:50211=0.0.\".(3+\$.-1).\"'\n\"" >> new.yml
          mv new.yml nlg-values.yaml

          NETWORK_ID="${{ needs.acquire-kubernetes-resources.outputs.network-id }}"
          sed -i -e "s@%NETWORK_ID%@${NETWORK_ID}@g" nlg-values.yaml

          NETWORK_OWNER="${{ needs.acquire-kubernetes-resources.outputs.owner }}"
          sed -i -e "s@%NETWORK_OWNER%@${NETWORK_OWNER}@g" nlg-values.yaml

          NETWORK_ID="${{ needs.acquire-kubernetes-resources.outputs.network-id }}"
          sed -i -e "s@%NETWORK_ID%@${NETWORK_ID}@g" merkledb-values.yaml

          NETWORK_OWNER="${{ needs.acquire-kubernetes-resources.outputs.owner }}"
          sed -i -e "s@%NETWORK_OWNER%@${NETWORK_OWNER}@g" merkledb-values.yaml

      - name: Deploy NLG test
        run: |
          set +x
          set +e
          cd "${{ github.workspace }}"/solo
          /usr/bin/helm upgrade --install --set appName=nlg nlg oci://artifacts.hashgraph.io/load-generator-helm-release-local/network-load-generator --version "${{ inputs.nlg-version }}" --values nlg-values.yaml -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"
          sleep 180
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods
          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          # Copy run version
          echo "run_number=${{ github.run_number }}" | tee -a "${{ github.workspace }}"/version_run.txt
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp "${{ github.workspace }}"/version_run.txt ${nlgpod}:/app/

      - name: JDK25 for NLG pod
        run: |
          set +x
          set +e
          nlgpod=$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator | awk '{print $1}')
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -- bash -c "rm -rf /opt/java/openjdk"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -- bash -c "\
          apt update; \
          apt install -y wget apt-transport-https gpg; \
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor | tee /etc/apt/trusted.gpg.d/adoptium.gpg > /dev/null; \
          echo \"deb https://packages.adoptium.net/artifactory/deb \$(awk -F= '/^VERSION_CODENAME/{print\$2}' /etc/os-release) main\" | tee /etc/apt/sources.list.d/adoptium.list; \
          apt update; \
          apt install -y temurin-25-jdk"

      - name: Deploy Validator
        run: |
          set +x
          set +e
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" \
            cp ${{ github.workspace }}/target_consensus_node/hedera-state-validator/build/libs/hedera-state-validator-*-SNAPSHOT-all.jar network-node1-0:/tmp/

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" \
            exec -it network-node1-0 -c root-container -- bash -c "mkdir /opt/hgcapp/services-hedera/HapiApp2.0/data/saved/validation.tmp"

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" \
            cp "${{ github.workspace }}"/.github/workflows/support/citr/checkValidatorNode.sh network-node1-0:/opt/hgcapp/services-hedera/HapiApp2.0/checkValidatorNode.sh

      - name: Build swirlds-benchmark-CryptoBenchMerkleDb.transferPrefetch
        run: |
          set +x
          set +e
          export TERM=vt100
          cd "${{ github.workspace }}"/target_consensus_node/platform-sdk/swirlds-benchmarks
          ulimit -n 16000
          ../../gradlew jmhJar

          cat << EOPROPF > settings.txt
          benchmark.benchmarkData,            .
          benchmark.saveDataDirectory,          true
          benchmark.verifyResult,            false
          benchmark.printHistogram,           true
          benchmark.csvOutputFolder,
          benchmark.csvWriteFrequency,          10000
          benchmark.csvAppend,              true
          benchmark.deviceName,             md0
          EOPROPF

          tar cvfz /tmp/SwirldsMerkleDB.tgz build/libs/swirlds-benchmarks-*-jmh.jar settings.txt

      - name: Deploy SwirldsMerkleDB test
        run: |
          set +x
          set +e
          cd "${{ github.workspace }}"/solo
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" apply -f merkledb-values.yaml
          sleep 30
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods
          merklebenchpod="merklebench"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${merklebenchpod} -- bash -c "\
          cd /host/mnt/nodefs; \
          if [[ -d cryptobench ]]; then rm -rf cryptobench; fi; \
          if [[ -f cryptobench ]]; then rm -f cryptobench; fi; \
          mkdir /host/mnt/nodefs/cryptobench"

          # Copy run version

          echo "run_number=${{ github.run_number }}" | tee -a "${{ github.workspace }}"/version_run.txt
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp "${{ github.workspace }}"/version_run.txt ${merklebenchpod}:/host/mnt/nodefs/cryptobench/
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp /tmp/SwirldsMerkleDB.tgz ${merklebenchpod}:/host/mnt/nodefs/cryptobench/

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${merklebenchpod} -- bash -c "cd /host/mnt/nodefs/cryptobench/; tar xvfz SwirldsMerkleDB.tgz; ls -l"

      - name: JDK25 for SwirldsMerkleDB test
        run: |
          set +x
          set +e
          merklebenchpod="merklebench"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${merklebenchpod} -- bash -c "\
          apt update; \
          apt install -y wget apt-transport-https gpg; \
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor | tee /etc/apt/trusted.gpg.d/adoptium.gpg > /dev/null; \
          echo \"deb https://packages.adoptium.net/artifactory/deb \$(awk -F= '/^VERSION_CODENAME/{print\$2}' /etc/os-release) main\" | tee /etc/apt/sources.list.d/adoptium.list; \
          apt update; \
          apt install -y temurin-25-jdk"

      - name: Distribution of K8S nodes, SysAdmin Grafana
        run: |
          set +x
          set +e

          start_date=$(date +%Y-%m-%dT%T)
          echo "NODE                                      POD" | tee -a "${GITHUB_STEP_SUMMARY}"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods -o=custom-columns=NODE:.spec.nodeName,NAME:.metadata.name | grep -v -w NODE |\
            perl -ne "if (/^([^\s]+)\s+([^\s]+)\s*$/) {print \"[\$1\](${{ steps.set-k8s-cluster.outputs.grafana-url }}&from=${start_date}&var-nodename=\$1) \$2\n\"}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Start SwirldsMerkleDB test
        env:
          INPUT_JAVA_ARGS: ${{ inputs.crypto-bench-merkle-db-java-args }}
          INPUT_TEST_PARAMS: ${{ inputs.crypto-bench-merkle-db-test-params }}
        run: |
          set +x
          set +e

          merklebenchpod="merklebench"
          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec "${merklebenchpod}" -- bash -c "cd /host/mnt/nodefs/cryptobench; nohup /usr/bin/env java -Xmx16g -jar build/libs/swirlds-benchmarks-*-jmh.jar \
          --jvmArgs '${INPUT_JAVA_ARGS}' CryptoBench.transferPrefetch ${INPUT_TEST_PARAMS} > swirlds-benchmarks.log 2>&1 &"

      - name: Start Account Creation
        env:
          INPUT_NLG_ACCOUNTS: ${{ inputs.nlg-accounts }}
        run: |
          run_NLGDparams="" # e.g. -Dbenchmark.maxtps=8000
          run_NLGDebugparams="-Dorg.slf4j.simpleLogger.defaultLogLevel=debug" # e.g. -Dorg.slf4j.simpleLogger.defaultLogLevel=debug

          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          n="$(expr "${INPUT_NLG_ACCOUNTS}" / 1000)"
          NLG_c=32

          NLGargs="-metrics -R -c ${NLG_c} -a ${INPUT_NLG_ACCOUNTS}"

          case "${{ env.run_NLG_Test }}" in
            NftTransferLoadTest)    NLGargs="-K ECDSA ${NLGargs} -n ${n} -T 1000 -S hot -p 50";;
            CryptoTransferLoadTest) NLGargs="-K ECDSA ${NLGargs}";;
            HCSLoadTest)            NLGargs="-K ECDSA ${NLGargs} -n ${n}";;
            TokenTransferLoadTest)  NLGargs="-K ECDSA ${NLGargs} -n ${n} -T 1000";;
          esac

          echo \
          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec "${nlgpod}" -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g ${run_NLGDparams} \
          ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${{ env.run_NLG_Test }} \
          ${NLGargs} -tt 10s > client.log 2>&1 &"

          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec "${nlgpod}" -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g ${run_NLGDparams} \
          ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${{ env.run_NLG_Test }} \
          ${NLGargs} -tt 10s > client.log 2>&1 &"

      - name: Start BlockNode Cleaner
        run: |
          set +x
          set +e
          nohup sh "${{ github.workspace }}"/.github/workflows/support/citr/blockNodeClean.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" > ${{ github.workspace }}/report/blockNodeClean.log 2>&1 &

      - name: Wait for account creation
        run: |
          set +x
          set +e

          check_status() {
           logfile=$1
           ec=2 # continue
           grep -E 'Finished .*Test' ${logfile} >/dev/null
           if [[ ${?} -eq 0 ]]
           then
              echo "Test finished, exiting..."
              ec=0
           fi

           grep -E 'ERROR com.hedera.benchmark.*LoadTest - Setup|ERROR com.hedera.benchmark.*LoadTest - Test failed' ${logfile}
           if [[ ${?} -eq 0 ]]
           then
              echo "ERROR: Wrong config/environment"
              tail ${logfile}
              ec=1
           fi

           return ${ec}
          }

          sleep 60

          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "tail /app/client.log"

          counter=0
          start_time="$(date +%s)"
          max_counter=${{ env.TIMEOUT_6H_LIMIT }}  #max_counter=330 mins

          ec=2
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
          isRunning=${?}

          while [ \( ${isRunning} -eq 0 \) -a \( ${counter} -le ${max_counter} \) ]
          do

           sleep 60
           current_time="$(date +%s)"
           counter="$(expr "${current_time}" - "${start_time}")"
           counter="$(expr "${counter}" \/ 60)"

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "tail /app/client.log" > client.log
           tail -n 1 client.log

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
           isRunning=${?}

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "grep -E 'ERROR com.hedera.benchmark|Finished .*Test' /app/client.log" > client_state.log
           check_status client_state.log
           ec=${?}
           if [[ ${ec} -lt 2 ]] #any terminal states 0 or 1, ec=2 is to continue
           then
             break
           fi
          done

          if [[ -f "${{ github.workspace }}"/report/client.log ]]
          then
            rm -rf "${{ github.workspace }}"/report/*
          fi

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${nlgpod}:/app/client.log "${{ github.workspace }}"/report/client.log
          sh "${{ github.workspace }}"/.github/workflows/support/citr/getClusterErrors.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${nlgpod}:/app/version_run.txt "${{ github.workspace }}"/report/version_run.txt
          cp -r podlog_"${{ needs.acquire-kubernetes-resources.outputs.namespace }}" "${{ github.workspace }}"/report/

          check_status "${{ github.workspace }}"/report/client.log
          ec=${?}

          if [[ ${ec} -eq 2 ]]
          then
            echo "Continue to wait in next Runner ..."
            ec=0
          fi

          tail "${{ github.workspace }}"/report/client.log
          echo "Finished, exit code=${ec}"
          exit ${ec}

      - name: Authenticate to Google Cloud
        uses: step-security/google-github-auth@40f6deebd366f16c782d7a0ad0844e3b96a032a6 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Archive account creation logs
        run: |
          cd "${{ github.workspace }}"/

          gcloud --no-user-output-enabled storage ls gs://performance-engineering-reports 2>/dev/null | grep permanent >/dev/null 2>&1
          if [[ ${?} -ne 0 ]]
          then
            sleep 10
            gcloud --no-user-output-enabled storage ls gs://performance-engineering-reports | grep permanent >/dev/null
          fi

          echo "Size of report dir:"
          du -sk report

          gcloud --no-user-output-enabled storage cp --recursive report "${{ env.GS_ROOT_DIR }}/${{ steps.set-hcn-version.outputs.run-hcn-version }}_${{ needs.acquire-kubernetes-resources.outputs.namespace }}_${{needs.acquire-kubernetes-resources.outputs.network-id }}_${{ github.run_number }}/create_accounts"
          echo Done: see results in "${{ env.GS_ROOT_HTTPS }}/${{ steps.set-hcn-version.outputs.run-hcn-version }}_${{ needs.acquire-kubernetes-resources.outputs.namespace }}_${{needs.acquire-kubernetes-resources.outputs.network-id }}_${{ github.run_number }}/create_accounts"

          #echo "Truncating logs for next test..."
          #sh "${{ github.workspace }}"/.github/workflows/support/citr/resetCNlogs.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"

      - name: Start test
        env:
          INPUT_NLG_ACCOUNTS: ${{ inputs.nlg-accounts }}
          INPUT_NLG_TIME: ${{ inputs.nlg-time }}
        run: |
          run_NLGDparams="" # e.g. -Dbenchmark.maxtps=8000
          run_NLGDebugparams="-Dorg.slf4j.simpleLogger.defaultLogLevel=debug" # e.g. -Dorg.slf4j.simpleLogger.defaultLogLevel=debug

          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          n="$(expr "${INPUT_NLG_ACCOUNTS}" / 1000)"
          NLG_c=32

          NLGargs="-metrics -R -c ${NLG_c} -a ${INPUT_NLG_ACCOUNTS}"

          case "${{ env.run_NLG_Test }}" in
            NftTransferLoadTest)    NLGargs="-K ECDSA ${NLGargs} -n ${n} -T 1000 -S hot -p 50";;
            CryptoTransferLoadTest) NLGargs="-K ECDSA ${NLGargs}";;
            HCSLoadTest)            NLGargs="-K ECDSA ${NLGargs} -n ${n}";;
            TokenTransferLoadTest)  NLGargs="-K ECDSA ${NLGargs} -n ${n} -T 1000";;
          esac

          echo \
          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec "${nlgpod}" -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g ${run_NLGDparams} \
          ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${{ env.run_NLG_Test }} \
          ${NLGargs} -tt ${INPUT_NLG_TIME}m > client.log 2>&1 &"

          kubectl -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec "${nlgpod}" -c nlg -- bash -c "nohup /usr/bin/env java -Xmx30g ${run_NLGDparams} \
          ${run_NLGDebugparams} -cp /app/lib/*:\$(ls -1 /app/network-load-generator-*.jar) com.hedera.benchmark.${{ env.run_NLG_Test }} \
          ${NLGargs} -tt ${INPUT_NLG_TIME}m > client.log 2>&1 &"

  performance-NftTransferLoadTest-watch1:
    name: NFT Transfer Load Test
    runs-on: hl-cn-sdpt-lin-lg
    if: ${{ !cancelled() && needs.acquire-kubernetes-resources.result == 'success' }}
    needs:
      - acquire-kubernetes-resources
      - performance-tests-start
    env:
      RUN_HCN_VERSION: ${{ inputs.ref }}
      run_NLG_Accounts: ${{ inputs.nlg-accounts }}
      run_NLG_Time: ${{ inputs.nlg-time }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Print parameters
        run: |
          echo "namespace=${{ needs.acquire-kubernetes-resources.outputs.namespace }}" | tee -a "${GITHUB_STEP_SUMMARY}" "${{ github.workspace }}"/version_run.txt

      - name: Install KubeCtl
        uses: step-security/setup-kubectl@2edbf6aff97d814e9dc52827498ac51fe972e6d0 # v4.0.0
        with:
          version: v1.35.0

      - name: kubectl wrapper
        run: |
          kubectl=$(which kubectl)
          sudo mv ${kubectl} ${kubectl}.orig
          sudo cp "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt ${kubectl}
          sudo chmod a+rx ${kubectl}
          which kubectl

      - name: Install Teleport Client
        uses: teleport-actions/setup@176c25dfcd19cd31a252f275d579822b243e7b9c # v1.0.6
        with:
          version: 18.4.0

      - name: Authorize Teleport SSH Access
        id: auth-ssh
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          certificate-ttl: 24h

      - name: Authorize Teleport K8S Access
        id: auth-k8s
        uses: teleport-actions/auth-k8s@0f46164469ae4fcd4d359d40e06bab17d4be17c9 # v2.0.6
        with:
          proxy: hashgraph.teleport.sh:443
          token: gh-citr-performance-svcs-bot
          kubernetes-cluster: ${{ needs.acquire-kubernetes-resources.outputs.fqdn }}
          certificate-ttl: 24h

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: step-security/google-github-auth@40f6deebd366f16c782d7a0ad0844e3b96a032a6 # v2.1.10
        with:
          workload_identity_provider: "projects/716789254648/locations/global/workloadIdentityPools/perf-eng-reports-pool/providers/gh-provider"
          service_account: "gh-perf-report-writer@perf-engineering-reports.iam.gserviceaccount.com"

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "${{ inputs.java-version }}"

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.39.2

      - name: OS check procedure
        id: setup
        shell: bash
        run: |
          set +x
          set +e
          export TERM=vt100
          echo Setup procedure ...
          cat /etc/*elease
          sudo apt-get update
          sudo apt-get install -y net-tools iputils-ping node-typescript

      - name: Create report dir
        shell: bash
        run: |
          mkdir "${{ github.workspace }}"/report

      - name: Start BlockNode Cleaner
        run: |
          set +x
          set +e
          nohup sh "${{ github.workspace }}"/.github/workflows/support/citr/blockNodeClean.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" > ${{ github.workspace }}/report/blockNodeClean.log 2>&1 &

      - name: Wait for NLG Transfer
        run: |
          set +x
          set +e

          check_status() {
           logfile=$1
           ec=2 # continue
           grep -E 'Finished .*Test' ${logfile} >/dev/null
           if [[ ${?} -eq 0 ]]
           then
              echo "Test finished, exiting..."
              ec=0
           fi

           grep -E 'ERROR com.hedera.benchmark.*LoadTest - Setup|ERROR com.hedera.benchmark.*LoadTest - Test failed' ${logfile}
           if [[ ${?} -eq 0 ]]
           then
              echo "ERROR: Wrong config/environment"
              tail ${logfile}
              ec=1
           fi

           return ${ec}
          }

          sleep 60

          nlgpod="$(sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" get pods | grep nlg-network-load-generator| awk '{print $1}')"

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "tail /app/client.log"

          counter=0
          start_time="$(date +%s)"
          max_counter=${{ env.TIMEOUT_6H_LIMIT }}  #max_counter=330 mins

          ec=2
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
          isRunning=${?}

          while [ \( ${isRunning} -eq 0 \) -a \( ${counter} -le ${max_counter} \) ]
          do

           sleep 60
           current_time="$(date +%s)"
           counter="$(expr "${current_time}" - "${start_time}")"
           counter="$(expr "${counter}" \/ 60)"

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "tail /app/client.log" > client.log
           tail -n 1 client.log

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "ps -aef | grep -w java | grep 'com.hedera.benchmark' | grep -v grep" | grep -w java > /dev/null
           isRunning=${?}

           sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" exec ${nlgpod} -c nlg -- bash -c "grep -E 'ERROR com.hedera.benchmark|Finished .*Test' /app/client.log" > client_state.log
           check_status client_state.log
           ec=${?}
           if [[ ${ec} -lt 2 ]] #any terminal states 0 or 1, ec=2 is to continue
           then
             break
           fi
          done

          if [[ -f "${{ github.workspace }}"/report/client.log ]]
          then
            rm -rf "${{ github.workspace }}"/report/*
          fi

          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${nlgpod}:/app/client.log "${{ github.workspace }}"/report/client.log
          sh "${{ github.workspace }}"/.github/workflows/support/citr/getClusterErrors.sh "${{ needs.acquire-kubernetes-resources.outputs.namespace }}"
          sh "${{ github.workspace }}"/.github/workflows/support/citr/kubectlt -n "${{ needs.acquire-kubernetes-resources.outputs.namespace }}" cp ${nlgpod}:/app/version_run.txt "${{ github.workspace }}"/report/version_run.txt
          cp -r podlog_"${{ needs.acquire-kubernetes-resources.outputs.namespace }}" "${{ github.workspace }}"/report/

          check_status "${{ github.workspace }}"/report/client.log
          ec=${?}

          if [[ ${ec} -eq 2 ]]
          then
            echo "Continue to wait in next Runner ..."
            ec=0
          fi

          tail "${{ github.workspace }}"/report/client.log
          echo "Finished, exit code=${ec}"
          exit ${ec}

