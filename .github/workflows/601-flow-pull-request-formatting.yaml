# SPDX-License-Identifier: Apache-2.0
#
# Runs the required Title Check and Assignee Check on every PR, including PRs from forks.
#
# Why pull_request_target: it runs this workflow as it is on the base branch (main), so a PR cannot
# change the checks it is judged by. A pull_request trigger would run the PR's own copy of this file.
# GitHub blocks pull_request_target in public repositories unless an Actions event policy allows it.
# The repository policy "[Workflow] Pull_Request_Target: Assignee & Title Check" (Settings > Actions >
# Policies) allows it for this file's path only, so renaming or moving this file blocks it again;
# update the policy's workflow path with any rename (see issue #28310).
#
# Keep it safe to run with the base repository's token:
#   - never check out, build or run code from the PR;
#   - never use secrets other than GITHUB_TOKEN;
#   - only read the PR's metadata (title, assignees) from the event payload or the API;
#   - keep the permissions at the minimum the checks need.
name: "601: [FLOW] PR Formatting"
on:
  pull_request_target:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - reopened
      - edited
      - converted_to_draft
      - ready_for_review
      - review_requested
      - review_request_removed
      - locked
      - unlocked
      - synchronize

defaults:
  run:
    shell: bash

# The title check reads the PR through the API; the assignee check reads only the event payload
permissions:
  pull-requests: read

jobs:
  title-check:
    name: Title Check
    runs-on: hl-cn-default-lin-sm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check PR Title
        uses: step-security/action-semantic-pull-request@75d2dd5deafa3e9fccc1626ecd58d076ed1d2c79 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  assignee-check:
    name: Assignee Check
    runs-on: hl-cn-default-lin-sm

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Check Assignee
        if: ${{ github.event.pull_request.assignees == null || github.event.pull_request.assignees[0] == null }}
        run: |
          echo "Assignee is not set. Failing the workflow."
          exit 1
