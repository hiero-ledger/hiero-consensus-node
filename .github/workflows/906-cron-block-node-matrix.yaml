# SPDX-License-Identifier: Apache-2.0
name: "906: [CRON] Block Node Version Matrix"
on:
  workflow_dispatch:
    inputs:
      cn-refs:
        description: "Comma-separated branches, tags or SHAs of hiero-consensus-node to test (default: the selected branch). Each ref is tested with its own pinned Solo, Java, TCK, JS SDK and mirror node versions."
        type: string
        required: false
        default: ""
      bn-versions:
        description: "Comma-separated Block Node versions to test (e.g. v0.44.0,v0.45.0-alpha1). Default: the Block Node version pinned in the first CN ref's .citr-env."
        type: string
        required: false
        default: ""

defaults:
  run:
    shell: bash

# Same permissions as the called 821 workflow requires
permissions:
  checks: write
  contents: read
  actions: write
  statuses: write
  id-token: write

concurrency:
  group: block-node-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-versions:
    name: Resolve Consensus and Block Node Versions
    runs-on: hl-cn-default-lin-sm
    if: ${{ github.event.repository.visibility == 'public' }}
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Initialize GitHub Job
        uses: pandaswhocode/initialize-github-job@5dbfbc4329ceab48a57d983325dadbd3ec8123e9 # v1.2.2
        with:
          checkout: "true"
          checkout-token: "${{ secrets.GITHUB_TOKEN }}"
          checkout-fetch-depth: "1"
          setup-jq: "true"

      - name: Resolve Versions
        id: resolve
        env:
          CN_REFS: ${{ inputs.cn-refs || github.ref }}
          BN_VERSIONS: ${{ inputs.bn-versions }}
        run: |
          # per-ref Solo/Java/TCK/JS SDK/mirror node versions; also enforces Solo >= 0.44.0 for every ref
          CONFIGS=$(bash .github/workflows/support/scripts/resolve-cn-configs.sh)
          echo "Consensus node configs: ${CONFIGS}"

          # no explicit list: test the Block Node version pinned by the first CN ref
          if [[ -z "${BN_VERSIONS}" ]]; then
            BN_VERSIONS=$(echo "${CONFIGS}" | jq -r '.[0]."pinned-bn-version"')
          fi
          # trimmed, de-duplicated; every entry must look like vX.Y.Z[-suffix] since it ends up in scripts and artifact names
          BN_LIST=$(echo "${BN_VERSIONS}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF && !seen[$0]++')
          if [[ -z "${BN_LIST}" ]]; then
            echo "::error::No Block Node versions given"
            exit 1
          fi
          while IFS= read -r v; do
            if [[ ! "${v}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
              echo "::error::Invalid Block Node version '${v}' (expected vX.Y.Z or vX.Y.Z-suffix)"
              exit 1
            fi
          done <<< "${BN_LIST}"
          VERSIONS=$(echo "${BN_LIST}" | jq -R . | jq -sc .)
          echo "Block Node versions under test: ${VERSIONS}"

          # full cross product: every CN ref x every BN version
          MATRIX=$(jq -nc --argjson cfgs "${CONFIGS}" --argjson bns "${VERSIONS}" \
            '[$cfgs[] as $c | $bns[] | . as $b | $c + {"bn-version": $b}]')
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Block Node regression legs"
            echo "${MATRIX}" | jq -r '.[] | "- CN `" + ."cn-ref" + "` x BN `" + ."bn-version" + "`"'
          } >> "${GITHUB_STEP_SUMMARY}"

  # One full 821 Block Node regression per CN ref x BN version; a failing leg must not hide the others.
  block-node-regression:
    name: CN ${{ matrix.cn-ref }} / BN ${{ matrix.bn-version }}
    needs:
      - resolve-versions
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.resolve-versions.outputs.matrix) }}
    uses: ./.github/workflows/821-call-block-node-regression.yaml
    with:
      ref: ${{ matrix.cn-ref }}
      cn-label: ${{ matrix.cn-slug }}
      custom-job-name: "Block Node ${{ matrix.bn-version }} on CN ${{ matrix.cn-ref }}"
      solo-version: ${{ matrix.solo-version }}
      java-version: ${{ matrix.java-version }}
      bn-release-version: ${{ matrix.bn-version }}
      bn-mirror-node-version: ${{ matrix.bn-mirror-node-version }}
      tck-version: ${{ matrix.tck-version }}
      js-sdk-version: ${{ matrix.js-sdk-version }}
    secrets:
      access-token: ${{ secrets.GH_ACCESS_TOKEN }}
      slack-detailed-report-webhook: ${{ secrets.SLACK_CITR_DETAILED_REPORTS_WEBHOOK }}
