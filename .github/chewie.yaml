# Chewie compute allocation configuration.
# Generated by Chewie at installation time. Edit to customise repository policy.
# See: https://github.com/swirldslabs/chewie

# Branches from which Chewie will service allocation requests.
# Supports glob patterns (e.g. "release/*"). Default: all branches ("*").
branches:
  - "*"
#  - main

# Default allocation duration in seconds (used when the workflow does not specify one).
# Chewie enforces its own server-side maximum independently of this value.
# Default: 72000s (20 hours)
default_duration: 72000

# Default timeout in seconds: how long Chewie will wait for resources before failing.
# Default: 3600s (1 hour)
default_timeout: 3600

# Default MDLT production run length in MINUTES (note: unlike the two values above, which are in
# seconds, this is in minutes because it is passed straight to the load generator's `-tt <n>m` flag).
# This is the length of the long-running test the 835 executor launches after its 3-minute smoke run;
# it is not an allocation lifetime. Keep default_duration long enough to outlive it.
# Default: 7200m (5 days)
default_mdlt_length: 7200
# Optional: restrict which workflow files may use Chewie in this repository.
# If omitted, any workflow from an allowed branch may request resources.
# workflows:
#  - my-workflow.yaml
