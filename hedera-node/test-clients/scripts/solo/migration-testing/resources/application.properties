#
# application.properties for the Migration Testing panel. This is a verbatim
# copy of solo's bundled resources/templates/application.properties (the file
# solo applies by default when --application-properties is omitted) with a
# single migration-specific delta: WRAPS is disabled.
#
# Why WRAPS is off: constructing the genesis WRAPS proof (a recursive-SNARK
# proving step in WrapsHistoryProver#constructGenesisWrapsProof) needs more
# memory than the ~16 GB hl-cn-migration-lin-lg runner has once 3 CN pods +
# Mirror Node + Postgres + Redis + MinIO are co-resident, so the node is
# OOM-killed on the post-upgrade restart. The compiled default flipped to true
# in #25770; pin it off here. hinTS and history proofs are intentionally left
# ON to preserve migration coverage, mirroring
# hedera-node/configuration/dev/application.properties.
#
# Everything above the TSS block below is solo's template verbatim (keep it in
# sync with solo) so this file changes nothing but WRAPS. In particular
# blockStream.streamMode=RECORDS must be preserved: the node's compiled default
# is BOTH, and flipping it would change what the Mirror Node importer consumes.
hedera.config.version=0
ledger.id=0x01
netty.mode=TEST
contracts.chainId=298
hedera.recordStream.logPeriod=1
balances.exportPeriodSecs=400
files.maxSizeKb=2048
hedera.recordStream.compressFilesOnCreation=true
balances.compressOnCreation=true
contracts.maxNumWithHapiSigsAccess=0
autoRenew.targetTypes=
nodes.gossipFqdnRestricted=false
hedera.profiles.active=TEST
nodes.updateAccountIdAllowed=true
blockStream.streamMode=RECORDS
# TODO: we can remove this after we no longer need less than v0.59.x
networkAdmin.exportCandidateRoster=true
# for v0.59+, write the network.json file when you freeze the network
networkAdmin.diskNetworkExport=ONLY_FREEZE_BLOCK
hedera.realm=0
hedera.shard=0
nodes.webProxyEndpointsEnabled=true
nodes.nodeRewardsEnabled=false

# --- Migration-specific delta: disable only WRAPS (see header); hinTS + history stay on ---
tss.wrapsEnabled=false
tss.wrapsProvingKeyDownloadEnabled=false
