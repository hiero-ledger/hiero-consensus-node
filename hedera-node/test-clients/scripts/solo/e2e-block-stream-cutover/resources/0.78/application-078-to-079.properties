nodes.nodeRewardsEnabled=false

# 0.78 genesis baseline: retain dual-write + mock signatures (Solo defaults to the post-cutover
# state). Genesis + staking then complete without a block node; the cutover to BLOCKS/GRPC/real-TSS
# happens at the 0.79 upgrade (resources/0.79/application-078-to-079.properties), after the BN is up.
blockStream.streamMode=BOTH
blockStream.writerMode=FILE_AND_GRPC
blockStream.enableCutover=false
tss.forceMockSignatures=true

# Keep the archive under the parent of Solo's WRAPS artifacts directory.
tss.wrapsProvingKeyPath=/opt/hgcapp/services-hedera/HapiApp2.0/data/keys/wraps-archive
