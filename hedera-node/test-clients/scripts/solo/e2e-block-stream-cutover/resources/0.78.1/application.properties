# Preserve Solo's local-network settings when replacing application.properties.
contracts.chainId=298
nodes.gossipFqdnRestricted=false
nodes.nodeRewardsEnabled=false
blockStream.enableCutover=false
blockStream.streamMode=BOTH
blockStream.writerMode=FILE
tss.forceMockSignatures=true

# Stage 0: published release baseline with record streaming only. No BN, TSS or wrapped hashes yet;
# stage 1 upgrades this network to the local build and starts saving wrapped record hashes.
hedera.config.version=0
hedera.recordStream.writeWrappedRecordFileBlockHashesToDisk=false
blockStream.streamWrappedRecordBlocks=false
tss.hintsEnabled=false
tss.historyEnabled=false
