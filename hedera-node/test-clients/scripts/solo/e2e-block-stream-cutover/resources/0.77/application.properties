hedera.config.version=0
ledger.id=0x01
netty.mode=TEST
contracts.chainId=298
hedera.recordStream.logPeriod=1
balances.exportPeriodSecs=400
files.maxSizeKb=2048
hedera.recordStream.compressFilesOnCreation=true
balances.compressOnCreation=true
contracts.maxNumWithHapiSigsAccess=0
autoRenew.targetTypes=
nodes.gossipFqdnRestricted=false
hedera.profiles.active=TEST
nodes.updateAccountIdAllowed=true
# TODO: we can remove this after we no longer need less than v0.59.x
networkAdmin.exportCandidateRoster=true
# for v0.59+, write the network.json file when you freeze the network
networkAdmin.diskNetworkExport=ONLY_FREEZE_BLOCK
hedera.realm=0
hedera.shard=0
nodes.webProxyEndpointsEnabled=true
nodes.nodeRewardsEnabled=false
# TCK token tests use the operator as treasury; once its association count exceeds the
# per-node BalanceQueryLimits capacity, counting-throttled balance queries are permanently BUSY.
tokens.countingGetBalanceThrottleEnabled=false

blockStream.streamMode=BLOCKS
blockStream.writerMode=GRPC
hedera.recordStream.writeWrappedRecordFileBlockHashesToDisk=false
hedera.recordStream.computeHashesFromWrappedRecordBlocks=true
hedera.recordStream.liveWritePrevWrappedRecordHashes=true
tss.hintsEnabled=true
tss.historyEnabled=true
tss.wrapsEnabled=true
# Applied to the local current-build binary (0.79.0-SNAPSHOT / hedera-cryptography 3.15.2).
# Must match TssConfig wrapsProvingKeyHash / wrapsProvingKeyDownloadUrl (WRAPS v1.6 proving key).
tss.wrapsProvingKeyHash=ead332b853b0312881ebaaae1a55020014c3b577f9639ad3c136e2d4e573d9c87261c328e8043dcbed497a34fae5b33f
# Absolute path so WrapsProvingKeyVerification.validateArtifactsPathConsistency (which
# does Path.startsWith between this path's parent and TSS_LIB_WRAPS_ARTIFACTS_PATH) does
# not get tripped up by a relative-vs-absolute mismatch.
tss.wrapsProvingKeyPath=/opt/hgcapp/services-hedera/HapiApp2.0/data/keys/wraps-archive
tss.wrapsProvingKeyDownloadUrl=https://builds.hedera.com/tss/hiero/wraps/v1.6/wraps-v1.6.0.tar.gz
tss.wrapsProvingKeyDownloadEnabled=true
blockStream.enableCutover=true
tss.forceMockSignatures=false
