# SPDX-License-Identifier: Apache-2.0
# Preserve Solo's local-network settings when replacing application.properties.
contracts.chainId=298
nodes.gossipFqdnRestricted=false
nodes.nodeRewardsEnabled=false
blockStream.enableCutover=true
blockStream.streamMode=BLOCKS
blockStream.writerMode=GRPC
hedera.recordStream.wrappedRecordHashesDir=/opt/hgcapp/services-hedera/HapiApp2.0/data/wrappedRecordHashes
tss.forceMockSignatures=false

# Stage 3: cut over to real TSS block streaming. Clear jumpstart properties so replay
# does not try to consume stage 1 hashes again.
hedera.config.version=2
hedera.recordStream.writeWrappedRecordFileBlockHashesToDisk=false
hedera.recordStream.computeHashesFromWrappedRecordBlocks=true
hedera.recordStream.liveWritePrevWrappedRecordHashes=true
blockStream.streamWrappedRecordBlocks=false
blockStream.buffer.isBufferPersistenceEnabled=true
blockStream.jumpstart.blockNum=-1
blockStream.jumpstart.previousWrappedRecordBlockHash=
blockStream.jumpstart.currentBlockConsensusTimestampHash=
blockStream.jumpstart.currentBlockOutputItemsTreeRootHash=
blockStream.jumpstart.streamingHasherLeafCount=-1
blockStream.jumpstart.streamingHasherHashCount=-1
blockStream.jumpstart.streamingHasherSubtreeHashes=
tss.hintsEnabled=true
tss.historyEnabled=true
