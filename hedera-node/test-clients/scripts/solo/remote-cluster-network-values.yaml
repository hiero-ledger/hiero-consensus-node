# SPDX-License-Identifier: Apache-2.0
#
# Solo network-deploy value overrides for the REMOTE multi-tenant cluster, shared by the streaming
# and cutover scenarios (jumpstart has its own copy under wrapped-record-block-jumpstart/resources/
# remote/). Pass via `solo consensus network deploy --values-file` with `--pvcs false` on remote.
#
# Scheduling: each pod spec names the Chewie allocation group it runs on with a "chewie-group"
# placeholder, which 103-user-solo-tests-adhoc renders into that group's labels (nodeSelector) and
# tolerations via .github/workflows/support/chewie/apply-allocation-scheduling.sh. Unrendered, the
# placeholder matches no node, so the pods stay Pending rather than land on another allocation's
# machines. MinIO is pinned to local-path (the cluster has no default class);
# consensus uses --pvcs false (emptyDir) so it needs no StorageClass for a single short run.
# Resources are right-sized for a functional run (NOT the 256Gi perf profile).

defaults:
  root:
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "8"
        memory: 16Gi

deployment:
  nodeSelector:
    chewie-group: cn

haproxyDeployment:
  nodeSelector:
    chewie-group: aux

envoyDeployment:
  nodeSelector:
    chewie-group: aux

minio-server:
  tenant:
    pools:
      - servers: 1
        name: pool-1
        volumesPerServer: 1
        size: 50Gi
        storageClassName: local-path
        nodeSelector:
          chewie-group: aux
