# Local observability stack: VictoriaMetrics + Grafana + Loki + Alloy.
#
# Start with:
#   docker compose --env-file defaults.env --env-file local.env up -d
#
# Do not edit this file to configure the stack - put overrides in `local.env`,
# or in `docker-compose.override.yml`, which Compose loads automatically if it
# exists. Both are gitignored.

networks:
  observability:
    driver: bridge

volumes:
  victoriametrics-data:
  grafana-data:
  loki-data:
  alloy-data:
  # LOGS_DIR points at this during `make selftest`, so the fixture never writes
  # into anyone's working tree.
  selftest-logs:

services:
  # ---------------------------------------------------------------------------
  # VictoriaMetrics - scrapes metrics targets *and* stores them.
  # ---------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${METRICS_RETENTION}
      - -promscrape.config=/etc/vm/promscrape.yml
      - -httpListenAddr=:8428
    environment:
      # VictoriaMetrics expands %{VAR} in its scrape config at startup, inside
      # the container, so these have to be present here and not just in the
      # env file Compose reads.
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL}
      SCRAPE_TARGETS: ${SCRAPE_TARGETS}
      METRIC_LABELS: ${METRIC_LABELS}
      SELFTEST_TARGETS: ${SELFTEST_TARGETS}
    volumes:
      - ${PROMSCRAPE_CONFIG}:/etc/vm/promscrape.yml:ro
      - victoriametrics-data:/victoria-metrics-data
    ports:
      - "${VICTORIAMETRICS_PORT}:8428"
    # Required on Linux for host.docker.internal to resolve; harmless elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Grafana - UI. Anonymous admin access, no credentials anywhere.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Expanded by the datasource provisioning file.
      METRICS_DATASOURCE_NAME: ${METRICS_DATASOURCE_NAME}
      METRICS_DATASOURCE_URL: ${METRICS_DATASOURCE_URL}
      LOKI_DATASOURCE_NAME: ${LOKI_DATASOURCE_NAME}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - victoriametrics
      - loki
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Loki - log storage.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      LOGS_RETENTION: ${LOGS_RETENTION}
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT}:3100"
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Alloy - tails log files, pushes to Loki.
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      # A directory, not a file: Alloy merges every *.alloy in it, which is what
      # makes alloy/config.local.alloy work as an override.
      - /etc/alloy
    environment:
      LOG_INCLUDE: ${LOG_INCLUDE}
      LOG_LABELS: ${LOG_LABELS}
      LOG_MULTILINE_START: ${LOG_MULTILINE_START}
    volumes:
      - ./alloy:/etc/alloy:ro
      - ${LOGS_DIR}:/logs:ro
      # Positions must survive a restart, or every restart re-ingests every file.
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT}:12345"
    depends_on:
      - loki
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Selftest fixtures and assertions. See `make selftest`.
  # ---------------------------------------------------------------------------
  selftest-metrics:
    image: busybox:1.38.0
    profiles: [selftest]
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    volumes:
      - ./selftest/metrics.txt:/www/metrics.txt:ro
    networks:
      - observability

  selftest-log-writer:
    image: busybox:1.38.0
    profiles: [selftest]
    volumes:
      # Read-write here only; alloy keeps :ro.
      - ${LOGS_DIR}:/logs
    # Every `$` is doubled so Compose does not interpolate it. The trailing
    # timestamped line closes the stack-trace block with a firstline match
    # instead of leaving it to stage.multiline's max_wait_time.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        T=$$(date '+%Y-%m-%d %H:%M:%S')
        printf '%s INFO  selftest line one\n' "$$T" > /logs/selftest.log
        printf '%s INFO  selftest line two\n' "$$T" >> /logs/selftest.log
        printf '%s INFO  selftest line three\n' "$$T" >> /logs/selftest.log
        printf '%s DEBUG selftest line four\n' "$$T" >> /logs/selftest.log
        printf '%s WARN  selftest line five\n' "$$T" >> /logs/selftest.log
        printf '%s ERROR selftest request failed\njava.lang.RuntimeException: selftest failure\n\tat com.example.Alpha.one(Alpha.java:11)\n\tat com.example.Beta.two(Beta.java:22)\n\tat com.example.Gamma.three(Gamma.java:33)\n' "$$T" >> /logs/selftest.log
        printf '%s INFO  selftest trailer\n' "$$T" >> /logs/selftest.log
        exec sleep infinity
    networks:
      - observability

  selftest-assert:
    image: curlimages/curl:8.21.0
    profiles: [assert]
    entrypoint: ["/bin/sh"]
    command: ["/assert.sh"]
    volumes:
      - ./selftest/assert.sh:/assert.sh:ro
    depends_on:
      - victoriametrics
      - loki
      - alloy
    networks:
      - observability
