# Local observability stack: VictoriaMetrics + Grafana + Loki + Alloy.
#
# Start with:
#   docker compose --env-file defaults.env --env-file local.env up -d
#
# Do not edit this file to configure the stack - put overrides in `local.env`,
# which is gitignored.

# Fixes the Compose project name (container/network/volume name prefix)
# regardless of what directory this repo is cloned into. Without this,
# Compose falls back to the current directory's basename.
name: observability-stack

networks:
  observability:
    driver: bridge

volumes:
  victoriametrics-data:
  grafana-data:
  loki-data:
  alloy-data:
  dashboards-out:

services:
  # ---------------------------------------------------------------------------
  # VictoriaMetrics - scrapes metrics targets *and* stores them.
  # ---------------------------------------------------------------------------
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.151.0
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=${METRICS_RETENTION}
      - -promscrape.config=/etc/vm/promscrape.yml
      - -httpListenAddr=:8428
    environment:
      # VictoriaMetrics expands %{VAR} in its scrape config at startup, inside
      # the container, so these have to be present here and not just in the
      # env file Compose reads.
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL}
      SCRAPE_TARGETS: ${SCRAPE_TARGETS}
      METRIC_LABELS: ${METRIC_LABELS}
    volumes:
      - ${PROMSCRAPE_CONFIG}:/etc/vm/promscrape.yml:ro
      - victoriametrics-data:/victoria-metrics-data
    ports:
      - "${VICTORIAMETRICS_PORT}:8428"
    # Required on Linux for host.docker.internal to resolve; harmless elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # dashboards-init - rewrites ${<name>}-style placeholders left by Grafana's
  # "export for sharing externally" option, then copies the result into the
  # dashboards-out volume Grafana reads from. Runs once, to completion,
  # before Grafana starts (see grafana.depends_on below). The source
  # directory is mounted read-only, so it is never modified even by mistake.
  #
  # Re-run this alone after editing a source dashboard:
  #   docker compose ... up -d --force-recreate dashboards-init
  # Grafana's file provisioner then hot-reloads on its own - no restart of
  # Grafana itself needed, and `make restart` (which recreates everything)
  # works too but is heavier than necessary for this.
  # ---------------------------------------------------------------------------
  dashboards-init:
    image: busybox:1.38.0
    command: ["/bin/sh", "/dashboards-init.sh"]
    environment:
      METRICS_DATASOURCE_NAME: ${METRICS_DATASOURCE_NAME}
    volumes:
      - ./services/grafana/dashboards-init.sh:/dashboards-init.sh:ro
      - ${GRAFANA_DASHBOARDS_DIR}:/dashboards-src:ro
      - dashboards-out:/dashboards-out
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Grafana - UI. Anonymous admin access, no credentials anywhere.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Expanded by the datasource provisioning file.
      METRICS_DATASOURCE_NAME: ${METRICS_DATASOURCE_NAME}
      METRICS_DATASOURCE_URL: ${METRICS_DATASOURCE_URL}
      LOKI_DATASOURCE_NAME: ${LOKI_DATASOURCE_NAME}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL}
    volumes:
      - ${GRAFANA_PROVISIONING_DIR}:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      - dashboards-out:/dashboards-out:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      victoriametrics:
        condition: service_started
      loki:
        condition: service_started
      dashboards-init:
        condition: service_completed_successfully
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Loki - log storage.
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      LOGS_RETENTION: ${LOGS_RETENTION}
    volumes:
      - ${LOKI_CONFIG}:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT}:3100"
    networks:
      - observability

  # ---------------------------------------------------------------------------
  # Alloy - tails log files, pushes to Loki.
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      LOG_INCLUDE: ${LOG_INCLUDE}
      LOG_LABELS: ${LOG_LABELS}
      LOG_MULTILINE_START: ${LOG_MULTILINE_START}
    volumes:
      - ${ALLOY_CONFIG}:/etc/alloy/config.alloy:ro
      - ${LOGS_DIR}:/logs:ro
      # Positions must survive a restart, or every restart re-ingests every file.
      - alloy-data:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT}:12345"
    depends_on:
      - loki
    networks:
      - observability
