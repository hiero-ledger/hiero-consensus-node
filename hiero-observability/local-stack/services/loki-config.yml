# Loki - minimal single-binary, filesystem-backed configuration.
#
# DO NOT EDIT. Copy this file anywhere, edit your copy, and point LOKI_CONFIG
# at it in `local.env`.
#
# Run with `-config.expand-env=true`, which expands ${VAR} from the container's
# environment. Note that Loki uses ${VAR} while VictoriaMetrics uses %{VAR};
# they are different syntaxes for different tools, do not unify them.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # This is the whole point of the stack: a test run that finished hours ago
  # must still be ingestible. `reject_old_samples: true` with the usual 1h
  # max age silently drops exactly that.
  reject_old_samples: false
  retention_period: ${LOGS_RETENTION}
  volume_enabled: true

  # Loki's defaults here (4 MB/s, 6 MB burst, 3 MB/s per stream) exist to
  # protect a shared, multi-tenant cluster from a noisy neighbor - there is
  # no neighbor here, only auth_enabled: false and a single fake tenant.
  # Backfilling a run's logs at once easily bursts well past those and gets
  # rejected with "ingestion rate limit exceeded", which is exactly the
  # historical-import use case this stack exists for. Raised, not disabled,
  # so a runaway tail (e.g. a misconfigured LOG_INCLUDE matching a
  # rapidly-growing file) still hits a ceiling instead of being unbounded.
  ingestion_rate_mb: 1024
  ingestion_burst_size_mb: 2048
  per_stream_rate_limit: 1024MB
  per_stream_rate_limit_burst: 2048MB

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 1h
  # Required whenever retention is enabled.
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
